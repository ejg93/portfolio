name: collect-cheongyak

# 청약 공고 수집. 백엔드는 202 로 바로 돌려주고 작업 스레드에서 수집한다 —
# Railway HTTP 요청은 최대 15분이라 첫 백필을 요청 하나로 기다리면 끊길 수 있다. 여기서 끝날 때까지 폴링한다.
# 수집이 도는 중에 백엔드를 배포하면 그 수집은 버려진다(60분 뒤 다음 시작이 닫는다). 배포 직후 실행은 괜찮다.
on:
  schedule:
    # 18:17 KST 평일 하루 한 번. 정각·반 시각은 GitHub 예약이 몰려 늦거나 빠진다(2026-10-26 09:30 실행 누락).
    # 근거(2026-10-27, 공고 500건 2026-05-22~10-26): 공고일 월 13%·화 14%·수 18%·목 22%·금 31%·토일 0,
    # 공고일 → 접수 시작 최소 2일·중간값 5일이라 하루 한 번이면 접수 전에 잡는다.
    - cron: '17 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: collect-cheongyak
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 수집 시작 후 끝날 때까지 기다린다
        env:
          TOKEN: ${{ secrets.CHEONGYAK_COLLECT_TOKEN }}
          BASE: https://public-production-d010.up.railway.app
        run: |
          src=cron; [ "${{ github.event_name }}" = workflow_dispatch ] && src=manual
          code=$(curl -s -o start.json -w '%{http_code}' -X POST -H "X-Collect-Token: $TOKEN" --max-time 30 "$BASE/api/cheongyak/collect?src=$src")
          cat start.json; echo
          [ "$code" = 202 ] || { echo "수집 시작 실패 HTTP $code"; exit 1; }
          id=$(jq -r .id start.json)
          st=RUNNING
          for i in $(seq 1 100); do
            sleep 20
            curl -s --max-time 15 "$BASE/api/cheongyak/runs/$id" -o run.json || continue
            st=$(jq -r .status run.json)
            [ "$st" = RUNNING ] || break
          done
          cat run.json; echo
          [ "$st" = OK ] || { echo "수집 실패 또는 시간 초과: $st"; exit 1; }
