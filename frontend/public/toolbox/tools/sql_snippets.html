<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 스니펫 모음</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#1e1e1e; --surface:#252526; --border:#3c3c3c; --text:#d4d4d4; --muted:#858585; --accent:#0078d4; --green:#16825d; --oracle:#f0a500; --mysql:#00bcd4; --pg:#336791; --ms:#c586c0; --sy:#ce9178; }
body { font-family:'Consolas','D2Coding',monospace; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; flex-wrap:wrap; }
header h1 { font-size:13px; color:#ccc; letter-spacing:2px; }
.db-tabs { display:flex; gap:6px; }
.db-tab { padding:5px 16px; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold; letter-spacing:1px; border:2px solid transparent; }
.db-tab.oracle { background:rgba(240,165,0,0.15); color:var(--oracle); }
.db-tab.oracle.active { border-color:var(--oracle); }
.db-tab.mysql { background:rgba(0,188,212,0.1); color:var(--mysql); }
.db-tab.mysql.active { border-color:var(--mysql); }
.db-tab.pg { background:rgba(51,103,145,0.2); color:#5b9bd5; }
.db-tab.pg.active { border-color:#5b9bd5; }
.db-tab.mssql { background:rgba(197,134,192,0.12); color:var(--ms); }
.db-tab.mssql.active { border-color:var(--ms); }
.db-tab.sybase { background:rgba(206,145,120,0.12); color:var(--sy); }
.db-tab.sybase.active { border-color:var(--sy); }
.search-wrap { display:flex; align-items:center; gap:6px; margin-left:auto; }
.search-wrap input { background:#3c3c3c; border:1px solid #555; border-radius:3px; color:var(--text); font-family:'Consolas',monospace; font-size:12px; padding:5px 10px; outline:none; width:200px; }
.search-wrap input:focus { border-color:var(--accent); }
.search-wrap .clear-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:0 4px; }
.main { flex:1; display:flex; overflow:hidden; }
.sidebar { width:200px; background:var(--surface); border-right:1px solid var(--border); padding:8px 6px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; flex-shrink:0; }
.sidebar-label { font-size:9px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; padding:8px 8px 4px; }
.snip-btn { padding:7px 10px; border-radius:4px; cursor:pointer; font-size:12px; color:#ccc; transition:background 0.1s; border:none; background:transparent; text-align:left; width:100%; font-family:'Consolas',monospace; }
.snip-btn:hover { background:#2a2d2e; }
.snip-btn.active { background:#094771; color:#fff; }
.snip-btn.hidden { display:none; }
.no-results { font-size:11px; color:var(--muted); padding:12px 10px; }
.content { flex:1; display:flex; flex-direction:column; overflow:hidden; padding:14px; gap:10px; }
.query-header { display:flex; justify-content:space-between; align-items:flex-start; }
.query-title { font-size:13px; color:#ccc; font-weight:bold; }
.query-desc { font-size:11px; color:var(--muted); margin-top:2px; }
.input-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.input-row label { font-size:11px; color:var(--muted); white-space:nowrap; }
input[type=text] { background:#3c3c3c; border:1px solid #555; border-radius:3px; color:var(--text); font-family:'Consolas',monospace; font-size:12px; padding:5px 8px; outline:none; }
input[type=text]:focus { border-color:var(--accent); }
textarea { flex:1; background:#111; border:1px solid var(--border); border-radius:4px; color:#9cdcfe; font-family:'Consolas','D2Coding',monospace; font-size:13px; padding:14px; resize:none; outline:none; line-height:1.8; overflow:auto; }
.q-pre { flex:1; background:#111; border:1px solid var(--border); border-radius:4px; color:#9cdcfe; font-family:'Consolas','D2Coding',monospace; font-size:13px; padding:14px; line-height:1.8; overflow:auto; white-space:pre; margin:0; }
.q-pre .bind { color:var(--oracle); font-weight:bold; }
button { font-family:'Consolas',monospace; font-size:12px; border:none; border-radius:4px; cursor:pointer; padding:6px 16px; letter-spacing:1px; }
.btn-green { background:var(--green); color:#fff; }
.btn-g { background:#3c3c3c; color:var(--text); }
.fav-btn { background:none; border:none; cursor:pointer; font-size:14px; padding:2px 6px; color:var(--muted); }
.fav-btn.active { color:#f0a500; }
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:8px 20px; border-radius:20px; font-size:12px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:999; }
.sidebar, .content, .q-pre, textarea { scrollbar-width:thin; scrollbar-color:#454545 transparent; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#3a3a3a; border-radius:6px; border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:#565656; border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-corner { background:transparent; }
</style>
</head>
<body>
<header>
  <h1>SQL SNIPPETS</h1>
  <div class="db-tabs">
    <div class="db-tab oracle active" onclick="switchDb('oracle')">Oracle</div>
    <div class="db-tab mysql" onclick="switchDb('mysql')">MySQL/MariaDB</div>
    <div class="db-tab pg" onclick="switchDb('pg')">PostgreSQL</div>
    <div class="db-tab mssql" onclick="switchDb('mssql')">SQL Server</div>
    <div class="db-tab sybase" onclick="switchDb('sybase')">Sybase ASE</div>
  </div>
  <div class="search-wrap">
    <input type="text" id="search_input" placeholder="스니펫 검색..." oninput="filterSnippets()">
    <button class="clear-btn" onclick="clearSearch()" title="검색 초기화">✕</button>
  </div>
</header>
<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="content">
    <div>
      <div class="query-header">
        <div>
          <div class="query-title" id="q_title">좌측에서 항목 선택</div>
          <div class="query-desc" id="q_desc"></div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="fav-btn" id="fav_btn" title="즐겨찾기" onclick="toggleFav()">☆</button>
          <button class="btn-green" onclick="copyQuery()">복사</button>
        </div>
      </div>
    </div>
    <div class="input-row" id="param_row" style="display:none"></div>
    <pre id="q_output" class="q-pre"><span style="color:var(--muted)">항목을 선택하면 쿼리가 표시된다</span></pre>
  </div>
</div>
<div id="toast"></div>

<script>
var currentDb = 'oracle';
var currentKey = null;
var currentItem = null;
var currentQuery = '';
var favorites = {}; 
try { favorites = JSON.parse(localStorage.getItem('sql_favs') || '{}') || {}; } catch(e) {}

var SNIPPETS = {
  oracle: [
    {
      category: '테이블',
      items: [
        {
          key: 'tbl_list', label: '테이블 목록 조회', desc: '이름으로 검색 (LIKE)',
          params: [{id:'tbl_search', label:'테이블명 (빈칸=전체)', placeholder:'USER%', width:180}],
          query: function(p) {
            var s = p.tbl_search || '%';
            if (s && s.indexOf('%') < 0) s = '%' + s + '%';
            return "SELECT TABLE_NAME\n     , NUM_ROWS\n     , LAST_ANALYZED\nFROM   ALL_TABLES\nWHERE  OWNER = USER\n  AND  TABLE_NAME LIKE '" + (s||'%') + "'\nORDER BY TABLE_NAME;";
          }
        },
        {
          key: 'col_list', label: '컬럼 목록 조회', desc: '컬럼 정의 + 코멘트 조인 조회',
          params: [{id:'col_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.col_tbl || 'TABLE_NAME';
            return "SELECT A.OWNER\n     , A.TABLE_NAME\n     , A.COLUMN_ID\n     , A.COLUMN_NAME\n     , A.DATA_TYPE\n     , A.DATA_LENGTH\n     , A.DATA_SCALE\n     , A.NULLABLE\n     , A.DATA_DEFAULT\n     , B.COMMENTS\n     , CASE WHEN pk.POSITION IS NOT NULL THEN 'Y' ELSE 'N' END AS IS_PK\n     , CASE WHEN pk.POSITION IS NOT NULL THEN 'PK'||LPAD(pk.POSITION,2,'0') END AS PK정보\n     , CASE WHEN ak.POSITION IS NOT NULL THEN 'AK_1-'||LPAD(ak.POSITION,2,'0') END AS AK정보\n     , fk.REF AS FK정보\n     , CASE WHEN REGEXP_LIKE(A.COLUMN_NAME, 'NM$|NAME$|BRDT$|ADDR$|TEL$|HP$|PHONE$|RRN$|JMIN$|EMAIL$|MAIL$')\n            THEN 'Y' ELSE 'N' END AS 개인정보여부_추정\nFROM   ALL_TAB_COLUMNS  A\n     LEFT JOIN ALL_COL_COMMENTS B\n            ON B.OWNER = A.OWNER AND B.TABLE_NAME = A.TABLE_NAME AND B.COLUMN_NAME = A.COLUMN_NAME\n     LEFT JOIN (SELECT ucc.TABLE_NAME, ucc.COLUMN_NAME, ucc.POSITION\n                FROM   ALL_CONSTRAINTS uc JOIN ALL_CONS_COLUMNS ucc\n                       ON uc.OWNER = ucc.OWNER AND uc.CONSTRAINT_NAME = ucc.CONSTRAINT_NAME\n                WHERE  uc.CONSTRAINT_TYPE = 'P' AND uc.OWNER = USER) pk\n            ON A.TABLE_NAME = pk.TABLE_NAME AND A.COLUMN_NAME = pk.COLUMN_NAME\n     LEFT JOIN (SELECT ucc.TABLE_NAME, ucc.COLUMN_NAME, ucc.POSITION\n                FROM   ALL_CONSTRAINTS uc JOIN ALL_CONS_COLUMNS ucc\n                       ON uc.OWNER = ucc.OWNER AND uc.CONSTRAINT_NAME = ucc.CONSTRAINT_NAME\n                WHERE  uc.CONSTRAINT_TYPE = 'U' AND uc.OWNER = USER) ak\n            ON A.TABLE_NAME = ak.TABLE_NAME AND A.COLUMN_NAME = ak.COLUMN_NAME\n     LEFT JOIN (SELECT ucc.TABLE_NAME, ucc.COLUMN_NAME, rt.TABLE_NAME||'.'||rcc.COLUMN_NAME AS REF\n                FROM   ALL_CONSTRAINTS uc\n                       JOIN ALL_CONS_COLUMNS ucc ON uc.OWNER = ucc.OWNER AND uc.CONSTRAINT_NAME = ucc.CONSTRAINT_NAME\n                       JOIN ALL_CONSTRAINTS ruc ON uc.R_OWNER = ruc.OWNER AND uc.R_CONSTRAINT_NAME = ruc.CONSTRAINT_NAME\n                       JOIN ALL_CONS_COLUMNS rcc ON ruc.OWNER = rcc.OWNER AND ruc.CONSTRAINT_NAME = rcc.CONSTRAINT_NAME\n                            AND ucc.POSITION = rcc.POSITION\n                       JOIN ALL_TABLES rt ON ruc.OWNER = rt.OWNER AND ruc.TABLE_NAME = rt.TABLE_NAME\n                WHERE  uc.CONSTRAINT_TYPE = 'R' AND uc.OWNER = USER) fk\n            ON A.TABLE_NAME = fk.TABLE_NAME AND A.COLUMN_NAME = fk.COLUMN_NAME\nWHERE  A.OWNER = USER\n  AND  A.TABLE_NAME = '" + t.toUpperCase() + "'\nORDER BY A.COLUMN_ID;\n-- 열 순서는 논리명_변환기.html «3.컬럼 목록»(OWNER/TABLE_NAME/COLUMN_ID/COLUMN_NAME/DATA_TYPE/DATA_LENGTH/IS_PK) 필수+FK추론 요건과\n-- 컬럼정의서(영문테이블명·영문컬럼명·데이터타입·데이터길이·NotNull·PK/AK/FK·개인정보여부) 요건을 동시에 맞춤\n-- IS_PK=Y/N(논리명_변환기용) · PK정보=PK01식 참여순서(별표2 서식용) 둘로 나눠서 양쪽 다 충족";
          }
        },
        {
          key: 'tbl_size', label: '테이블 용량 조회', desc: '용량 많이 차지하는 테이블',
          params: [],
          query: function(p) {
            return "SELECT SEGMENT_NAME AS TABLE_NAME\n     , ROUND(BYTES / 1024 / 1024, 2) AS SIZE_MB\nFROM   USER_SEGMENTS\nWHERE  SEGMENT_TYPE = 'TABLE'\nORDER BY BYTES DESC;";
          }
        },
        {
          key: 'fk_ref', label: 'FK 참조 관계 조회', desc: '특정 테이블 참조 확인',
          params: [{id:'fk_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.fk_tbl || 'TABLE_NAME';
            return "SELECT A.TABLE_NAME      AS 참조하는테이블\n     , A.CONSTRAINT_NAME  AS FK명\n     , B.TABLE_NAME      AS 참조당하는테이블\n     , B.COLUMN_NAME     AS 참조컬럼\nFROM   ALL_CONSTRAINTS  A\n     , ALL_CONS_COLUMNS B\nWHERE  A.R_CONSTRAINT_NAME = B.CONSTRAINT_NAME\n  AND  A.CONSTRAINT_TYPE   = 'R'\n  AND  B.TABLE_NAME = '" + t.toUpperCase() + "'\nORDER BY A.TABLE_NAME;";
          }
        },
        {
          key: 'tbl_ddl', label: 'DDL 추출 (DBMS_METADATA)', desc: 'CREATE TABLE DDL 원본 추출',
          params: [{id:'ddl_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.ddl_tbl || 'TABLE_NAME';
            return "-- DDL 결과에 줄바꿈 적용\nEXECUTE DBMS_METADATA.SET_TRANSFORM_PARAM(DBMS_METADATA.SESSION_TRANSFORM,'SQLTERMINATOR',TRUE);\nEXECUTE DBMS_METADATA.SET_TRANSFORM_PARAM(DBMS_METADATA.SESSION_TRANSFORM,'PRETTY',TRUE);\n\nSELECT DBMS_METADATA.GET_DDL('TABLE', '" + t.toUpperCase() + "') AS DDL\nFROM   DUAL;";
          }
        },
        {
          key: 'tbl_comment', label: '테이블/컬럼 주석 조회', desc: '테이블 및 컬럼 comment 확인',
          params: [{id:'comment_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.comment_tbl || 'TABLE_NAME';
            return "-- 테이블 주석\nSELECT TABLE_NAME, COMMENTS\nFROM   ALL_TAB_COMMENTS\nWHERE  OWNER = USER\n  AND  TABLE_NAME = '" + t.toUpperCase() + "';\n\n-- 컬럼 주석\nSELECT COLUMN_NAME, COMMENTS\nFROM   ALL_COL_COMMENTS\nWHERE  OWNER = USER\n  AND  TABLE_NAME = '" + t.toUpperCase() + "'\nORDER BY COLUMN_NAME;";
          }
        },
        {
          key: 'tablespace', label: '테이블스페이스 용량', desc: '사용량 및 여유 공간 확인',
          params: [],
          query: function(p) {
            return "SELECT DF.TABLESPACE_NAME\n     , ROUND(DF.BYTES / 1024 / 1024, 1)           AS TOTAL_MB\n     , ROUND((DF.BYTES - NVL(FS.BYTES,0)) / 1024 / 1024, 1) AS USED_MB\n     , ROUND(NVL(FS.BYTES,0) / 1024 / 1024, 1)   AS FREE_MB\n     , ROUND((1 - NVL(FS.BYTES,0) / DF.BYTES) * 100, 1) AS USED_PCT\nFROM (\n  SELECT TABLESPACE_NAME, SUM(BYTES) BYTES\n  FROM   DBA_DATA_FILES\n  GROUP BY TABLESPACE_NAME\n) DF\nLEFT JOIN (\n  SELECT TABLESPACE_NAME, SUM(BYTES) BYTES\n  FROM   DBA_FREE_SPACE\n  GROUP BY TABLESPACE_NAME\n) FS ON DF.TABLESPACE_NAME = FS.TABLESPACE_NAME\nORDER BY USED_PCT DESC;";
          }
        },
        {
          key: 'grp_count', label: '그룹핑 카운트', desc: '코드성 컬럼 값 분포 확인',
          params: [
            {id:'grp_tbl', label:'테이블명', placeholder:'USER_INFO', width:160},
            {id:'grp_col', label:'컬럼명', placeholder:'USE_YN', width:120}
          ],
          query: function(p) {
            var t = (p.grp_tbl || 'TABLE_NAME').toUpperCase();
            var c = (p.grp_col || 'COLUMN_NAME').toUpperCase();
            return "SELECT " + c + "\n     , COUNT(*) AS CNT\nFROM   " + t + "\nGROUP BY " + c + "\nORDER BY CNT DESC;";
          }
        },
      ]
    },
    {
      category: '인덱스',
      items: [
        {
          key: 'idx_list', label: '인덱스 목록 조회', desc: '테이블의 인덱스 및 컬럼',
          params: [{id:'idx_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.idx_tbl || 'TABLE_NAME';
            return "SELECT I.INDEX_NAME\n     , C.COLUMN_NAME\n     , C.COLUMN_POSITION\n     , I.UNIQUENESS\n     , I.STATUS\nFROM   ALL_INDEXES    I\n     , ALL_IND_COLUMNS C\nWHERE  I.OWNER      = USER\n  AND  I.TABLE_NAME  = '" + t.toUpperCase() + "'\n  AND  I.INDEX_NAME  = C.INDEX_NAME\nORDER BY I.INDEX_NAME, C.COLUMN_POSITION;";
          }
        },
        {
          key: 'idx_usage', label: '인덱스 사용 현황', desc: '안 쓰이는 인덱스 확인',
          params: [],
          query: function(p) {
            return "-- Oracle 12c 이상 (V$OBJECT_USAGE는 12c부터 폐기 예고, 23ai·26ai에 없다)\nSELECT TABLE_NAME\n     , INDEX_NAME\n     , MONITORING\n     , USED\n     , START_MONITORING\n     , END_MONITORING\nFROM   USER_OBJECT_USAGE\nORDER BY TABLE_NAME, INDEX_NAME;\n\n-- Oracle 11g 이하 (USER_OBJECT_USAGE가 없다)\nSELECT TABLE_NAME\n     , INDEX_NAME\n     , MONITORING\n     , USED\n     , START_MONITORING\n     , END_MONITORING\nFROM   V$OBJECT_USAGE\nORDER BY TABLE_NAME, INDEX_NAME;";
          }
        },
      ]
    },
    {
      category: '시퀀스',
      items: [
        {
          key: 'seq_list', label: '시퀀스 목록 조회', desc: '전체 시퀀스 및 현재값',
          params: [],
          query: function(p) {
            return "SELECT SEQUENCE_NAME\n     , MIN_VALUE\n     , MAX_VALUE\n     , INCREMENT_BY\n     , LAST_NUMBER\n     , CYCLE_FLAG\nFROM   USER_SEQUENCES\nORDER BY SEQUENCE_NAME;";
          }
        },
        {
          key: 'seq_curr', label: '시퀀스 현재/다음값', desc: 'CURRVAL / NEXTVAL 조회',
          params: [{id:'seq_name', label:'시퀀스명', placeholder:'SEQ_USER_ID', width:180}],
          query: function(p) {
            var s = p.seq_name || 'SEQ_NAME';
            return "SELECT " + s + ".CURRVAL FROM DUAL;\n-- 또는 다음 채번\nSELECT " + s + ".NEXTVAL FROM DUAL;";
          }
        },
        {
          key: 'seq_reset', label: '시퀀스 값 초기화', desc: '현재값을 특정 값으로 리셋',
          params: [
            {id:'seq_reset_name', label:'시퀀스명', placeholder:'SEQ_USER_ID', width:160},
            {id:'seq_reset_val', label:'목표값', placeholder:'1', width:80}
          ],
          query: function(p) {
            var s = p.seq_reset_name || 'SEQ_NAME';
            var v = p.seq_reset_val || '1';
            return "-- 현재값 확인 후 INCREMENT 조정으로 리셋\nDECLARE\n  v_curr NUMBER;\nBEGIN\n  SELECT " + s + ".NEXTVAL INTO v_curr FROM DUAL;\n  EXECUTE IMMEDIATE 'ALTER SEQUENCE " + s + " INCREMENT BY ' || (" + v + " - v_curr - 1);\n  SELECT " + s + ".NEXTVAL INTO v_curr FROM DUAL;\n  EXECUTE IMMEDIATE 'ALTER SEQUENCE " + s + " INCREMENT BY 1';\n  DBMS_OUTPUT.PUT_LINE('완료: ' || v_curr);\nEND;\n/";
          }
        },
      ]
    },
    {
      category: '성능/모니터링',
      items: [
        {
          key: 'explain', label: '실행 계획', desc: '쿼리 성능 분석',
          params: [{id:'exp_sql', label:'쿼리', placeholder:'SELECT * FROM USER_INFO', width:300}],
          query: function(p) {
            var sql = p.exp_sql || 'SELECT * FROM TABLE_NAME';
            return "EXPLAIN PLAN FOR\n" + sql + ";\n\nSELECT * FROM TABLE(DBMS_XPLAN.DISPLAY);";
          }
        },
        {
          key: 'slow_sql', label: '느린 SQL 찾기', desc: '평균 실행시간 기준 TOP 20',
          params: [],
          query: function(p) {
            return "-- 범위: 공유 풀에 살아 있는 커서만 나온다\n--       재기동했거나 캐시에서 밀려난 SQL은 여기 없다\n\nSELECT *\nFROM (\n  SELECT SQL_ID\n       , EXECUTIONS\n       , ROUND(ELAPSED_TIME / EXECUTIONS / 1000, 2) AS AVG_MS\n       , ROUND(ELAPSED_TIME / 1000, 2)               AS TOTAL_MS\n       , SQL_TEXT\n  FROM (\n    SELECT A.SQL_ID\n         , A.EXECUTIONS\n         , A.ELAPSED_TIME\n         , B.SQL_TEXT\n    FROM   V$SQL     A\n         , V$SQLTEXT B\n    WHERE  A.SQL_ID    = B.SQL_ID\n      AND  A.EXECUTIONS > 0\n      AND  B.PIECE = 0\n  )\n  ORDER BY AVG_MS DESC\n)\nWHERE ROWNUM <= 20;\n\n-- ROWNUM으로 자른 이유 — FETCH FIRST n ROWS ONLY는 Oracle 12c 이상 문법이다\n-- 11g 이하나 Tibero에 반입하면 구문 오류가 난다";
          }
        },
        {
          key: 'session', label: '활성 세션 확인', desc: '현재 접속 세션 목록',
          params: [],
          query: function(p) {
            return "SELECT SID\n     , USERNAME\n     , STATUS\n     , MACHINE\n     , PROGRAM\n     , SQL_ID\n     , EVENT          AS 대기이벤트\n     , LAST_CALL_ET   AS 경과초\nFROM   V$SESSION\nWHERE  USERNAME IS NOT NULL\nORDER BY LAST_CALL_ET DESC;\n\n-- EVENT가 무엇을 기다리는지 알려준다\n--   db file sequential read   인덱스로 블록을 하나씩 읽는 중\n--   db file scattered read    풀스캔으로 여러 블록을 읽는 중\n--   enq: TX - row lock contention   다른 세션이 잡은 락을 기다리는 중\n--   SQL*Net message from client     노는 중. DB 문제가 아니다\n\n-- Oracle 전용 추가 — 누가 누구를 막고 있는지 본다\n-- 아래 컬럼은 Tibero 참조안내서에 없다. 폐쇄망 반입 전 확인할 것\n-- SELECT SID, USERNAME, EVENT, WAIT_CLASS, SECONDS_IN_WAIT, BLOCKING_SESSION\n-- FROM   V$SESSION\n-- WHERE  USERNAME IS NOT NULL\n--   AND  BLOCKING_SESSION IS NOT NULL;";
          }
        },
        {
          key: 'lock', label: '락(Lock) 조회', desc: '락 걸린 세션 및 대상 객체',
          params: [],
          query: function(p) {
            return "SELECT L1.SID           AS HOLDING_SID\n     , S1.USERNAME      AS HOLDING_USER\n     , L2.SID           AS WAITING_SID\n     , S2.USERNAME      AS WAITING_USER\n     , O.OBJECT_NAME    AS LOCKED_OBJECT\nFROM   V$LOCK    L1\n     , V$LOCK    L2\n     , V$SESSION S1\n     , V$SESSION S2\n     , ALL_OBJECTS O\nWHERE  L1.BLOCK = 1\n  AND  L2.REQUEST > 0\n  AND  L1.ID1 = L2.ID1\n  AND  L1.ID2 = L2.ID2\n  AND  L1.SID = S1.SID\n  AND  L2.SID = S2.SID\n  AND  L1.ID1 = O.OBJECT_ID\nORDER BY L1.SID;";
          }
        },
        {
          key: 'uncommit', label: '미커밋 트랜잭션', desc: '커밋 안 된 오래된 트랜잭션',
          params: [],
          query: function(p) {
            return "SELECT S.SID\n     , S.USERNAME\n     , S.STATUS\n     , T.START_TIME\n     , T.USED_UBLK * 8 / 1024 AS UNDO_MB\nFROM   V$SESSION     S\n     , V$TRANSACTION T\nWHERE  S.TADDR = T.ADDR\nORDER BY T.START_TIME;";
          }
        },
        {
          key: 'kill_session', label: '세션 종료', desc: '특정 SID 세션 강제 종료',
          params: [{id:'kill_sid', label:'SID', placeholder:'123', width:80}, {id:'kill_serial', label:'SERIAL#', placeholder:'456', width:80}],
          query: function(p) {
            var sid = p.kill_sid || 'SID';
            var serial = p.kill_serial || 'SERIAL#';
            return "-- 먼저 세션 확인\nSELECT SID, SERIAL#, USERNAME, STATUS, MACHINE\nFROM   V$SESSION\nWHERE  SID = " + sid + ";\n\n-- 세션 종료 (주의: DBA 권한 필요)\nALTER SYSTEM KILL SESSION '" + sid + "," + serial + "' IMMEDIATE;";
          }
        },
      ]
    },
    {
      category: '쿼리 진단',
      items: [
        {
          key: 'plan_actual', label: '실측 실행계획', desc: '방금 돌린 쿼리의 단계별 실제 행수·읽은 블록·소요시간을 DBMS_XPLAN으로 뽑아 추정치와 대조하는 쿼리',
          params: [{id:'pa_sql', label:'쿼리', placeholder:'SELECT * FROM USER_INFO WHERE REG_DT >= SYSDATE-30', width:340}],
          query: function(p) {
            var sql = p.pa_sql || 'SELECT * FROM TABLE_NAME WHERE 1=1';
            var hinted = /^\s*SELECT\b/i.test(sql)
              ? sql.replace(/^(\s*SELECT)\b/i, "$1 /*+ GATHER_PLAN_STATISTICS */")
              : "SELECT /*+ GATHER_PLAN_STATISTICS */ ... -- 아래 쿼리 앞에 힌트를 직접 넣는다\n" + sql;
            return "-- 전제: Oracle 10g 이상. DBMS_XPLAN은 Tibero 참조안내서에 없다 — Tibero면 맨 아래 대안 사용\n"
                 + "-- 권한: V$SQL_PLAN_STATISTICS_ALL 조회 권한 필요. 없으면 ORA-00942\n"
                 + "-- 주의: 계측 오버헤드가 있다. 진단할 때만 켜고 운영 쿼리에 상시로 두지 않는다\n\n"
                 + "-- 1. 계측 켜기 — SQL*Plus면 SERVEROUTPUT도 끈다\n"
                 + "--    켜져 있으면 DISPLAY_CURSOR(NULL, NULL)이 마지막 문장(DBMS_OUTPUT 호출)을 잡아\n"
                 + "--    cannot fetch plan 이 나온다\n"
                 + "SET SERVEROUTPUT OFF\nALTER SESSION SET STATISTICS_LEVEL = ALL;\n\n"
                 + "-- 2. 대상 쿼리 — 3회 이상 돌리고 2회차 이후만 쓴다\n"
                 + "--    1회차는 하드 파싱과 물리 I/O가 섞여 있어 비교에 못 쓴다\n"
                 + hinted + ";\n\n"
                 + "-- 3. 실측 결과 보기\nSELECT * FROM TABLE(DBMS_XPLAN.DISPLAY_CURSOR(NULL, NULL, 'ALLSTATS LAST'));\n\n"
                 + "-- 4. 원상복구\nALTER SESSION SET STATISTICS_LEVEL = TYPICAL;\n\n"
                 + "-- 보는 곳\n"
                 + "--   A-Rows   실제 나온 행수        E-Rows  옵티마이저 예상 행수\n"
                 + "--   Buffers  읽은 블록 수          Reads   디스크에서 읽은 블록 수\n"
                 + "--   A-Time   단계별 실제 소요시간\n"
                 + "-- E-Rows와 A-Rows가 자릿수로 벌어지면 통계가 실제와 어긋난 것이다\n"
                 + "-- TABLE ACCESS BY INDEX ROWID 줄이 있으면 인덱스로 찾은 뒤 테이블을 또 읽고 있다\n\n"
                 + "-- Tibero 대안 — DBMS_XPLAN 없이 V$SQL_PLAN_STATISTICS 를 SQL_ID로 직접 조회한다\n"
                 + "--               컬럼 구성은 Tibero 참조안내서 ch_dynamic_view.html 확인";
          }
        },
        {
          key: 'sql_find', label: 'SQL 찾기 (텍스트로)', desc: 'SQL 텍스트 조각으로 공유 풀에 남은 커서를 찾아 SQL_ID·실행계획 해시·실행당 시간과 블록수를 뽑는 쿼리',
          params: [{id:'sf_text', label:'SQL 텍스트 조각', placeholder:'USER_INFO', width:240}],
          query: function(p) {
            var t = p.sf_text || 'TABLE_NAME';
            return "-- 전제: Oracle·Tibero 공통. V$SQL은 양쪽 참조안내서에 모두 있다\n"
                 + "-- 권한: V$SQL 조회 권한 필요 (SELECT_CATALOG_ROLE 등)\n"
                 + "-- 범위: 공유 풀에 살아 있는 커서만 나온다\n"
                 + "--       재기동했거나 캐시에서 밀려났으면 안 나온다. 도구 문제가 아니다\n\n"
                 + "SELECT SQL_ID\n"
                 + "     , CHILD_NUMBER\n"
                 + "     , PLAN_HASH_VALUE\n"
                 + "     , EXECUTIONS\n"
                 + "     , ROUND(ELAPSED_TIME / DECODE(EXECUTIONS,0,1,EXECUTIONS) / 1000, 2) AS AVG_MS\n"
                 + "     , ROUND(BUFFER_GETS  / DECODE(EXECUTIONS,0,1,EXECUTIONS))          AS GETS_PER_EXEC\n"
                 + "     , ROUND(DISK_READS   / DECODE(EXECUTIONS,0,1,EXECUTIONS))          AS READS_PER_EXEC\n"
                 + "     , SUBSTR(SQL_TEXT, 1, 120) AS SQL_TEXT\n"
                 + "FROM   V$SQL\n"
                 + "WHERE  SQL_TEXT LIKE '%" + t + "%'\n"
                 + "  AND  SQL_TEXT NOT LIKE '%V$SQL%'\n"
                 + "ORDER BY ELAPSED_TIME DESC;\n\n"
                 + "-- 두 쿼리를 비교할 때\n"
                 + "--   PLAN_HASH_VALUE가 같으면 실행계획이 동일하다\n"
                 + "--   → 시간 차의 원인은 계획이 아니라 캐시·파싱·클라이언트 fetch 쪽이다\n"
                 + "--   PLAN_HASH_VALUE가 다르면 계획이 갈린 것이다. 각각의 계획을 꺼내 본다";
          }
        },
        {
          key: 'plan_by_id', label: 'SQL_ID로 실행계획', desc: '운영에서 이미 돈 커서의 실행계획을 SQL_ID로 캐시에서 꺼내 보는 쿼리',
          params: [
            {id:'pb_sqlid', label:'SQL_ID', placeholder:'a1b2c3d4e5f6g', width:160},
            {id:'pb_child', label:'CHILD_NUMBER', placeholder:'0', width:90}
          ],
          query: function(p) {
            var id = p.pb_sqlid || 'SQL_ID';
            var ch = p.pb_child === '' || p.pb_child === undefined ? 'NULL' : p.pb_child;
            return "-- 전제: Oracle 10g 이상. DBMS_XPLAN은 Tibero 참조안내서에 없다\n"
                 + "-- 용도: 쿼리를 다시 돌리지 않고 실제 계획만 본다. 운영에 부하를 주지 않는다\n"
                 + "-- 한계: 운영은 보통 STATISTICS_LEVEL이 TYPICAL이라 A-Rows·A-Time 칸이 빈다\n"
                 + "--       계획 구조와 E-Rows는 그대로 나오므로 계획 비교에는 충분하다\n\n"
                 + "SELECT * FROM TABLE(\n"
                 + "  DBMS_XPLAN.DISPLAY_CURSOR('" + id + "', " + ch + ", 'ALLSTATS LAST')\n"
                 + ");\n\n"
                 + "-- CHILD_NUMBER에 NULL을 넣으면 그 SQL_ID의 자식 커서를 전부 보여준다\n\n"
                 + "-- Tibero 대안 — V$SQL_PLAN 을 SQL_ID로 직접 조회한다\n"
                 + "--               컬럼 구성은 Tibero 참조안내서 ch_dynamic_view.html 확인";
          }
        },
        {
          key: 'cursor_child', label: '자식 커서 비교', desc: '같은 SQL_ID의 자식 커서를 나열해 커서마다 실행계획 해시가 다른지 확인하는 쿼리',
          params: [{id:'cc_sqlid', label:'SQL_ID', placeholder:'a1b2c3d4e5f6g', width:160}],
          query: function(p) {
            var id = p.cc_sqlid || 'SQL_ID';
            return "-- 전제: Oracle·Tibero 공통. CHILD_NUMBER·PLAN_HASH_VALUE는 양쪽 문서에 있다\n"
                 + "-- 판정: PLAN_HASH_VALUE가 자식마다 다르면 같은 SQL이 서로 다른 계획으로 돌고 있다\n\n"
                 + "SELECT CHILD_NUMBER\n"
                 + "     , PLAN_HASH_VALUE\n"
                 + "     , EXECUTIONS\n"
                 + "     , ROUND(ELAPSED_TIME / DECODE(EXECUTIONS,0,1,EXECUTIONS) / 1000, 2) AS AVG_MS\n"
                 + "     , ROUND(BUFFER_GETS  / DECODE(EXECUTIONS,0,1,EXECUTIONS))          AS GETS_PER_EXEC\n"
                 + "FROM   V$SQL\n"
                 + "WHERE  SQL_ID = '" + id + "'\n"
                 + "ORDER BY CHILD_NUMBER;\n\n"
                 + "-- 계획이 갈리는 흔한 이유\n"
                 + "--   바인드 값에 따라 옵티마이저가 다른 계획을 고름\n"
                 + "--   세션마다 옵티마이저 설정이 다름\n"
                 + "--   스키마가 달라 같은 이름의 다른 테이블을 봄\n\n"
                 + "-- Oracle 전용 추가 — 바인드 값에 따라 계획을 나누는 중인지 본다\n"
                 + "-- 아래 두 컬럼은 Tibero 참조안내서에 없다. 폐쇄망 반입 전 확인할 것\n"
                 + "-- SELECT CHILD_NUMBER, PLAN_HASH_VALUE, IS_BIND_SENSITIVE, IS_BIND_AWARE\n"
                 + "-- FROM   V$SQL\n"
                 + "-- WHERE  SQL_ID = '" + id + "';\n"
                 + "--   IS_BIND_SENSITIVE = Y  바인드 값에 따라 성능이 갈릴 수 있다고 표시된 상태\n"
                 + "--   IS_BIND_AWARE     = Y  실제로 값 범위별로 계획을 나눠 쓰는 중";
          }
        },
        {
          key: 'stat_fresh', label: '통계 신선도 확인', desc: '테이블의 통계상 행수와 실제 행수를 나란히 뽑아 통계가 언제 수집됐고 얼마나 어긋났는지 보는 쿼리',
          params: [{id:'sfr_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = (p.sfr_tbl || 'TABLE_NAME').toUpperCase();
            return "-- 전제: Oracle·Tibero 공통. ALL_TAB_STATISTICS·STALE_STATS는 양쪽 문서에 있다\n"
                 + "-- 판정: 옵티마이저는 실시간 데이터가 아니라 아래 통계값으로 계획을 고른다\n"
                 + "--       NUM_ROWS와 실제 건수가 자릿수로 벌어지면 잘못된 규모로 계산하고 있다\n\n"
                 + "SELECT TABLE_NAME\n"
                 + "     , NUM_ROWS                                     AS 통계상_행수\n"
                 + "     , BLOCKS\n"
                 + "     , AVG_ROW_LEN\n"
                 + "     , STALE_STATS\n"
                 + "     , TO_CHAR(LAST_ANALYZED, 'YYYY-MM-DD HH24:MI') AS LAST_ANALYZED\n"
                 + "FROM   ALL_TAB_STATISTICS\n"
                 + "WHERE  OWNER = USER\n"
                 + "  AND  TABLE_NAME = '" + t + "'\n"
                 + "  AND  PARTITION_NAME IS NULL;\n\n"
                 + "-- 실제 건수와 대조\nSELECT COUNT(*) AS 실제_행수 FROM " + t + ";\n\n"
                 + "-- LAST_ANALYZED가 몇 달 전이거나 STALE_STATS가 YES면 통계를 다시 수집한다\n"
                 + "-- BEGIN DBMS_STATS.GATHER_TABLE_STATS(USER, '" + t + "'); END;\n"
                 + "-- /";
          }
        },
        {
          key: 'tbl_shape', label: '테이블 행 구조', desc: '테이블의 행 길이·블록수·컬럼 개수와 LOB 컬럼 수를 뽑아 SELECT * 가 비싼 구조인지 보는 쿼리',
          params: [{id:'ts_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = (p.ts_tbl || 'TABLE_NAME').toUpperCase();
            return "-- 전제: Oracle·Tibero 공통 (CHAIN_CNT만 Oracle 전용, 맨 아래 참고)\n"
                 + "-- 판정: AVG_ROW_LEN이 크거나 LOB 컬럼이 있으면 SELECT * 가 컬럼 명시보다 확실히 비싸다\n"
                 + "--       반대로 행이 짧고 컬럼이 몇 개뿐이면 둘의 차이는 거의 없다\n\n"
                 + "-- 행 크기와 규모\n"
                 + "SELECT NUM_ROWS\n"
                 + "     , BLOCKS\n"
                 + "     , AVG_ROW_LEN\n"
                 + "     , TO_CHAR(LAST_ANALYZED, 'YYYY-MM-DD') AS LAST_ANALYZED\n"
                 + "FROM   ALL_TABLES\n"
                 + "WHERE  OWNER = USER AND TABLE_NAME = '" + t + "';\n\n"
                 + "-- 컬럼 개수와 LOB 컬럼 수\n"
                 + "SELECT COUNT(*) AS COL_CNT\n"
                 + "     , SUM(CASE WHEN DATA_TYPE IN ('CLOB','BLOB','NCLOB','LONG','XMLTYPE')\n"
                 + "                THEN 1 ELSE 0 END) AS LOB_CNT\n"
                 + "FROM   ALL_TAB_COLUMNS\n"
                 + "WHERE  OWNER = USER AND TABLE_NAME = '" + t + "';\n\n"
                 + "-- LOB_CNT가 0보다 크면 SELECT * 가 LOB 로케이터까지 끌고 온다\n\n"
                 + "-- Oracle 전용 — 행이 블록 여러 개에 걸쳐 저장됐는지 본다\n"
                 + "-- CHAIN_CNT는 Tibero 참조안내서 딕셔너리 장에 없다. 반입 전 확인할 것\n"
                 + "-- SELECT CHAIN_CNT FROM ALL_TABLES WHERE OWNER = USER AND TABLE_NAME = '" + t + "';\n"
                 + "-- 0보다 크면 조각을 따라다니느라 SELECT * 가 더 비싸진다";
          }
        },
        {
          key: 'idx_cf', label: '인덱스 효율 (CF)', desc: '테이블의 인덱스별 CLUSTERING_FACTOR를 블록수·행수와 대조해 인덱스를 타는 게 이득인지 보는 쿼리',
          params: [{id:'ic_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = (p.ic_tbl || 'TABLE_NAME').toUpperCase();
            return "-- 전제: Oracle·Tibero 공통. CLUSTERING_FACTOR·LISTAGG는 양쪽 문서에 있다\n"
                 + "-- 뜻: 인덱스 정렬 순서와 테이블의 물리 저장 순서가 얼마나 어긋나 있는가\n"
                 + "--     BLOCKS에 가까우면 좋다 — 인덱스 순서대로 읽으면 같은 블록이 연달아 나온다\n"
                 + "--     NUM_ROWS에 가까우면 나쁘다 — 건마다 다른 블록이라 랜덤 I/O가 된다\n\n"
                 + "SELECT I.INDEX_NAME\n"
                 + "     , I.UNIQUENESS\n"
                 + "     , I.CLUSTERING_FACTOR\n"
                 + "     , T.BLOCKS\n"
                 + "     , T.NUM_ROWS\n"
                 + "     , ROUND(I.CLUSTERING_FACTOR / DECODE(T.NUM_ROWS,0,1,T.NUM_ROWS) * 100, 1) AS 행수대비_PCT\n"
                 + "     , LISTAGG(C.COLUMN_NAME, ',') WITHIN GROUP (ORDER BY C.COLUMN_POSITION) AS 인덱스컬럼\n"
                 + "FROM   ALL_INDEXES     I\n"
                 + "     , ALL_IND_COLUMNS C\n"
                 + "     , ALL_TABLES      T\n"
                 + "WHERE  I.OWNER        = USER\n"
                 + "  AND  I.TABLE_NAME   = '" + t + "'\n"
                 + "  AND  C.INDEX_OWNER  = I.OWNER\n"
                 + "  AND  C.INDEX_NAME   = I.INDEX_NAME\n"
                 + "  AND  T.OWNER        = I.OWNER\n"
                 + "  AND  T.TABLE_NAME   = I.TABLE_NAME\n"
                 + "GROUP BY I.INDEX_NAME, I.UNIQUENESS, I.CLUSTERING_FACTOR, T.BLOCKS, T.NUM_ROWS\n"
                 + "ORDER BY I.INDEX_NAME;\n\n"
                 + "-- 행수대비_PCT가 100에 가까우면 대량 조회에서는 풀스캔이 더 빠르다\n"
                 + "-- 인덱스컬럼에 조회 컬럼이 전부 들어 있으면 테이블을 안 가고 인덱스만 읽는다";
          }
        },
        {
          key: 'col_skew', label: '컬럼 값 분포', desc: '테이블의 컬럼별 고유값 수·NULL 수·히스토그램 유무를 뽑아 값이 편중된 컬럼을 찾는 쿼리',
          params: [{id:'cs_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = (p.cs_tbl || 'TABLE_NAME').toUpperCase();
            return "-- 전제: Oracle·Tibero 공통. ALL_TAB_COL_STATISTICS는 양쪽 문서에 있다\n"
                 + "-- 판정: 고유값이 두세 개뿐인데 HISTOGRAM이 NONE이면\n"
                 + "--       옵티마이저가 값 분포를 균등으로 가정한다\n"
                 + "--       Y가 99%인 컬럼도 50%로 계산해서 엉뚱한 계획을 고른다\n\n"
                 + "SELECT COLUMN_NAME\n"
                 + "     , NUM_DISTINCT\n"
                 + "     , NUM_NULLS\n"
                 + "     , DENSITY\n"
                 + "     , HISTOGRAM\n"
                 + "     , TO_CHAR(LAST_ANALYZED, 'YYYY-MM-DD') AS LAST_ANALYZED\n"
                 + "FROM   ALL_TAB_COL_STATISTICS\n"
                 + "WHERE  OWNER = USER\n"
                 + "  AND  TABLE_NAME = '" + t + "'\n"
                 + "ORDER BY NUM_DISTINCT;\n\n"
                 + "-- 히스토그램이 필요하면 METHOD_OPT을 지정해 다시 수집한다\n"
                 + "-- BEGIN\n"
                 + "--   DBMS_STATS.GATHER_TABLE_STATS(\n"
                 + "--     OWNNAME    => USER,\n"
                 + "--     TABNAME    => '" + t + "',\n"
                 + "--     METHOD_OPT => 'FOR COLUMNS SIZE 254 편중컬럼명'\n"
                 + "--   );\n"
                 + "-- END;\n"
                 + "-- /";
          }
        },
        {
          key: 'lit_sql', label: '리터럴 SQL 탐지', desc: '공유 풀에서 값만 다른 같은 모양의 SQL이 몇 개나 쌓였는지 세어 바인드 변수를 안 쓴 자리를 찾는 쿼리',
          params: [{id:'ls_min', label:'최소 커서 수', placeholder:'10', width:90}],
          query: function(p) {
            var m = p.ls_min || '10';
            return "-- 전제: FORCE_MATCHING_SIGNATURE는 Oracle 전용. Tibero 참조안내서에 없다\n"
                 + "--       Tibero면 맨 아래 대안 사용\n"
                 + "-- 용도: MyBatis에서 #{} 대신 ${}를 써서 값이 그대로 박혀 나가는 자리를 찾는다\n"
                 + "-- 원리: 오라클은 SQL 텍스트가 한 글자만 달라도 다른 SQL로 보고 계획을 새로 만든다\n"
                 + "--       값만 다른 커서가 수십 개면 그 매퍼가 매번 하드 파싱을 만들고 있다\n\n"
                 + "SELECT FORCE_MATCHING_SIGNATURE\n"
                 + "     , COUNT(*)                               AS 커서_개수\n"
                 + "     , SUM(EXECUTIONS)                        AS 총_실행수\n"
                 + "     , ROUND(SUM(SHARABLE_MEM)/1024/1024, 1)  AS 공유풀_MB\n"
                 + "     , MIN(SUBSTR(SQL_TEXT, 1, 100))          AS SQL_SAMPLE\n"
                 + "FROM   V$SQL\n"
                 + "WHERE  FORCE_MATCHING_SIGNATURE > 0\n"
                 + "GROUP BY FORCE_MATCHING_SIGNATURE\n"
                 + "HAVING COUNT(*) > " + m + "\n"
                 + "ORDER BY COUNT(*) DESC;\n\n"
                 + "-- 잡히면 해당 매퍼의 ${} 를 #{} 로 바꾼다\n"
                 + "-- 소스를 못 고치면 CURSOR_SHARING = FORCE 로 오라클이 리터럴을 치환하게 한다\n"
                 + "-- 다만 계획 품질이 떨어질 수 있어 기본값은 EXACT다. DBA와 합의하고 건드린다\n\n"
                 + "-- Tibero 대안 — 텍스트 앞부분으로 묶어 대략만 본다\n"
                 + "-- SELECT SUBSTR(SQL_TEXT, 1, 60) AS SQL_HEAD, COUNT(*) AS 커서_개수\n"
                 + "-- FROM   V$SQL\n"
                 + "-- GROUP BY SUBSTR(SQL_TEXT, 1, 60)\n"
                 + "-- HAVING COUNT(*) > " + m + "\n"
                 + "-- ORDER BY COUNT(*) DESC;";
          }
        },
        {
          key: 'sess_prep', label: '진단 세션 준비', desc: '계측을 켜고 바인드 변수를 선언한 뒤 결과 전체를 받아오게 만드는 SQL*Plus 준비 스크립트',
          params: [{id:'sp_sql', label:'대상 쿼리', placeholder:'SELECT * FROM USER_INFO WHERE USER_ID = :v_param', width:340}],
          query: function(p) {
            var sql = p.sp_sql || 'SELECT * FROM TABLE_NAME WHERE COLUMN_NAME = :v_param';
            return "-- 전제: VARIABLE·EXEC·SET은 SQL*Plus 클라이언트 명령이다\n"
                 + "--       Toad·오렌지·SQL Developer는 지원 범위가 다르다. 안 먹으면 그 줄을 빼고 쓴다\n"
                 + "-- 권한: SET AUTOTRACE는 PLUSTRACE 롤 필요. 없으면 SP2-0618\n"
                 + "-- 용도: 운영과 같은 조건(바인드 변수·전체 fetch)을 툴에서 재현해 시간을 잰다\n\n"
                 + "-- 1. 계측 켜기\nALTER SESSION SET STATISTICS_LEVEL = ALL;\n\n"
                 + "-- 2. 바인드 변수 선언 — 운영과 같은 SQL 텍스트를 만든다\n"
                 + "--    값을 직접 박으면 텍스트가 달라져 커서를 재사용하지 못한다\n"
                 + "VARIABLE v_param VARCHAR2(50)\nEXEC :v_param := '값';\n\n"
                 + "-- 3. 결과를 화면에 안 뿌리고 전체를 받아온다\n"
                 + "--    툴 그리드는 첫 50행만 채우고 멈춰서 전체 시간이 안 나온다\n"
                 + "SET AUTOTRACE TRACEONLY\nSET TIMING ON\n\n"
                 + "-- 4. 대상 쿼리 — 3회 이상 돌리고 2회차 이후 값만 쓴다\n"
                 + "--    1회차는 하드 파싱과 물리 I/O가 섞여 있어 비교에 못 쓴다\n"
                 + sql + ";\n\n"
                 + "-- 5. 원상복구\nSET AUTOTRACE OFF\nSET TIMING OFF\nALTER SESSION SET STATISTICS_LEVEL = TYPICAL;\n\n"
                 + "-- 캐시를 비워 조건을 맞추는 방법도 있다\n"
                 + "-- 다만 ALTER SYSTEM FLUSH BUFFER_CACHE는 인스턴스 전체의 캐시를 날려\n"
                 + "-- 그 DB에 붙은 모든 세션이 한동안 느려진다. 개발·테스트 인스턴스에서만 쓴다";
          }
        },
      ]
    },
    {

      items: [
        {

          params: [],
          query: function(p) {

        {

        {

  mysql: [
    {
      category: '테이블',
      items: [
        {
          key: 'tbl_list', label: '테이블 목록 조회', desc: 'INFORMATION_SCHEMA 기반',
          params: [
            {id:'db_name', label:'DB명', placeholder:'mydb', width:120},
            {id:'tbl_search', label:'테이블명 (빈칸=전체)', placeholder:'user%', width:160}
          ],
          query: function(p) {
            var db = p.db_name || 'DATABASE()';
            var s = p.tbl_search || '%';
            if (s && s.indexOf('%') < 0) s = '%' + s + '%';
            var dbCond = p.db_name ? "TABLE_SCHEMA = '" + db + "'" : "TABLE_SCHEMA = DATABASE()";
            return "SELECT TABLE_NAME\n     , TABLE_ROWS\n     , ROUND(DATA_LENGTH / 1024 / 1024, 2)   AS DATA_MB\n     , ROUND(INDEX_LENGTH / 1024 / 1024, 2)  AS INDEX_MB\n     , TABLE_COMMENT\n     , CREATE_TIME\n     , UPDATE_TIME\nFROM   INFORMATION_SCHEMA.TABLES\nWHERE  " + dbCond + "\n  AND  TABLE_NAME LIKE '" + s + "'\nORDER BY TABLE_NAME;";
          }
        },
        {
          key: 'col_list', label: '컬럼 목록 조회', desc: '테이블 컬럼 전체 조회',
          params: [
            {id:'db_name2', label:'DB명', placeholder:'mydb', width:120},
            {id:'col_tbl', label:'테이블명', placeholder:'user_info', width:160}
          ],
          query: function(p) {
            var db = p.db_name2 ? "'" + p.db_name2 + "'" : "DATABASE()";
            var t = p.col_tbl || 'table_name';
            return "SELECT TABLE_SCHEMA               AS OWNER\n     , TABLE_NAME\n     , ORDINAL_POSITION             AS COLUMN_ID\n     , COLUMN_NAME\n     , DATA_TYPE\n     , CHARACTER_MAXIMUM_LENGTH    AS DATA_LENGTH\n     , NUMERIC_SCALE                AS DATA_SCALE\n     , IS_NULLABLE                  AS NULLABLE\n     , COLUMN_TYPE\n     , COLUMN_DEFAULT\n     , COLUMN_KEY\n     , EXTRA\n     , COLUMN_COMMENT\nFROM   INFORMATION_SCHEMA.COLUMNS\nWHERE  TABLE_SCHEMA = " + db + "\n  AND  LOWER(TABLE_NAME) = '" + t.toLowerCase() + "'\nORDER BY ORDINAL_POSITION;\n-- 열 순서는 논리명_변환기.html «3.컬럼 목록» 업로드 양식과 맞춤 — 그대로 붙여넣기 가능";
          }
        },
        {
          key: 'tbl_size', label: '테이블 용량 조회', desc: '용량 상위 테이블',
          params: [{id:'db_size', label:'DB명', placeholder:'mydb', width:120}],
          query: function(p) {
            var dbCond = p.db_size ? "TABLE_SCHEMA = '" + p.db_size + "'" : "TABLE_SCHEMA = DATABASE()";
            return "SELECT TABLE_NAME\n     , ROUND((DATA_LENGTH + INDEX_LENGTH) / 1024 / 1024, 2) AS TOTAL_MB\n     , ROUND(DATA_LENGTH  / 1024 / 1024, 2) AS DATA_MB\n     , ROUND(INDEX_LENGTH / 1024 / 1024, 2) AS INDEX_MB\n     , TABLE_ROWS\nFROM   INFORMATION_SCHEMA.TABLES\nWHERE  " + dbCond + "\nORDER BY (DATA_LENGTH + INDEX_LENGTH) DESC;";
          }
        },
        {
          key: 'fk_ref', label: 'FK 참조 관계 조회', desc: '특정 테이블 참조 확인',
          params: [
            {id:'db_fk', label:'DB명', placeholder:'mydb', width:120},
            {id:'fk_tbl', label:'테이블명', placeholder:'user_info', width:160}
          ],
          query: function(p) {
            var db = p.db_fk ? "'" + p.db_fk + "'" : "DATABASE()";
            var t = p.fk_tbl || 'table_name';
            return "SELECT K.CONSTRAINT_NAME\n     , K.TABLE_NAME             AS 참조하는테이블\n     , K.COLUMN_NAME            AS FK컬럼\n     , K.REFERENCED_TABLE_NAME  AS 참조당하는테이블\n     , K.REFERENCED_COLUMN_NAME AS 참조컬럼\n     , R.UPDATE_RULE\n     , R.DELETE_RULE\nFROM   INFORMATION_SCHEMA.KEY_COLUMN_USAGE K\nJOIN   INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS R\n       ON K.CONSTRAINT_NAME = R.CONSTRAINT_NAME\n      AND K.TABLE_SCHEMA    = R.CONSTRAINT_SCHEMA\nWHERE  K.TABLE_SCHEMA = " + db + "\n  AND  LOWER(K.REFERENCED_TABLE_NAME) = '" + t.toLowerCase() + "'\nORDER BY K.TABLE_NAME;";
          }
        },
        {
          key: 'tbl_ddl', label: 'DDL 추출', desc: 'SHOW CREATE TABLE',
          params: [{id:'ddl_tbl', label:'테이블명', placeholder:'user_info', width:180}],
          query: function(p) {
            var t = p.ddl_tbl || 'table_name';
            return "SHOW CREATE TABLE " + t + ";";

        },
        {
          key: 'tbl_comment', label: '테이블/컬럼 주석 조회', desc: '테이블 및 컬럼 comment 확인',
          params: [{id:'db_cm', label:'DB명', placeholder:'mydb', width:120}, {id:'cm_tbl', label:'테이블명(빈칸=DB 전체)', placeholder:'user_info', width:180}],
          query: function(p) {
            var db = p.db_cm ? "'" + p.db_cm + "'" : "DATABASE()";
            var t = p.cm_tbl;
            return "SELECT TABLE_NAME, TABLE_COMMENT\nFROM   INFORMATION_SCHEMA.TABLES\nWHERE  TABLE_SCHEMA = " + db + (t ? "\n  AND  LOWER(TABLE_NAME) = '" + t.toLowerCase() + "'" : "") + "\nORDER BY TABLE_NAME;\n\nSELECT TABLE_NAME, COLUMN_NAME, COLUMN_COMMENT\nFROM   INFORMATION_SCHEMA.COLUMNS\nWHERE  TABLE_SCHEMA = " + db + (t ? "\n  AND  LOWER(TABLE_NAME) = '" + t.toLowerCase() + "'" : "") + "\n  AND  COLUMN_COMMENT != ''\nORDER BY TABLE_NAME, ORDINAL_POSITION;";
          }
        },
        {
          key: 'tablespace', label: '테이블스페이스 용량', desc: 'InnoDB 데이터 파일 용량 확인 (Oracle 개념과 정확히 일치하지 않음)',
          params: [],
          query: function(p) {
            return "-- MySQL은 기본이 파일당테이블(innodb_file_per_table=ON)이라 Oracle식 '테이블스페이스' 단위가 없음\n-- 실무 대체: 스키마 전체 데이터+인덱스 용량 합계\nSELECT TABLE_SCHEMA\n     , ROUND(SUM(DATA_LENGTH + INDEX_LENGTH) / 1024 / 1024 / 1024, 2) AS TOTAL_GB\n     , ROUND(SUM(DATA_FREE) / 1024 / 1024, 2)                        AS FREE_MB   -- 삭제 후 회수 안 된 공간(단편화)\nFROM   INFORMATION_SCHEMA.TABLES\nGROUP  BY TABLE_SCHEMA\nORDER  BY TOTAL_GB DESC;\n\n-- 공유 시스템 테이블스페이스(ibdata1) 파일 용량\n-- MySQL 5.7·8.0\nSELECT FILE_NAME\n     , TOTAL_EXTENTS * EXTENT_SIZE / 1024 / 1024 AS SIZE_MB\n     , DATA_FREE / 1024 / 1024                   AS FREE_MB\nFROM   INFORMATION_SCHEMA.FILES\nWHERE  TABLESPACE_NAME = 'innodb_system';\n\n-- MariaDB (INFORMATION_SCHEMA.FILES가 비어 있다)\nSELECT NAME, FILE_SIZE / 1024 / 1024 AS SIZE_MB\nFROM   INFORMATION_SCHEMA.INNODB_SYS_TABLESPACES\nWHERE  NAME = 'innodb_system';";
          }
        },
        {
          key: 'grp_count', label: '그룹핑 카운트', desc: '코드성 컬럼 값 분포 확인',
          params: [
            {id:'grp_tbl', label:'테이블명', placeholder:'user_info', width:160},
            {id:'grp_col', label:'컬럼명', placeholder:'use_yn', width:120}
          ],
          query: function(p) {
            var t = (p.grp_tbl || 'table_name');
            var c = (p.grp_col || 'column_name');
            return "SELECT " + c + "\n     , COUNT(*) AS cnt\nFROM   " + t + "\nGROUP BY " + c + "\nORDER BY cnt DESC;";
          }
        },
      ]
    },

          key: 'idx_list', label: '인덱스 목록 조회', desc: '테이블의 인덱스 및 컬럼',
          params: [
            {id:'db_idx', label:'DB명', placeholder:'mydb', width:120},
            {id:'idx_tbl', label:'테이블명', placeholder:'user_info', width:160}
          ],
          query: function(p) {
            var db = p.db_idx ? "'" + p.db_idx + "'" : "DATABASE()";
            var t = p.idx_tbl || 'table_name';
            return "SELECT INDEX_NAME\n     , COLUMN_NAME\n     , SEQ_IN_INDEX\n     , NON_UNIQUE\n     , INDEX_TYPE\n     , CARDINALITY\nFROM   INFORMATION_SCHEMA.STATISTICS\nWHERE  TABLE_SCHEMA = " + db + "\n  AND  LOWER(TABLE_NAME) = '" + t.toLowerCase() + "'\nORDER BY INDEX_NAME, SEQ_IN_INDEX;";
          }
        },
        {
          key: 'idx_usage', label: '인덱스 사용 현황', desc: '안 쓰이는 인덱스 확인 (sys 스키마·performance_schema 필요)',
          params: [{id:'db_idxu', label:'DB명', placeholder:'mydb', width:120}],
          query: function(p) {
            var db = p.db_idxu ? "'" + p.db_idxu + "'" : "DATABASE()";
            return "-- sys 스키마가 없으면: SOURCE $MYSQL_HOME/share/mysql_sys_schema.sql 로 설치 필요\nSELECT * FROM sys.schema_unused_indexes WHERE object_schema = " + db + ";\n\n-- 직접 집계 (sys 스키마 없이)\nSELECT OBJECT_SCHEMA, OBJECT_NAME, INDEX_NAME\n     , COUNT_STAR   AS io_count\n     , COUNT_FETCH, COUNT_INSERT, COUNT_UPDATE, COUNT_DELETE\nFROM   performance_schema.table_io_waits_summary_by_index_usage\nWHERE  OBJECT_SCHEMA = " + db + "\n  AND  INDEX_NAME IS NOT NULL\n  AND  COUNT_STAR = 0\nORDER  BY OBJECT_NAME, INDEX_NAME;\n-- performance_schema가 꺼져있으면 0건만 나옴 — SHOW VARIABLES LIKE 'performance_schema'; 로 확인";
          }
        },
      ]
    },
    {
      category: '시퀀스',
      items: [
        {
          key: 'seq_list', label: '시퀀스 목록 조회', desc: 'MySQL엔 시퀀스 없음(AUTO_INCREMENT) — MariaDB 10.3+만 진짜 시퀀스',
          params: [{id:'db_seq', label:'DB명', placeholder:'mydb', width:120}],
          query: function(p) {
            var db = p.db_seq ? "'" + p.db_seq + "'" : "DATABASE()";
            return "-- MySQL(모든 버전): 시퀀스 객체 없음 — 테이블별 AUTO_INCREMENT 현재값으로 대체\nSELECT TABLE_NAME, AUTO_INCREMENT\nFROM   INFORMATION_SCHEMA.TABLES\nWHERE  TABLE_SCHEMA = " + db + "\n  AND  AUTO_INCREMENT IS NOT NULL\nORDER  BY TABLE_NAME;\n\n-- MariaDB 10.3+ (진짜 CREATE SEQUENCE 지원)\nSELECT TABLE_NAME AS 시퀀스명, TABLE_COMMENT\nFROM   INFORMATION_SCHEMA.TABLES\nWHERE  TABLE_SCHEMA = " + db + " AND TABLE_TYPE = 'SEQUENCE';";
          }
        },
        {
          key: 'seq_curr', label: '시퀀스 현재/다음값', desc: 'MySQL은 AUTO_INCREMENT, MariaDB는 진짜 시퀀스',
          params: [{id:'seq_name', label:'테이블명(MySQL) / 시퀀스명(MariaDB)', placeholder:'user_info', width:200}],
          query: function(p) {
            var n = p.seq_name || 'table_name';
            return "-- MySQL: 다음 채번 예정값(참고용 — 동시성 환경에서 실제 채번값과 다를 수 있음)\nSELECT AUTO_INCREMENT FROM INFORMATION_SCHEMA.TABLES\nWHERE  TABLE_SCHEMA = DATABASE() AND LOWER(TABLE_NAME) = '" + n.toLowerCase() + "';\n\n-- MariaDB 10.3+ 시퀀스\nSELECT NEXT VALUE FOR " + n + ";   -- 다음값(증가 발생)\nSELECT PREVIOUS VALUE FOR " + n + ";   -- 세션에서 마지막으로 뽑은 값(증가 없음)\nSHOW CREATE SEQUENCE " + n + ";   -- 현재 정의(현재값 포함) 확인";
          }
        },
        {
          key: 'seq_reset', label: '시퀀스 값 초기화', desc: 'MySQL은 AUTO_INCREMENT 재설정, MariaDB는 ALTER SEQUENCE',
          params: [{id:'rs_name', label:'테이블명(MySQL) / 시퀀스명(MariaDB)', placeholder:'user_info', width:200}, {id:'rs_val', label:'설정값', placeholder:'1000', width:100}],
          query: function(p) {
            var n = p.rs_name || 'table_name';
            var v = p.rs_val || '1';
            return "-- MySQL: 새 값은 기존 최댓값보다 작게 못 넣음(자동으로 올림)\nALTER TABLE " + n + " AUTO_INCREMENT = " + v + ";\n\n-- MariaDB 10.3+ 시퀀스\nALTER SEQUENCE " + n + " RESTART WITH " + v + ";";
          }
        },
      ]
    },
    {
      category: '성능/모니터링',
      items: [
        {
          key: 'explain', label: '실행 계획', desc: 'EXPLAIN 쿼리 성능 분석',
          params: [{id:'exp_sql', label:'쿼리', placeholder:'SELECT * FROM user_info', width:300}],
          query: function(p) {
            var sql = p.exp_sql || 'SELECT * FROM table_name';
            return "EXPLAIN " + sql + ";\n\n-- 상세 분석\nEXPLAIN FORMAT=JSON " + sql + ";";

        },
        {
          key: 'slow_sql', label: '느린 SQL 찾기', desc: 'performance_schema 기반',
          params: [],
          query: function(p) {
            return "SELECT DIGEST_TEXT                              AS query\n     , COUNT_STAR                                AS calls\n     , ROUND(AVG_TIMER_WAIT / 1000000000000, 4)  AS avg_sec\n     , ROUND(SUM_TIMER_WAIT / 1000000000000, 4)  AS total_sec\n     , SUM_ROWS_EXAMINED                         AS total_rows_examined\nFROM   performance_schema.events_statements_summary_by_digest\nWHERE  COUNT_STAR > 0\nORDER BY AVG_TIMER_WAIT DESC\nLIMIT 20;\n-- performance_schema가 꺼져있으면 0건만 나옴 — MariaDB는 기본 OFF\n-- SHOW VARIABLES LIKE 'performance_schema'; 로 확인하고, my.cnf에 performance_schema=ON 을 넣고 재기동";
          }
        },
        {
          key: 'session', label: '활성 세션 확인', desc: '현재 접속 프로세스 목록',
          params: [],
          query: function(p) {
            return "SHOW FULL PROCESSLIST;\n\n-- 또는\nSELECT ID, USER, HOST, DB, COMMAND, TIME, STATE, LEFT(INFO,100) AS QUERY\nFROM   INFORMATION_SCHEMA.PROCESSLIST\nWHERE  COMMAND != 'Sleep'\nORDER BY TIME DESC;";
          }
        },
        {
          key: 'lock', label: '락(Lock) 조회', desc: '락 대기 세션 확인 (5.7 이하 / 8.0+ 병기)',
          params: [],
          query: function(p) {
            return "-- MySQL 5.7 이하 / MariaDB\nSELECT R.trx_id                      AS waiting_trx_id\n     , R.trx_mysql_thread_id          AS waiting_thread\n     , R.trx_query                    AS waiting_query\n     , B.trx_id                      AS blocking_trx_id\n     , B.trx_mysql_thread_id          AS blocking_thread\n     , B.trx_query                    AS blocking_query\nFROM   information_schema.innodb_lock_waits W\n     , information_schema.innodb_trx       R\n     , information_schema.innodb_trx       B\nWHERE  W.requesting_trx_id = R.trx_id\n  AND  W.blocking_trx_id   = B.trx_id;\n\n-- MySQL 8.0+ (innodb_lock_waits가 performance_schema로 이동)\nSELECT R.trx_id                       AS waiting_trx_id\n     , R.trx_mysql_thread_id          AS waiting_thread\n     , R.trx_query                    AS waiting_query\n     , B.trx_id                       AS blocking_trx_id\n     , B.trx_mysql_thread_id          AS blocking_thread\n     , B.trx_query                    AS blocking_query\nFROM   performance_schema.data_lock_waits W\n     , information_schema.innodb_trx      R\n     , information_schema.innodb_trx      B\nWHERE  W.requesting_engine_transaction_id = R.trx_id\n  AND  W.blocking_engine_transaction_id   = B.trx_id;\n\n-- MySQL 8.0+ 간편 조회\nSELECT * FROM sys.innodb_lock_waits;";
          }
        },
        {
          key: 'uncommit', label: '미커밋 트랜잭션', desc: '커밋 안 된 오래된 트랜잭션',
          params: [],
          query: function(p) {
            return "SELECT trx_id, trx_state, trx_started\n     , TIMESTAMPDIFF(SECOND, trx_started, NOW()) AS 경과초\n     , trx_mysql_thread_id AS thread_id\n     , trx_query\nFROM   information_schema.innodb_trx\nWHERE  TIMESTAMPDIFF(SECOND, trx_started, NOW()) > 60   -- 60초 이상 미커밋\nORDER  BY trx_started;";
          }
        },
        {
          key: 'kill_session', label: '세션 종료', desc: '특정 스레드 강제 종료',
          params: [{id:'kill_id', label:'스레드ID(Id)', placeholder:'12345', width:120}],
          query: function(p) {
            var id = p.kill_id || 'THREAD_ID';
            return "KILL " + id + ";          -- 커넥션 자체 종료\nKILL QUERY " + id + ";    -- 실행 중인 쿼리만 종료(커넥션은 유지)\n-- 대상 확인: SHOW FULL PROCESSLIST; 로 Id 컬럼 먼저 조회";
          }
        },
        {
          key: 'table_status', label: '테이블 상태 확인', desc: 'AUTO_INCREMENT, 엔진 등',
          params: [{id:'ts_tbl', label:'테이블명', placeholder:'user_info', width:160}],
          query: function(p) {

        },

    {
      category: '오브젝트',
      items: [
        {
          key: 'proc_list', label: '프로시저/함수 목록', desc: 'stored procedure/function 조회',
          params: [{id:'db_proc', label:'DB명', placeholder:'mydb', width:120}],
          query: function(p) {
            var db = p.db_proc ? "'" + p.db_proc + "'" : "DATABASE()";
            return "SELECT ROUTINE_NAME\n     , ROUTINE_TYPE\n     , DATA_TYPE      AS return_type\n     , CREATED\n     , LAST_ALTERED\n     , ROUTINE_COMMENT\nFROM   INFORMATION_SCHEMA.ROUTINES\nWHERE  ROUTINE_SCHEMA = " + db + "\nORDER BY ROUTINE_TYPE, ROUTINE_NAME;";

        {
          key: 'proc_source', label: '프로시저/함수 소스 조회', desc: '지정한 프로시저·함수의 전체 정의를 INFORMATION_SCHEMA.ROUTINES에서 조회',
          params: [{id:'src_name', label:'객체명', placeholder:'FN_GET_NAME', width:200}, {id:'db_src', label:'DB명', placeholder:'mydb', width:120}],
          query: function(p) {
            var n = p.src_name || 'ROUTINE_NAME';
            var db = p.db_src ? "'" + p.db_src + "'" : "DATABASE()";
            return "SELECT ROUTINE_NAME\n     , ROUTINE_TYPE\n     , ROUTINE_DEFINITION\nFROM   INFORMATION_SCHEMA.ROUTINES\nWHERE  ROUTINE_SCHEMA = " + db + "\n  AND  ROUTINE_NAME = '" + n + "';\n\n-- ROUTINE_DEFINITION이 NULL이면 (권한·바이너리로그 설정 문제) 아래로 대체\n-- SHOW CREATE PROCEDURE " + n + ";\n-- SHOW CREATE FUNCTION " + n + ";";
          }
        },
        {
          key: 'source_grep', label: '소스 전체 검색 (키워드)', desc: '전체 저장 프로시저·함수 정의에서 특정 테이블명·컬럼명·키워드가 포함된 오브젝트를 INFORMATION_SCHEMA.ROUTINES에서 검색',
          params: [{id:'grep_kw', label:'검색어', placeholder:'mdch_docu_id', width:200}, {id:'db_grep', label:'DB명', placeholder:'mydb', width:120}],
          query: function(p) {
            var k = p.grep_kw || '키워드';
            var db = p.db_grep ? "'" + p.db_grep + "'" : "DATABASE()";
            return "SELECT ROUTINE_NAME\n     , ROUTINE_TYPE\n     , ROUTINE_DEFINITION\nFROM   INFORMATION_SCHEMA.ROUTINES\nWHERE  ROUTINE_SCHEMA = " + db + "\n  AND  ROUTINE_DEFINITION LIKE '%" + k + "%'\nORDER BY ROUTINE_NAME;\n\n-- 줄 단위가 아니라 정의 전체 텍스트 기준 매칭. 몇 번째 줄인지는 결과의 ROUTINE_DEFINITION에서 직접 찾을 것";
          }
        },
        {
          key: 'view_list', label: '뷰 목록', desc: '뷰 목록 및 정의 확인',
          params: [{id:'db_view', label:'DB명', placeholder:'mydb', width:120}],
          query: function(p) {
            var db = p.db_view ? "'" + p.db_view + "'" : "DATABASE()";
            return "SELECT TABLE_NAME AS view_name\n     , VIEW_DEFINITION\nFROM   INFORMATION_SCHEMA.VIEWS\nWHERE  TABLE_SCHEMA = " + db + "\nORDER BY TABLE_NAME;";
          }
        },
        {
          key: 'trigger_list', label: '트리거 목록', desc: '트리거 정보 및 활성화 상태',
          params: [{id:'db_trg', label:'DB명', placeholder:'mydb', width:120}],
          query: function(p) {
            var db = p.db_trg ? "'" + p.db_trg + "'" : "DATABASE()";
            return "SELECT TRIGGER_NAME\n     , EVENT_MANIPULATION   AS 이벤트   -- INSERT/UPDATE/DELETE\n     , EVENT_OBJECT_TABLE    AS 대상테이블\n     , ACTION_TIMING         AS 시점     -- BEFORE/AFTER\n     , CREATED\nFROM   INFORMATION_SCHEMA.TRIGGERS\nWHERE  TRIGGER_SCHEMA = " + db + "\nORDER BY EVENT_OBJECT_TABLE, TRIGGER_NAME;";
          }
        },
        {
          key: 'invalid_obj', label: '무효 오브젝트 조회', desc: 'MySQL엔 Oracle식 INVALID 상태 개념이 없음',
          params: [],
          query: function(p) {
            return "-- MySQL은 오브젝트를 만들 때 즉시 검증함 — 나중에 의존 테이블이 바뀌어도\n-- 프로시저/뷰가 카탈로그에 '무효'로 표시되는 개념 자체가 없음(실행 시점에 에러로 드러남)\n-- 뷰가 깨졌는지 확인하려면 SHOW CREATE VIEW 대신 직접 조회해봐야 함:\nSELECT TABLE_NAME FROM INFORMATION_SCHEMA.VIEWS WHERE TABLE_SCHEMA = DATABASE();\n-- 위 목록을 순회하며 SELECT * FROM <view> LIMIT 0; 실행 → 에러 나는 뷰가 '무효'";
          }
        },
        {
          key: 'error_detail', label: '컴파일 에러 상세 조회', desc: 'MySQL은 CREATE 시점에 즉시 에러 반환 — Oracle식 에러 카탈로그 없음',
          params: [],
          query: function(p) {
            return "-- Oracle의 USER_ERRORS처럼 컴파일 에러를 저장해두는 카탈로그가 없음\n-- CREATE PROCEDURE/FUNCTION 실행 시 에러가 그 자리에서 바로 반환됨 — 별도 조회 쿼리 불필요\n-- 과거 에러 이력이 필요하면 general_log/error log 확인:\nSHOW VARIABLES LIKE 'log_error';";
          }
        },
        {
          key: 'recent_ddl', label: '최근 변경 객체', desc: 'CREATE_TIME/UPDATE_TIME·LAST_ALTERED 기준 최근 N일',
          params: [{id:'ddl_days', label:'최근 N일', placeholder:'7', width:80}, {id:'db_ddl', label:'DB명', placeholder:'mydb', width:120}],
          query: function(p) {
            var days = p.ddl_days || '7';
            var db = p.db_ddl ? "'" + p.db_ddl + "'" : "DATABASE()";
            return "SELECT TABLE_NAME AS 객체명, 'TABLE' AS 유형, CREATE_TIME, UPDATE_TIME\nFROM   INFORMATION_SCHEMA.TABLES\nWHERE  TABLE_SCHEMA = " + db + "\n  AND  (CREATE_TIME >= NOW() - INTERVAL " + days + " DAY OR UPDATE_TIME >= NOW() - INTERVAL " + days + " DAY)\nUNION ALL\nSELECT ROUTINE_NAME, ROUTINE_TYPE, CREATED, LAST_ALTERED\nFROM   INFORMATION_SCHEMA.ROUTINES\nWHERE  ROUTINE_SCHEMA = " + db + "\n  AND  (CREATED >= NOW() - INTERVAL " + days + " DAY OR LAST_ALTERED >= NOW() - INTERVAL " + days + " DAY)\nORDER BY 3 DESC;\n-- UPDATE_TIME은 서버 재시작·공유 테이블스페이스에서 NULL로 리셋될 수 있음(02번과 동일 함정)";
          }
        },
      ]
    },
    {

      category: '통계/유지보수',

          params: [{id:'an_tbl', label:'테이블명', placeholder:'user_info', width:180}],

    {
      category: '환경/시간',
      items: [
        {
          key: 'db_time', label: 'DB 현재 시간 확인', desc: '서버 시간·타임존 확인 (WAS-DB 시간 불일치 디버깅)',
          params: [],
          query: function(p) {
            return "SELECT NOW()                  AS db_time      -- 문장 시작 시각\n     , SYSDATE()              AS real_time    -- 호출 시점 시각\n     , UTC_TIMESTAMP()        AS utc_now\n     , @@global.time_zone     AS global_tz    -- SYSTEM이면 OS 타임존 따름\n     , @@session.time_zone    AS session_tz;";
          }
        },
      ]
    },
  ],

  pg: [
    {
      category: '테이블',
      items: [
        {
          key: 'tbl_list', label: '테이블 목록 조회', desc: 'public 스키마 기준',
          params: [{id:'tbl_search', label:'테이블명 (빈칸=전체)', placeholder:'user%', width:180}],
          query: function(p) {
            var s = p.tbl_search || '%';
            if (s && s.indexOf('%') < 0) s = '%' + s + '%';
            return "SELECT table_name\n     , pg_size_pretty(pg_total_relation_size(quote_ident(table_name))) AS total_size\n     , pg_size_pretty(pg_relation_size(quote_ident(table_name)))       AS table_size\nFROM   information_schema.tables\nWHERE  table_schema = 'public'\n  AND  table_name LIKE '" + (s||'%') + "'\nORDER BY pg_total_relation_size(quote_ident(table_name)) DESC;";
          }
        },
        {
          key: 'col_list', label: '컬럼 목록 조회', desc: '테이블명 입력 시 컬럼 전체 조회',
          params: [{id:'col_tbl', label:'테이블명', placeholder:'user_info', width:180}],
          query: function(p) {
            var t = p.col_tbl || 'table_name';
            return "SELECT table_schema               AS owner\n     , table_name\n     , ordinal_position             AS column_id\n     , column_name\n     , data_type\n     , character_maximum_length    AS data_length\n     , numeric_scale                AS data_scale\n     , is_nullable                  AS nullable\n     , column_default\nFROM   information_schema.columns\nWHERE  table_schema = 'public'\n  AND  table_name   = '" + t.toLowerCase() + "'\nORDER BY ordinal_position;\n-- 열 순서는 논리명_변환기.html «3.컬럼 목록» 업로드 양식과 맞춤 — 그대로 붙여넣기 가능";
          }
        },
        {
          key: 'tbl_size', label: '테이블 용량 조회', desc: '용량 상위 테이블',
          params: [],
          query: function(p) {
            return "SELECT relname                                                   AS table_name\n     , pg_size_pretty(pg_total_relation_size(relid))             AS total_size\n     , pg_size_pretty(pg_relation_size(relid))                   AS table_size\n     , pg_size_pretty(pg_indexes_size(relid))                    AS index_size\n     , n_live_tup                                                AS row_count\nFROM   pg_catalog.pg_stat_user_tables\nORDER BY pg_total_relation_size(relid) DESC;";
          }
        },
        {
          key: 'fk_ref', label: 'FK 참조 관계 조회', desc: '특정 테이블 참조 확인',
          params: [{id:'fk_tbl', label:'테이블명', placeholder:'user_info', width:180}],
          query: function(p) {
            var t = p.fk_tbl || 'table_name';
            return "SELECT tc.table_name        AS 참조하는테이블\n     , kcu.column_name      AS FK컬럼\n     , ccu.table_name       AS 참조당하는테이블\n     , ccu.column_name      AS 참조컬럼\n     , tc.constraint_name   AS FK명\nFROM   information_schema.table_constraints    tc\n     , information_schema.key_column_usage     kcu\n     , information_schema.constraint_column_usage ccu\nWHERE  tc.constraint_type     = 'FOREIGN KEY'\n  AND  tc.constraint_name      = kcu.constraint_name\n  AND  ccu.constraint_name     = tc.constraint_name\n  AND  ccu.table_name          = '" + t.toLowerCase() + "'\nORDER BY tc.table_name;";
          }
        },
        {
          key: 'tbl_ddl', label: 'DDL 추출', desc: 'pg_dump 명령어 참고',
          params: [{id:'ddl_tbl', label:'테이블명', placeholder:'user_info', width:180}],
          query: function(p) {
            var t = p.ddl_tbl || 'table_name';
            return "-- 터미널에서 실행\n-- pg_dump -U postgres -d mydb -t " + t + " --schema-only\n\n-- 컬럼 정의 확인 (대체)\nSELECT 'CREATE TABLE ' || table_name || ' (' AS ddl\nFROM   information_schema.tables\nWHERE  table_name = '" + t + "'\nUNION ALL\nSELECT '  ' || column_name || ' ' || data_type\n       || CASE WHEN character_maximum_length IS NOT NULL THEN '(' || character_maximum_length || ')' ELSE '' END\n       || CASE WHEN is_nullable = 'NO' THEN ' NOT NULL' ELSE '' END\n       || ','\nFROM   information_schema.columns\nWHERE  table_name = '" + t + "'\nORDER BY 1;";
          }
        },
        {
          key: 'tbl_comment', label: '테이블/컬럼 주석 조회', desc: 'pg_description 기반',
          params: [{id:'comment_tbl', label:'테이블명', placeholder:'user_info', width:180}],
          query: function(p) {
            var t = p.comment_tbl || 'table_name';
            return "-- 테이블 주석\nSELECT obj_description('" + t + "'::regclass::oid) AS table_comment;\n\n-- 컬럼 주석\nSELECT a.attname   AS column_name\n     , pg_catalog.col_description(a.attrelid, a.attnum) AS comment\nFROM   pg_catalog.pg_attribute a\nWHERE  a.attrelid = '" + t + "'::regclass\n  AND  a.attnum > 0\n  AND  NOT a.attisdropped\nORDER BY a.attnum;";
          }
        },
        {
          key: 'tablespace', label: '테이블스페이스 용량', desc: '테이블스페이스별 사용량',
          params: [],
          query: function(p) {
            return "SELECT spcname                                          AS tablespace_name\n     , pg_tablespace_location(oid)                       AS location   -- pg_default/pg_global은 빈 문자열\n     , pg_size_pretty(pg_tablespace_size(spcname))        AS size\nFROM   pg_tablespace\nORDER BY pg_tablespace_size(spcname) DESC;\n-- pg_default(별도 지정 없는 기본), pg_global(공유 카탈로그)은 항상 존재";
          }
        },
        {
          key: 'grp_count', label: '그룹핑 카운트', desc: '코드성 컬럼 값 분포 확인',
          params: [
            {id:'grp_tbl', label:'테이블명', placeholder:'user_info', width:160},
            {id:'grp_col', label:'컬럼명', placeholder:'use_yn', width:120}
          ],
          query: function(p) {
            var t = (p.grp_tbl || 'table_name').toLowerCase();
            var c = (p.grp_col || 'column_name').toLowerCase();
            return "SELECT " + c + "\n     , COUNT(*) AS cnt\nFROM   " + t + "\nGROUP BY " + c + "\nORDER BY cnt DESC;";
          }
        },
      ]
    },
    {
      category: '인덱스',
      items: [
        {
          key: 'idx_list', label: '인덱스 목록 조회', desc: '테이블의 인덱스 및 컬럼',
          params: [{id:'idx_tbl', label:'테이블명', placeholder:'user_info', width:180}],
          query: function(p) {
            var t = p.idx_tbl || 'table_name';
            return "SELECT indexname   AS index_name\n     , indexdef     AS definition\nFROM   pg_indexes\nWHERE  schemaname = 'public'\n  AND  tablename  = '" + t.toLowerCase() + "'\nORDER BY indexname;";
          }
        },
        {
          key: 'idx_usage', label: '인덱스 사용 현황', desc: '안 쓰이는 인덱스 확인',
          params: [],
          query: function(p) {
            return "SELECT relname        AS table_name\n     , indexrelname   AS index_name\n     , idx_scan        AS scan_count\n     , idx_tup_read\n     , idx_tup_fetch\nFROM   pg_stat_user_indexes\nORDER BY idx_scan ASC, relname;";
          }
        },
        {
          key: 'idx_bloat', label: '인덱스 bloat 확인', desc: '인덱스 비효율 공간 확인',
          params: [],
          query: function(p) {
            return "SELECT schemaname\n     , relname      AS tablename\n     , indexrelname AS indexname\n     , pg_size_pretty(pg_relation_size(indexrelid::regclass)) AS index_size\n     , idx_scan\nFROM   pg_stat_user_indexes\nJOIN   pg_index USING (indexrelid)\nWHERE  indisvalid = true\n  AND  idx_scan < 50\n  AND  pg_relation_size(indexrelid::regclass) > 1024 * 1024\nORDER BY pg_relation_size(indexrelid::regclass) DESC;";
          }
        },
      ]
    },
    {
      category: '시퀀스',
      items: [
        {
          key: 'seq_list', label: '시퀀스 목록 조회', desc: '전체 시퀀스 및 현재값',
          params: [],
          query: function(p) {
            return "SELECT sequencename AS sequence_name\n     , start_value\n     , min_value\n     , max_value\n     , increment_by\n     , last_value    -- nextval 을 한 번도 안 불렀거나 권한이 없으면 NULL\nFROM   pg_sequences\nWHERE  schemaname = 'public'\nORDER BY sequencename;\n-- PG 10+ (pg_sequences). 9.x 는 시퀀스마다 SELECT last_value FROM 시퀀스명;";
          }
        },
        {
          key: 'seq_curr', label: '시퀀스 현재/다음값', desc: 'currval / nextval 조회',
          params: [{id:'seq_name', label:'시퀀스명', placeholder:'seq_user_id', width:180}],
          query: function(p) {
            var s = p.seq_name || 'seq_name';
            return "-- 현재값 (nextval 호출 후 가능)\nSELECT currval('" + s + "');\n\n-- 다음 채번\nSELECT nextval('" + s + "');\n\n-- 현재값 확인 (currval 없이)\nSELECT last_value FROM " + s + ";";
          }
        },
        {
          key: 'seq_reset', label: '시퀀스 값 초기화', desc: '현재값을 특정 값으로 리셋',
          params: [{id:'rs_seq', label:'시퀀스명', placeholder:'seq_user_id', width:180}, {id:'rs_val', label:'설정값', placeholder:'1000', width:100}],
          query: function(p) {
            var s = p.rs_seq || 'seq_name';
            var v = p.rs_val || '1';
            return "ALTER SEQUENCE " + s + " RESTART WITH " + v + ";\n\n-- 또는 값만 즉시 지정(다음 nextval부터 반영, RESTART와 결과는 동일)\nSELECT setval('" + s + "', " + v + ", false);   -- false: 다음 nextval이 " + v + " 반환 / true: " + v + "+1 반환";
          }
        },
      ]
    },
    {
      category: '성능/모니터링',
      items: [
        {
          key: 'explain', label: '실행 계획', desc: '쿼리 성능 분석 (실제 실행)',
          params: [{id:'exp_sql', label:'쿼리', placeholder:'SELECT * FROM user_info', width:300}],
          query: function(p) {
            var sql = p.exp_sql || 'SELECT * FROM table_name';
            return "EXPLAIN ANALYZE\n" + sql + ";";
          }
        },
        {
          key: 'slow_sql', label: '느린 SQL 찾기', desc: 'pg_stat_statements 기반',
          params: [],
          query: function(p) {
            return "-- 전제: pg_stat_statements 확장 필요. 없으면 relation does not exist\n--   1) postgresql.conf의 shared_preload_libraries에 pg_stat_statements 추가 후 재기동\n--   2) CREATE EXTENSION pg_stat_statements;\n\nSELECT query\n     , calls\n     , ROUND(total_exec_time::numeric, 2)              AS total_ms\n     , ROUND((total_exec_time / calls)::numeric, 2)    AS avg_ms\n     , ROUND(rows / calls::numeric, 2)                 AS avg_rows\nFROM   pg_stat_statements\nWHERE  calls > 0\nORDER BY avg_ms DESC\nLIMIT 20;";
          }
        },
        {
          key: 'session', label: '활성 세션 확인', desc: '현재 접속 세션 목록',
          params: [],
          query: function(p) {
            return "SELECT pid\n     , usename        AS username\n     , application_name\n     , state\n     , wait_event_type\n     , wait_event\n     , ROUND(EXTRACT(EPOCH FROM (now() - state_change))::numeric, 0) AS elapsed_sec\n     , LEFT(query, 100) AS query_preview\nFROM   pg_stat_activity\nWHERE  usename IS NOT NULL\n  AND  pid <> pg_backend_pid()\nORDER BY elapsed_sec DESC NULLS LAST;";
          }
        },
        {
          key: 'lock', label: '락(Lock) 조회', desc: '락 걸린 세션 및 대기 세션',
          params: [],
          query: function(p) {
            return "SELECT blocked.pid          AS waiting_pid\n     , blocked.usename      AS waiting_user\n     , blocking.pid         AS blocking_pid\n     , blocking.usename     AS blocking_user\n     , blocked.query        AS waiting_query\n     , blocking.query       AS blocking_query\nFROM   pg_stat_activity blocked\n     , pg_stat_activity blocking\n     , pg_locks          bl\n     , pg_locks          kl\nWHERE  bl.granted = false\n  AND  bl.pid = blocked.pid\n  AND  kl.granted = true\n  AND  kl.pid = blocking.pid\n  AND  bl.relation = kl.relation;";
          }
        },
        {
          key: 'uncommit', label: '미커밋 트랜잭션', desc: '오래된 미완료 트랜잭션',
          params: [],
          query: function(p) {
            return "SELECT pid\n     , usename        AS username\n     , state\n     , xact_start\n     , ROUND(EXTRACT(EPOCH FROM (now() - xact_start))::numeric, 0) AS elapsed_sec\n     , LEFT(query, 100) AS query\nFROM   pg_stat_activity\nWHERE  xact_start IS NOT NULL\n  AND  state <> 'idle'\nORDER BY xact_start;";
          }
        },
        {
          key: 'kill_session', label: '세션 종료', desc: '특정 PID 세션 강제 종료',
          params: [{id:'kill_pid', label:'PID', placeholder:'12345', width:120}],
          query: function(p) {
            var pid = p.kill_pid || 'PID';
            return "SELECT pg_cancel_backend(" + pid + ");    -- 실행 중인 쿼리만 취소(세션은 유지)\nSELECT pg_terminate_backend(" + pid + ");  -- 세션 자체 강제 종료\n-- 대상 확인: SELECT pid, usename, query FROM pg_stat_activity;";
          }
        },
        {
          key: 'vacuum', label: 'Vacuum 상태 확인', desc: 'autovacuum 현황 및 dead tuple',
          params: [],
          query: function(p) {
            return "-- 테이블별 vacuum 상태\nSELECT relname                           AS table_name\n     , n_live_tup                         AS live_rows\n     , n_dead_tup                         AS dead_rows\n     , ROUND(n_dead_tup * 100.0 / NULLIF(n_live_tup + n_dead_tup, 0), 1) AS dead_pct\n     , last_vacuum\n     , last_autovacuum\n     , last_analyze\n     , last_autoanalyze\nFROM   pg_stat_user_tables\nORDER BY dead_pct DESC NULLS LAST\nLIMIT 20;\n\n-- 현재 실행 중인 autovacuum\nSELECT pid, query, state, wait_event\nFROM   pg_stat_activity\nWHERE  query LIKE '%autovacuum%';";
          }
        },
        {
          key: 'db_size', label: 'DB 및 스키마 용량', desc: 'DB 전체 용량 확인',
          params: [],
          query: function(p) {
            return "-- 현재 DB 용량\nSELECT pg_size_pretty(pg_database_size(current_database())) AS db_size;\n\n-- 스키마별 용량\nSELECT schemaname\n     , pg_size_pretty(SUM(pg_total_relation_size(schemaname||'.'||tablename))::bigint) AS schema_size\nFROM   pg_tables\nGROUP BY schemaname\nORDER BY SUM(pg_total_relation_size(schemaname||'.'||tablename)) DESC;";
          }
        },
      ]
    },
    {
      category: '오브젝트',
      items: [
        {
          key: 'func_list', label: '프로시저/함수 목록', desc: '스키마 내 함수 목록',
          params: [],
          query: function(p) {
            return "SELECT routine_name\n     , routine_type\n     , data_type      AS return_type\n     , created\n     , last_altered\nFROM   information_schema.routines\nWHERE  routine_schema = 'public'\nORDER BY routine_name;";
          }
        },
        {
          key: 'func_source', label: '프로시저/함수 소스 조회', desc: '지정한 함수의 전체 정의를 pg_get_functiondef로 조회',
          params: [{id:'src_name', label:'함수명', placeholder:'fn_get_name', width:200}],
          query: function(p) {
            var n = p.src_name || 'function_name';
            return "SELECT p.proname\n     , pg_get_functiondef(p.oid) AS source\nFROM   pg_proc      p\n     , pg_namespace  n\nWHERE  p.pronamespace = n.oid\n  AND  n.nspname = 'public'\n  AND  p.proname = '" + n + "';";
          }
        },
        {
          key: 'source_grep', label: '소스 전체 검색 (키워드)', desc: '전체 함수 정의에서 특정 테이블명·컬럼명·키워드가 포함된 함수를 pg_proc.prosrc에서 검색',
          params: [{id:'grep_kw', label:'검색어', placeholder:'mdch_docu_id', width:200}],
          query: function(p) {
            var k = p.grep_kw || '키워드';
            return "SELECT p.proname\n     , p.prosrc\nFROM   pg_proc      p\n     , pg_namespace  n\nWHERE  p.pronamespace = n.oid\n  AND  n.nspname = 'public'\n  AND  p.prosrc ILIKE '%" + k + "%'\nORDER BY p.proname;";
          }
        },
        {
          key: 'view_list', label: '뷰 목록 조회', desc: 'public 스키마 뷰 목록',
          params: [],
          query: function(p) {
            return "SELECT table_name   AS view_name\n     , view_definition\nFROM   information_schema.views\nWHERE  table_schema = 'public'\nORDER BY table_name;";
          }
        },
        {
          key: 'trigger_list', label: '트리거 목록', desc: '트리거 및 이벤트 확인',
          params: [],
          query: function(p) {
            return "SELECT trigger_name\n     , event_manipulation   AS event\n     , event_object_table   AS table_name\n     , action_timing\n     , action_statement\nFROM   information_schema.triggers\nWHERE  trigger_schema = 'public'\nORDER BY table_name, trigger_name;";
          }
        },
        {
          key: 'invalid_obj', label: '무효 오브젝트 조회', desc: '뷰·함수는 즉시 검증돼 Oracle식 INVALID 상태 자체가 없음',
          params: [],
          query: function(p) {
            return "-- PostgreSQL은 뷰·함수를 만들 때 즉시 파싱/검증함(존재하지 않는 컬럼이면 CREATE 자체가 실패)\n-- 나중에 의존 테이블/컬럼이 바뀌어도 카탈로그에 '무효'로 표시되는 개념이 없음\n-- pg_depend로 의존 관계는 추적 가능하지만 '깨졌는지'는 직접 실행해봐야 확인됨:\nSELECT table_name FROM information_schema.views WHERE table_schema = 'public';\n-- 위 목록을 순회하며 SELECT * FROM <view> LIMIT 0; 실행 → 에러 나는 뷰가 '무효'";
          }
        },
        {
          key: 'error_detail', label: '컴파일 에러 상세 조회', desc: 'PostgreSQL은 CREATE 시점에 즉시 에러 반환 — Oracle식 에러 카탈로그 없음',
          params: [],
          query: function(p) {
            return "-- Oracle의 USER_ERRORS처럼 컴파일 에러를 저장해두는 카탈로그가 없음\n-- CREATE FUNCTION 실행 시 문법 오류는 그 자리에서 바로 반환됨(단, 함수 본문 내부 타입 오류는 호출 시점에야 드러남 — PL/pgSQL 특성)\n-- 서버 로그에서 과거 에러 확인: SHOW log_directory; SHOW log_filename;";
          }
        },
        {
          key: 'recent_ddl', label: '최근 변경 객체', desc: 'PG 딕셔너리엔 DDL 변경시각이 없음 — event trigger 직접 구성 필요',
          params: [],
          query: function(p) {
            return "-- PostgreSQL 카탈로그(pg_class 등)엔 생성일·수정일 컬럼 자체가 없음(02번 테이블정의서와 동일 함정)\n-- 방법1) 파일시스템 타임스탬프로 근사(백업/복제 환경에선 부정확)\nSELECT relname, pg_stat_file(pg_relation_filepath(oid))\nFROM   pg_class WHERE relkind = 'r' LIMIT 5;  -- 대량 조회는 비용 큼, 표본 확인용\n-- 방법2) 정확히 추적하려면 사전에 event trigger + DDL 로그 테이블을 직접 만들어둬야 함\n-- (ddl_command_end 이벤트로 pg_event_trigger_ddl_commands() 캡처) — 사후 조회 불가, 사전 구성 필수";
          }
        },
      ]
    },
    {

          key: 'gather_stats', label: '통계정보 수집', desc: 'ANALYZE 실행',
          params: [{id:'an_tbl', label:'테이블명(빈칸=DB 전체)', placeholder:'user_info', width:180}],

      items: [
        {
          key: 'db_time', label: 'DB 현재 시간 확인', desc: '서버 시간·타임존 확인 (WAS-DB 시간 불일치 디버깅)',
          params: [],
          query: function(p) {
            return "SELECT NOW()                        AS db_time     -- 트랜잭션 시작 시각 (CURRENT_TIMESTAMP와 동일)\n     , CLOCK_TIMESTAMP()            AS real_time   -- 호출 시점 실제 시각 (장기 트랜잭션에서 구분됨)\n     , NOW() AT TIME ZONE 'UTC'     AS utc_time\n     , CURRENT_SETTING('TIMEZONE')  AS timezone;";
