  mssql: [
    {
      category: '테이블',
      items: [
        {
          key: 'tbl_list', label: '테이블 목록 조회', desc: 'sys.tables 기반, 행수·코멘트 포함',
          params: [{id:'tbl_search', label:'테이블명 (빈칸=전체)', placeholder:'USER%', width:180}],
          query: function(p) {
            var s = p.tbl_search || '%';
            if (s && s.indexOf('%') < 0) s = '%' + s + '%';
            return "SELECT s.name                              AS schema_name\n     , t.name                              AS table_name\n     , (SELECT SUM(p.rows) FROM sys.partitions p\n        WHERE  p.object_id = t.object_id AND p.index_id IN (0,1)) AS row_cnt\n     , CAST(ep.value AS NVARCHAR(200))     AS table_comment\n     , CONVERT(CHAR(10), t.create_date, 23) AS created\n     , CONVERT(CHAR(10), t.modify_date, 23) AS modified\nFROM   sys.tables t\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\n       LEFT JOIN sys.extended_properties ep ON ep.major_id = t.object_id\n            AND ep.minor_id = 0 AND ep.name = 'MS_Description'\nWHERE  t.name LIKE '" + s + "'\nORDER BY s.name, t.name;";
          }
        },
        {
          key: 'col_list', label: '컬럼 목록 조회', desc: '컬럼 정의 + 코멘트(extended_properties) + PK',
          params: [{id:'col_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.col_tbl || 'TABLE_NAME';
            return "SELECT s.name                          AS OWNER\n     , t.name                              AS TABLE_NAME\n     , c.column_id                         AS COLUMN_ID\n     , c.name                              AS COLUMN_NAME\n     , ty.name                             AS DATA_TYPE\n     , c.max_length                        AS DATA_LENGTH\n     , c.scale                             AS DATA_SCALE\n     , CASE WHEN c.is_nullable = 1 THEN 'Y' ELSE 'N' END AS NULLABLE\n     , CASE WHEN pk.column_id IS NOT NULL THEN 'Y' ELSE 'N' END AS pk_yn\n     , CAST(ep.value AS NVARCHAR(200))     AS column_comment\nFROM   sys.columns c\n       JOIN sys.tables t  ON c.object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\n       JOIN sys.types ty  ON c.user_type_id = ty.user_type_id\n       LEFT JOIN sys.extended_properties ep ON ep.major_id = c.object_id\n            AND ep.minor_id = c.column_id AND ep.name = 'MS_Description'\n       LEFT JOIN (SELECT ic.object_id, ic.column_id\n                  FROM   sys.index_columns ic\n                         JOIN sys.indexes i ON ic.object_id = i.object_id\n                              AND ic.index_id = i.index_id\n                  WHERE  i.is_primary_key = 1) pk\n              ON pk.object_id = c.object_id AND pk.column_id = c.column_id\nWHERE  t.name = '" + t + "'\nORDER BY c.column_id;\n-- 열 순서는 논리명_변환기.html «3.컬럼 목록» 업로드 양식과 맞춤 — 그대로 붙여넣기 가능";
          }
        },
        {
          key: 'tbl_size', label: '테이블 용량 조회', desc: '용량 상위 테이블',
          params: [],
          query: function(p) {
            return "SELECT t.name                                            AS table_name\n     , ROUND(SUM(a.total_pages) * 8 / 1024.0, 2)         AS total_mb\n     , ROUND(SUM(a.used_pages)  * 8 / 1024.0, 2)         AS used_mb\n     , SUM(CASE WHEN p.index_id IN (0,1) THEN p.rows ELSE 0 END) AS row_cnt\nFROM   sys.tables t\n       JOIN sys.partitions p       ON t.object_id = p.object_id\n       JOIN sys.allocation_units a ON p.partition_id = a.container_id\nGROUP BY t.name\nORDER BY SUM(a.total_pages) DESC;";
          }
        },
        {
          key: 'fk_ref', label: 'FK 참조 관계 조회', desc: '특정 테이블 참조 확인',
          params: [{id:'fk_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.fk_tbl || 'TABLE_NAME';
            return "SELECT fk.name  AS fk_name\n     , ct.name  AS 참조하는테이블\n     , cc.name  AS FK컬럼\n     , pt.name  AS 참조당하는테이블\n     , pc.name  AS 참조컬럼\nFROM   sys.foreign_key_columns fkc\n       JOIN sys.foreign_keys fk ON fkc.constraint_object_id = fk.object_id\n       JOIN sys.tables pt  ON fkc.referenced_object_id = pt.object_id\n       JOIN sys.columns pc ON pc.object_id = pt.object_id AND pc.column_id = fkc.referenced_column_id\n       JOIN sys.tables ct  ON fkc.parent_object_id = ct.object_id\n       JOIN sys.columns cc ON cc.object_id = ct.object_id AND cc.column_id = fkc.parent_column_id\nWHERE  pt.name = '" + t + "'\nORDER BY ct.name;";
          }
        },
        {
          key: 'tbl_ddl', label: 'DDL 추출', desc: '정의 요약 조회 (CREATE 원문은 SSMS)',
          params: [{id:'ddl_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.ddl_tbl || 'TABLE_NAME';
            return "EXEC sp_help '" + t + "';\n\n-- CREATE TABLE 원문 추출은 SQL만으론 불가\n-- SSMS: 테이블 우클릭 → Script Table as → CREATE To → New Query";
          }
        },
        {
          key: 'tbl_comment', label: '테이블/컬럼 주석 조회', desc: '테이블 및 컬럼 comment(MS_Description) 확인',
          params: [{id:'cm_tbl', label:'테이블명(빈칸=전체)', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.cm_tbl;
            return "SELECT s.name AS schema_name, t.name AS table_name, CAST(ep.value AS NVARCHAR(200)) AS table_comment\nFROM   sys.tables t\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\n       LEFT JOIN sys.extended_properties ep ON ep.major_id = t.object_id AND ep.minor_id = 0 AND ep.name = 'MS_Description'\n" + (t ? "WHERE  t.name = '" + t + "'\n" : "") + "ORDER BY t.name;\n\nSELECT t.name AS table_name, c.name AS column_name, CAST(ep.value AS NVARCHAR(200)) AS column_comment\nFROM   sys.columns c\n       JOIN sys.tables t ON c.object_id = t.object_id\n       LEFT JOIN sys.extended_properties ep ON ep.major_id = c.object_id AND ep.minor_id = c.column_id AND ep.name = 'MS_Description'\nWHERE  ep.value IS NOT NULL" + (t ? " AND t.name = '" + t + "'" : "") + "\nORDER BY t.name, c.column_id;";
          }
        },
        {
          key: 'tablespace', label: '테이블스페이스 용량', desc: '파일그룹 단위 용량 확인 (Oracle 테이블스페이스에 해당)',
          params: [],
          query: function(p) {
            return "SELECT fg.name                                       AS filegroup_name\n     , f.name                                        AS logical_file_name\n     , f.physical_name\n     , ROUND(f.size / 128.0, 1)                       AS size_mb          -- size 단위 = 8KB 페이지\n     , ROUND(FILEPROPERTY(f.name,'SpaceUsed') / 128.0, 1) AS used_mb\nFROM   sys.filegroups fg\n       JOIN sys.database_files f ON fg.data_space_id = f.data_space_id\nORDER  BY fg.name;\n-- DB 전체 요약은 EXEC sp_spaceused; 로도 확인 가능(02번 데이터용량 쿼리와 동일)";
          }
        },
        {
          key: 'grp_count', label: '그룹핑 카운트', desc: '코드성 컬럼 값 분포 확인',
          params: [
            {id:'grp_tbl', label:'테이블명', placeholder:'USER_INFO', width:160},
            {id:'grp_col', label:'컬럼명', placeholder:'USE_YN', width:120}
          ],
          query: function(p) {
            var t = p.grp_tbl || 'TABLE_NAME';
            var c = p.grp_col || 'COLUMN_NAME';
            return "SELECT " + c + "\n     , COUNT(*) AS cnt\nFROM   " + t + "\nGROUP BY " + c + "\nORDER BY cnt DESC;";
          }
        },
      ]
    },
    {
      category: '인덱스',
      items: [
        {
          key: 'idx_list', label: '인덱스 목록 조회', desc: '테이블의 인덱스 및 컬럼',
          params: [{id:'idx_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.idx_tbl || 'TABLE_NAME';
            return "SELECT i.name          AS index_name\n     , c.name           AS column_name\n     , ic.key_ordinal\n     , i.is_unique\n     , i.type_desc\nFROM   sys.indexes i\n       JOIN sys.index_columns ic ON i.object_id = ic.object_id AND i.index_id = ic.index_id\n       JOIN sys.columns c        ON ic.object_id = c.object_id AND ic.column_id = c.column_id\nWHERE  i.object_id = OBJECT_ID('" + t + "')\n  AND  i.name IS NOT NULL\nORDER BY i.name, ic.key_ordinal;";
          }
        },
        {
          key: 'idx_usage', label: '인덱스 사용 현황', desc: '안 쓰이는 인덱스 확인',
          params: [],
          query: function(p) {
            return "SELECT OBJECT_NAME(s.object_id)  AS table_name\n     , i.name                    AS index_name\n     , s.user_seeks, s.user_scans, s.user_lookups, s.user_updates\n     , s.last_user_seek, s.last_user_scan\nFROM   sys.dm_db_index_usage_stats s\n       JOIN sys.indexes i ON s.object_id = i.object_id AND s.index_id = i.index_id\nWHERE  s.database_id = DB_ID()\n  AND  OBJECTPROPERTY(s.object_id,'IsUserTable') = 1\n  AND  s.user_seeks = 0 AND s.user_scans = 0 AND s.user_lookups = 0\nORDER BY table_name, index_name;\n-- dm_db_index_usage_stats는 서버 재시작 시 초기화됨 — 최근 재시작 시각 고려";
          }
        },
      ]
    },
    {
      category: '시퀀스',
      items: [
        {
          key: 'seq_list', label: '시퀀스 목록 조회', desc: 'SQL Server 2012+ 전용 객체',
          params: [],
          query: function(p) {
            return "SELECT s.name                                AS schema_name\n     , seq.name                              AS sequence_name\n     , seq.current_value\n     , seq.increment\n     , seq.minimum_value, seq.maximum_value\n     , seq.is_cycling\nFROM   sys.sequences seq\n       JOIN sys.schemas s ON seq.schema_id = s.schema_id\nORDER  BY s.name, seq.name;\n-- 2012 미만은 IDENTITY만 있음 — 이 쿼리 대상 아님";
          }
        },
        {
          key: 'seq_curr', label: '시퀀스 현재/다음값', desc: 'sys.sequences 조회 / NEXT VALUE FOR',
          params: [{id:'seq_name', label:'시퀀스명', placeholder:'SEQ_USER_ID', width:180}],
          query: function(p) {
            var n = p.seq_name || 'SEQ_NAME';
            return "-- 현재값 (증가 없이 확인)\nSELECT current_value FROM sys.sequences WHERE name = '" + n + "';\n\n-- 다음 채번 (증가 발생)\nSELECT NEXT VALUE FOR " + n + ";";
          }
        },
        {
          key: 'seq_reset', label: '시퀀스 값 초기화', desc: '현재값을 특정 값으로 리셋',
          params: [{id:'rs_seq', label:'시퀀스명', placeholder:'SEQ_USER_ID', width:180}, {id:'rs_val', label:'설정값', placeholder:'1000', width:100}],
          query: function(p) {
            var n = p.rs_seq || 'SEQ_NAME';
            var v = p.rs_val || '1';
            return "ALTER SEQUENCE " + n + " RESTART WITH " + v + ";";
          }
        },
      ]
    },
    {
      category: '성능/모니터링',
      items: [
        {
          key: 'explain', label: '실행 계획', desc: 'SHOWPLAN / SSMS 단축키 안내',
          params: [{id:'exp_sql', label:'쿼리', placeholder:'SELECT * FROM USER_INFO', width:300}],
          query: function(p) {
            var sql = p.exp_sql || 'SELECT * FROM TABLE_NAME';
            return "-- 예상 실행 계획 (실행 안 함)\nSET SHOWPLAN_ALL ON;\nGO\n" + sql + ";\nGO\nSET SHOWPLAN_ALL OFF;\nGO\n\n-- SSMS: Ctrl+L = 예상 계획, Ctrl+M 켜고 실행 = 실제 계획";
          }
        },
        {
          key: 'slow_sql', label: '느린 SQL 찾기', desc: 'dm_exec_query_stats 기준 TOP 20',
          params: [],
          query: function(p) {
            return "SELECT TOP 20\n       qs.execution_count                                        AS calls\n     , ROUND(qs.total_elapsed_time / qs.execution_count / 1000.0, 2) AS avg_ms\n     , ROUND(qs.total_elapsed_time / 1000.0, 2)                  AS total_ms\n     , SUBSTRING(st.text, (qs.statement_start_offset / 2) + 1,\n         ((CASE qs.statement_end_offset WHEN -1 THEN DATALENGTH(st.text)\n           ELSE qs.statement_end_offset END - qs.statement_start_offset) / 2) + 1) AS query_text\nFROM   sys.dm_exec_query_stats qs\n       CROSS APPLY sys.dm_exec_sql_text(qs.sql_handle) st\nORDER BY avg_ms DESC;";
          }
        },
        {
          key: 'session', label: '활성 세션 확인', desc: '현재 접속 세션 목록',
          params: [],
          query: function(p) {
            return "EXEC sp_who2;\n\n-- 또는 상세\nSELECT s.session_id\n     , s.login_name\n     , s.status\n     , s.host_name\n     , s.program_name\n     , r.command\n     , r.wait_type\n     , r.total_elapsed_time AS elapsed_ms\nFROM   sys.dm_exec_sessions s\n       LEFT JOIN sys.dm_exec_requests r ON s.session_id = r.session_id\nWHERE  s.is_user_process = 1\nORDER BY r.total_elapsed_time DESC;";
          }
        },
        {
          key: 'lock', label: '락(Lock) 조회', desc: '블로킹 세션 및 대기 세션',
          params: [],
          query: function(p) {
            return "SELECT w.session_id           AS waiting_sid\n     , w.blocking_session_id   AS blocking_sid\n     , w.wait_type\n     , w.wait_duration_ms\n     , t.text                  AS waiting_query\nFROM   sys.dm_os_waiting_tasks w\n       LEFT JOIN sys.dm_exec_requests r ON w.session_id = r.session_id\n       OUTER APPLY sys.dm_exec_sql_text(r.sql_handle) t\nWHERE  w.blocking_session_id IS NOT NULL\nORDER BY w.wait_duration_ms DESC;";
          }
        },
        {
          key: 'uncommit', label: '미커밋 트랜잭션', desc: '커밋 안 된 오래된 트랜잭션',
          params: [],
          query: function(p) {
            return "SELECT s.session_id\n     , at.transaction_id\n     , at.transaction_begin_time\n     , DATEDIFF(SECOND, at.transaction_begin_time, GETDATE()) AS 경과초\n     , s.login_name\n     , t.text AS last_query\nFROM   sys.dm_tran_active_transactions at\n       JOIN sys.dm_tran_session_transactions st ON at.transaction_id = st.transaction_id\n       JOIN sys.dm_exec_sessions s ON st.session_id = s.session_id\n       LEFT JOIN sys.dm_exec_requests r ON s.session_id = r.session_id\n       OUTER APPLY sys.dm_exec_sql_text(r.sql_handle) t\nWHERE  DATEDIFF(SECOND, at.transaction_begin_time, GETDATE()) > 60\nORDER  BY at.transaction_begin_time;";
          }
        },
        {
          key: 'kill_session', label: '세션 종료', desc: '특정 세션 강제 종료',
          params: [{id:'kill_sid', label:'session_id', placeholder:'123', width:80}],
          query: function(p) {
            var sid = p.kill_sid || 'SESSION_ID';
            return "-- 먼저 세션 확인\nEXEC sp_who2 '" + sid + "';\n\n-- 세션 종료 (주의: 권한 필요)\nKILL " + sid + ";";
          }
        },
      ]
    },
    {
      category: '오브젝트',
      items: [
        {
          key: 'proc_list', label: '프로시저/함수 목록', desc: '생성·수정일 포함',
          params: [],
          query: function(p) {
            return "SELECT name\n     , type_desc\n     , CONVERT(CHAR(10), create_date, 23) AS created\n     , CONVERT(CHAR(10), modify_date, 23) AS modified\nFROM   sys.objects\nWHERE  type IN ('P','FN','IF','TF')\nORDER BY type_desc, name;\n\n-- 소스 보기\n-- SELECT OBJECT_DEFINITION(OBJECT_ID('프로시저명'));\n-- EXEC sp_helptext '프로시저명';";
          }
        },
        {
          key: 'proc_source', label: '프로시저/함수 소스 조회', desc: '지정한 프로시저·함수의 전체 정의를 sys.sql_modules에서 조회',
          params: [{id:'src_name', label:'객체명', placeholder:'FN_GET_NAME', width:200}],
          query: function(p) {
            var n = p.src_name || 'OBJECT_NAME';
            return "SELECT OBJECT_DEFINITION(OBJECT_ID('" + n + "')) AS source;\n\n-- 또는\nSELECT m.definition\nFROM   sys.sql_modules m\nWHERE  m.object_id = OBJECT_ID('" + n + "');\n\n-- WITH ENCRYPTION으로 만든 오브젝트는 definition이 NULL — 원본 소스 별도 보관 필요";
          }
        },
        {
          key: 'source_grep', label: '소스 전체 검색 (키워드)', desc: '전체 프로시저·함수·뷰 정의에서 특정 테이블명·컬럼명·키워드가 포함된 오브젝트를 sys.sql_modules에서 검색',
          params: [{id:'grep_kw', label:'검색어', placeholder:'mdch_docu_id', width:200}],
          query: function(p) {
            var k = p.grep_kw || '키워드';
            return "SELECT o.name\n     , o.type_desc\n     , m.definition\nFROM   sys.sql_modules m\n     , sys.objects     o\nWHERE  m.object_id = o.object_id\n  AND  m.definition LIKE '%" + k + "%'\nORDER BY o.name;";
          }
        },
        {
          key: 'view_list', label: '뷰 목록', desc: '뷰 목록 및 정의 확인',
          params: [],
          query: function(p) {
            return "SELECT name\n     , CONVERT(CHAR(10), create_date, 23) AS created\n     , CONVERT(CHAR(10), modify_date, 23) AS modified\nFROM   sys.views\nORDER BY name;\n\n-- 정의 보기\n-- SELECT OBJECT_DEFINITION(OBJECT_ID('뷰명'));";
          }
        },
        {
          key: 'trigger_list', label: '트리거 목록', desc: '트리거 정보 및 활성화 상태',
          params: [],
          query: function(p) {

          }

        {
          key: 'seq_list', label: '시퀀스 목록 조회', desc: '★ ASE의 CREATE SEQUENCE는 SQLScript 호환 모드 전용 — 일반 T-SQL ASE엔 없을 수 있음',
          params: [],
          query: function(p) {
            return "-- 공식 문서에 syssequences가 \"(SQLScript only)\"로 명시돼 있음 — 이 서버가 그 모드를 안 쓰면 결과 0건이 정상\nSELECT o.name       AS sequence_name\n     , s.startwith\n     , s.minval\n     , s.maxval\n     , s.increment\n     , s.cache\nFROM   syssequences s\n       JOIN sysobjects o ON s.id = o.id\nWHERE  o.type = 'SQ'\nORDER  BY o.name;\n-- 0건이면: 이 프로젝트는 시퀀스 대신 IDENTITY 컬럼이나 max(id)+1 수동 채번 방식일 가능성 높음 — 설계서로 확인";

          params: [{id:'src_name', label:'객체명', placeholder:'PROC_GET_NAME', width:200}],
          query: function(p) {
            var n = p.src_name || 'OBJECT_NAME';
            return "sp_helptext " + n + ";\n\n-- 또는 직접 조회(긴 소스는 여러 행에 나뉘어 저장됨 — colid 순 재조합 필요)\nSELECT c.colid, c.text\nFROM   syscomments c\nWHERE  c.id = object_id('" + n + "')\nORDER  BY c.colid;";
          }
        },
        {
          key: 'source_grep', label: '소스 전체 검색 (키워드)', desc: '전체 프로시저 정의에서 특정 테이블명·컬럼명·키워드가 등장하는 위치를 syscomments에서 조각(colid) 순으로 검색',
          params: [{id:'grep_kw', label:'검색어', placeholder:'mdch_docu_id', width:200}],
          query: function(p) {
            var k = p.grep_kw || '키워드';
            return "SELECT OBJECT_NAME(c.id) AS name\n     , c.colid\n     , c.text\nFROM   syscomments c\nWHERE  c.text LIKE '%" + k + "%'\nORDER BY name, c.colid;";
          }
        },
        {
          key: 'view_list', label: '뷰 목록', desc: 'sysobjects type V',
          params: [],
          query: function(p) {
            return "SELECT name\n     , crdate AS created\nFROM   sysobjects\nWHERE  type = 'V'\nORDER BY name;\n\n-- 정의 보기\n-- sp_helptext 뷰명;";
          }
        },
        {
          key: 'trigger_list', label: '트리거 목록', desc: 'sysobjects type TR',
          params: [],
          query: function(p) {
            return "SELECT tr.name          AS trigger_name\n     , object_name(tr.deltrig) AS parent_hint   -- 트리거-테이블 매핑은 아래 방식이 더 정확\n     , tr.crdate        AS created\nFROM   sysobjects tr\nWHERE  tr.type = 'TR'\nORDER BY tr.name;\n\n-- 테이블 기준으로 걸린 트리거 확인(더 정확)\nSELECT object_name(id) AS table_name, deltrig, instrig, updtrig\nFROM   sysobjects WHERE type = 'U' AND (deltrig <> 0 OR instrig <> 0 OR updtrig <> 0);";
          }
        },
        {
          key: 'invalid_obj', label: '무효 오브젝트 조회', desc: 'ASE도 Oracle식 INVALID 상태 카탈로그가 없음',
          params: [],
          query: function(p) {
            return "-- ASE는 프로시저 생성 시 존재하지 않는 테이블을 참조해도 지연 이름 확인으로 일단 만들어짐(MSSQL과 유사)\n-- Oracle처럼 카탈로그에 '무효'로 표시되는 상태 자체가 없음 — 실행 시점에야 에러가 드러남\n-- 대안: 프로시저를 재컴파일해보고 에러 나는지 확인\nsp_recompile '프로시저명';";
          }
        },
        {
          key: 'error_detail', label: '컴파일 에러 상세 조회', desc: 'ASE는 컴파일 에러를 저장하는 카탈로그가 없음',
          params: [],
          query: function(p) {
            return "-- CREATE PROCEDURE 실행 시 문법 오류는 그 자리에서 바로 반환됨\n-- Oracle의 USER_ERRORS 같은 영속 카탈로그가 없어 사후 조회 불가\n-- 과거 에러가 필요하면 ASE 에러 로그 파일 확인(sp_configure 'errorlog' 로 경로 확인 후 OS에서 직접 열람)\nsp_configure 'errorlog';";
          }
        },
        {
          key: 'recent_ddl', label: '최근 변경 객체', desc: 'sysobjects.crdate 기준 — 생성일만 있고 수정일 추적은 안 됨',
          params: [{id:'ddl_days', label:'최근 N일', placeholder:'7', width:80}],
          query: function(p) {
            var days = p.ddl_days || '7';
            return "SELECT name, type, crdate AS created\nFROM   sysobjects\nWHERE  crdate >= dateadd(day, -" + days + ", getdate())\nORDER  BY crdate DESC;\n-- ASE sysobjects엔 modify_date 같은 '최종수정일' 컬럼이 없음(02번 테이블정의서와 동일 함정)\n-- ALTER로 컬럼만 추가한 경우는 crdate가 안 바뀌어 이 쿼리로 못 잡음 — 감사(auditing) 미설정 시 복원 불가";
          }
        },
      ]
    },
    {
      category: '사용자/권한',
      items: [
        {
          key: 'user_privs', label: '사용자 시스템 권한', desc: 'sysprotects 기반 (action 코드는 master..spt_values 로 해석)',
          params: [],
          query: function(p) {
            return "SELECT u.name                    AS user_name\n     , v.name                    AS permission_name\n     , CASE pr.protecttype WHEN 0 THEN 'GRANT WITH GRANT' WHEN 1 THEN 'GRANT' WHEN 2 THEN 'REVOKE' END AS grant_type\nFROM   sysprotects pr\n       JOIN sysusers u ON pr.uid = u.uid\n       JOIN master..spt_values v ON pr.action = v.number AND v.type IN ('T','GP')\nWHERE  pr.id = 0   -- 0 = 시스템 권한(create table 등 객체에 안 걸리는 권한)\nORDER  BY user_name, permission_name;";
          }
        },
        {
          key: 'table_privs', label: '테이블 권한 조회', desc: '다른 계정 테이블 접근 권한',
          params: [{id:'tp_tbl', label:'테이블명(빈칸=전체)', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.tp_tbl;
            return "SELECT u.name              AS grantee\n     , o.name              AS table_name\n     , v.name              AS permission_name\nFROM   sysprotects pr\n       JOIN sysusers u ON pr.uid = u.uid\n       JOIN sysobjects o ON pr.id = o.id\n       JOIN master..spt_values v ON pr.action = v.number AND v.type = 'T'\nWHERE  o.type = 'U'" + (t ? "\n  AND  o.name = '" + t + "'" : "") + "\nORDER  BY table_name, grantee;";
          }
        },
      ]
    },
    {
      category: '통계/유지보수',
      items: [
        {
          key: 'gather_stats', label: '통계정보 수집', desc: 'UPDATE STATISTICS 실행',
          params: [{id:'us_tbl', label:'테이블명', placeholder:'USER_INFO', width:180}],
          query: function(p) {
            var t = p.us_tbl || 'TABLE_NAME';
            return "UPDATE STATISTICS " + t + ";\n-- 인덱스까지 전부: UPDATE INDEX STATISTICS " + t + ";\n-- 전체 DB 일괄은 내장 SP 없음 — 테이블별로 반복 실행";
          }
        },
      ]
    },
    {
      category: '환경/시간',
      items: [
        {
          key: 'db_time', label: 'DB 현재 시간 확인', desc: '서버 시간·타임존 확인 (WAS-DB 시간 불일치 디버깅)',
          params: [],
          query: function(p) {
            return "SELECT GETDATE()    AS db_time\n     , GETUTCDATE() AS utc_time;";
          }
        },
      ]
    },
  ]
};

function getFavKey(db, key) { return db + ':' + key; }
function isFav(db, key) { return !!favorites[getFavKey(db, key)]; }
function toggleFav() {
  if(!currentItem || !currentKey) return;
  var fk = getFavKey(currentDb, currentKey);
  if(favorites[fk]) { delete favorites[fk]; }
  else { favorites[fk] = {db:currentDb, key:currentKey, label:currentItem.label}; }
  localStorage.setItem('sql_favs', JSON.stringify(favorites));
  updateFavBtn();
  renderSidebar();
}
function updateFavBtn() {
  var btn = document.getElementById('fav_btn');
  var active = isFav(currentDb, currentKey);
  btn.textContent = active ? '★' : '☆';
  btn.classList.toggle('active', active);
}

function filterSnippets() {
  var q = document.getElementById('search_input').value.toLowerCase().trim();
  var btns = document.querySelectorAll('.snip-btn');
  var labels = document.querySelectorAll('.sidebar-label');
  btns.forEach(function(btn) {
    var match = !q || btn.textContent.toLowerCase().indexOf(q) >= 0;
    btn.classList.toggle('hidden', !match);
  });
  labels.forEach(function(lbl) {
    var next = lbl.nextElementSibling;
    var hasVisible = false;
    while(next && !next.classList.contains('sidebar-label')) {
      if(next.classList.contains('snip-btn') && !next.classList.contains('hidden')) hasVisible = true;
      next = next.nextElementSibling;
    }
    lbl.style.display = hasVisible ? '' : 'none';
  });
  var noRes = document.getElementById('no_results');
  var anyVisible = document.querySelectorAll('.snip-btn:not(.hidden)').length > 0;
  if(noRes) noRes.style.display = anyVisible ? 'none' : 'block';
}
function clearSearch() {
  document.getElementById('search_input').value = '';
  filterSnippets();
}

function switchDb(db) {
  currentDb = db;
  currentKey = null;
  currentItem = null;
  document.querySelectorAll('.db-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('.db-tab.' + db).classList.add('active');
  renderSidebar();
  clearOutput();
  localStorage.setItem('sql_lastDb', db);
}

function renderSidebar() {
  var sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  var data = SNIPPETS[currentDb];

  var favItems = [];
  data.forEach(function(group) {
    group.items.forEach(function(item) {
      if(isFav(currentDb, item.key)) favItems.push(item);
    });
  });
  if(favItems.length > 0) {
    var lbl = document.createElement('div'); lbl.className='sidebar-label'; lbl.textContent='즐겨찾기 ★';
    sidebar.appendChild(lbl);
    favItems.forEach(function(item) {
      sidebar.appendChild(makeBtn(item, true));
    });
  }

  data.forEach(function(group) {
    var lbl = document.createElement('div'); lbl.className='sidebar-label'; lbl.textContent=group.category;
    sidebar.appendChild(lbl);
    group.items.forEach(function(item) {
      sidebar.appendChild(makeBtn(item, false));
    });
  });

  var noRes = document.createElement('div'); noRes.id='no_results'; noRes.className='no-results'; noRes.textContent='검색 결과 없음'; noRes.style.display='none';
  sidebar.appendChild(noRes);

  var q = document.getElementById('search_input').value;
  if(q) filterSnippets();
}

function makeBtn(item, isFavSection) {
  var btn = document.createElement('button');
  btn.className = 'snip-btn' + (currentKey === item.key && !isFavSection ? ' active' : '');
  btn.textContent = item.label;
  btn.dataset.key = item.key;
  btn.onclick = function(e) { selectItem(item, e.currentTarget); };
  return btn;
}

function selectItem(item, btnEl) {
  currentKey = item.key;
  currentItem = item;
  document.querySelectorAll('.snip-btn').forEach(function(b) { b.classList.remove('active'); });
  if(btnEl) btnEl.classList.add('active');
  document.getElementById('q_title').textContent = item.label;
  document.getElementById('q_desc').textContent = item.desc || '';
  updateFavBtn();

  var paramRow = document.getElementById('param_row');
  paramRow.innerHTML = '';
  if (item.params && item.params.length > 0) {
    paramRow.style.display = 'flex';
    item.params.forEach(function(param) {
      var lbl = document.createElement('label'); lbl.textContent = param.label;
      var inp = document.createElement('input'); inp.type = 'text';
      inp.id = 'param_' + param.id;
      inp.placeholder = param.placeholder || '';
      inp.style.width = (param.width || 150) + 'px';
      inp.addEventListener('input', function() { updateQuery(item); });
      paramRow.appendChild(lbl);
      paramRow.appendChild(inp);
    });
  } else {
    paramRow.style.display = 'none';
  }
  updateQuery(item);
}

function updateQuery(item) {
  var p = {};
  if (item.params) {
    item.params.forEach(function(param) {
      var el = document.getElementById('param_' + param.id);
      if (el) p[param.id] = el.value.trim();
    });
  }
  currentQuery = item.query(p);
  renderQuery(currentQuery);
}

function renderQuery(sql) {
  var esc = sql.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  esc = esc.replace(/#\{[^}]+\}|#[A-Za-z_]\w*#/g, function(m){ return '<span class="bind">'+m+'</span>'; });
  esc = esc.replace(/(^|[^\w:'])(:[A-Za-z_]\w*)/g, function(_, a, b){ return a+'<span class="bind">'+b+'</span>'; });
  document.getElementById('q_output').innerHTML = esc;
}

function clearOutput() {
  document.getElementById('q_title').textContent = '좌측에서 항목 선택';
  document.getElementById('q_desc').textContent = '';
  currentQuery = '';
  document.getElementById('q_output').innerHTML = '<span style="color:var(--muted)">항목을 선택하면 쿼리가 표시된다</span>';
  document.getElementById('param_row').innerHTML = '';
  document.getElementById('param_row').style.display = 'none';
  document.getElementById('fav_btn').textContent = '☆';
  document.getElementById('fav_btn').classList.remove('active');
}

function copyQuery() {
  if (!currentQuery) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(currentQuery).then(function(){ showToast(); }).catch(function(){ copyFallback(currentQuery); });
  } else {
    copyFallback(currentQuery);
  }
}
function copyFallback(text) {
  var ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  showToast(ok ? '복사됨' : '복사 실패 — 쿼리를 직접 선택해 복사할 것');
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg || '복사됨'; t.style.opacity = '1';
  clearTimeout(t._t); t._t = setTimeout(function() { t.style.opacity = '0'; }, 1500);
}

function hashParts() {
  var raw = (location.hash || '').replace('#', '').trim().split(':');
  return { key: raw[0] || '', db: raw[1] || '' };
}
function findItemByKey(db, key) {
  var data = SNIPPETS[db];
  if (!data) return null;
  for (var i = 0; i < data.length; i++) {
    var items = data[i].items;
    for (var j = 0; j < items.length; j++) {
      if (items[j].key === key) return items[j];
    }
  }
  return null;
}
function applyHash() {
  var h = hashParts();
  if (!h.key) return false;
  var db = (h.db && SNIPPETS[h.db]) ? h.db : currentDb;
  var item = findItemByKey(db, h.key);
  if (!item) return false;
  if (db !== currentDb) switchDb(db);   
  var btns = document.querySelectorAll('.snip-btn'), btn = null;
  for (var k = 0; k < btns.length; k++) { if (btns[k].dataset.key === h.key) { btn = btns[k]; break; } }
  selectItem(item, btn);
  return true;
}
window.addEventListener('hashchange', function() { applyHash(); });

document.addEventListener('keydown', function(e) {
  if(e.ctrlKey && e.key==='k'){ e.preventDefault(); document.getElementById('search_input').focus(); return; }
  if(e.ctrlKey && e.key==='1'){ e.preventDefault(); switchDb('oracle'); }
  if(e.ctrlKey && e.key==='2'){ e.preventDefault(); switchDb('mysql'); }
  if(e.ctrlKey && e.key==='3'){ e.preventDefault(); switchDb('pg'); }
  if(e.ctrlKey && e.key==='4'){ e.preventDefault(); switchDb('mssql'); }
  if(e.ctrlKey && e.key==='5'){ e.preventDefault(); switchDb('sybase'); }
});

var lastDb = localStorage.getItem('sql_lastDb') || 'oracle';
if(!SNIPPETS[lastDb]) lastDb = 'oracle';
switchDb(lastDb);
applyHash();   
</script>
</body>
