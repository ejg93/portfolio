<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산출물 SQL 가이드</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#1e1e1e; --surface:#252526; --border:#3c3c3c; --text:#d4d4d4; --muted:#858585; --accent:#0078d4; --green:#16825d; --orange:#f0a500; --red:#d16969; --mysql:#00bcd4; --pg:#5b9bd5; --ms:#c586c0; --sy:#ce9178; }
body { font-family:'Consolas','D2Coding','맑은 고딕',monospace; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; flex-wrap:wrap; }
header h1 { font-size:13px; color:#ccc; letter-spacing:2px; }
.db-tabs { display:flex; gap:6px; flex-wrap:wrap; }
.db-tab { padding:4px 12px; border-radius:4px; cursor:pointer; font-size:11.5px; font-weight:bold; letter-spacing:0.5px; border:2px solid transparent; user-select:none; }
.db-tab.oracle { background:rgba(240,165,0,0.15); color:var(--orange); }
.db-tab.oracle.active { border-color:var(--orange); }
.db-tab.mysql { background:rgba(0,188,212,0.1); color:var(--mysql); }
.db-tab.mysql.active { border-color:var(--mysql); }
.db-tab.pg { background:rgba(91,155,213,0.12); color:var(--pg); }
.db-tab.pg.active { border-color:var(--pg); }
.db-tab.mssql { background:rgba(197,134,192,0.12); color:var(--ms); }
.db-tab.mssql.active { border-color:var(--ms); }
.db-tab.sybase { background:rgba(206,145,120,0.12); color:var(--sy); }
.db-tab.sybase.active { border-color:var(--sy); }
.schema-wrap { display:flex; align-items:center; gap:6px; margin-left:auto; }
.schema-wrap label { font-size:11px; color:var(--muted); }
.schema-wrap input { background:#3c3c3c; border:1px solid #555; border-radius:3px; color:var(--text); font-family:'Consolas',monospace; font-size:12px; padding:5px 10px; outline:none; width:240px; }
.schema-wrap input:focus { border-color:var(--accent); }
.schema-wrap input.narrow { width:120px; }
.excl-wrap { width:100%; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--muted); padding-top:2px; }
.excl-wrap label { display:flex; align-items:center; gap:4px; cursor:pointer; user-select:none; }
.excl-wrap input[type=checkbox] { width:12px; height:12px; accent-color:var(--orange); cursor:pointer; }
.excl-master { color:#c8c8c8; font-weight:bold; }
.excl-detail { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.excl-detail input[type=text] { background:#3c3c3c; border:1px solid #555; border-radius:3px; color:var(--text); font-family:'Consolas',monospace; font-size:11px; padding:3px 8px; outline:none; width:210px; }
.excl-detail input[type=text]:focus { border-color:var(--orange); }
.btn-excl-check { font-family:'Consolas',monospace; font-size:10.5px; border:1px solid var(--orange); border-radius:4px; cursor:pointer; padding:3px 10px; background:transparent; color:var(--orange); }
.btn-excl-check:hover { background:rgba(240,165,0,0.15); }
.main { flex:1; display:flex; overflow:hidden; }
.sidebar { width:230px; background:var(--surface); border-right:1px solid var(--border); padding:8px 6px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; flex-shrink:0; }
.doc-btn { padding:8px 10px; border-radius:4px; cursor:pointer; font-size:12px; color:#ccc; border:none; border-left:3px solid transparent; background:transparent; text-align:left; width:100%; font-family:'Consolas',monospace; line-height:1.4; display:flex; align-items:flex-start; }
.doc-btn:hover { background:#2a2d2e; }
.doc-btn.active { background:#094771; color:#fff; }
.doc-btn .no { color:var(--orange); margin-right:6px; }
.doc-chk { margin-right:7px; margin-top:2px; width:13px; height:13px; accent-color:var(--green); cursor:pointer; flex-shrink:0; }
.doc-txt { flex:1; min-width:0; word-break:keep-all; line-height:1.4; }
.doc-btn.used { color:#fff; border-left-color:var(--green); background:rgba(22,130,93,0.12); }
.doc-btn.used .no { color:var(--green); }
.doc-btn.unused { opacity:0.62; }
.doc-btn.unused:hover { opacity:0.85; }
.doc-btn.active { background:#094771; color:#fff; border-left-color:var(--accent); opacity:1; }
.sidebar-group { font-size:9.5px; color:var(--muted); letter-spacing:1.5px; margin:11px 6px 3px; padding-bottom:3px; border-bottom:1px solid var(--border); }
.sidebar-group:first-child { margin-top:2px; }
.content { flex:1; overflow-y:auto; padding:18px 22px; }
h2 { font-size:15px; color:#fff; margin-bottom:4px; }
.doc-sub { font-size:11px; color:var(--muted); margin-bottom:14px; line-height:1.6; }
.sec { margin-bottom:18px; }
.sec-title { font-size:12px; color:var(--orange); letter-spacing:1px; margin-bottom:6px; }
.form-cols { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:10px 14px; font-size:11px; line-height:1.9; color:#c8c8c8; }
.form-cols .req { color:var(--red); font-weight:bold; }
.form-note { font-size:10px; color:var(--muted); margin-top:4px; }
ul.plain { list-style:none; }
ul.plain li { font-size:11.5px; line-height:1.8; color:#c8c8c8; padding-left:14px; position:relative; }
ul.plain li::before { content:'·'; position:absolute; left:2px; color:var(--orange); }
.sql-block { margin-bottom:14px; }
.sql-head { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.sql-title { font-size:12px; color:#9cdcfe; font-weight:bold; }
.sql-head button { font-family:'Consolas',monospace; font-size:11px; border:none; border-radius:4px; cursor:pointer; padding:4px 12px; }
.btn-copy { background:var(--green); color:#fff; }
.btn-edit { background:#3c3c3c; color:var(--text); }
.btn-edit.on { background:var(--orange); color:#000; }
pre.q { background:#111; border:1px solid var(--border); border-radius:4px; color:#9cdcfe; font-size:12.5px; padding:12px 14px; line-height:1.7; overflow-x:auto; white-space:pre; }
pre.q.missing { color:var(--muted); font-style:italic; }
textarea.q { width:100%; background:#111; border:1px solid var(--orange); border-radius:4px; color:#9cdcfe; font-family:'Consolas','D2Coding',monospace; font-size:12.5px; padding:12px 14px; line-height:1.7; resize:vertical; outline:none; min-height:180px; }
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:8px 20px; border-radius:20px; font-size:12px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:999; }
.sidebar, .content, pre.q, textarea.q { scrollbar-width:thin; scrollbar-color:#454545 transparent; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#3a3a3a; border-radius:6px; border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:#565656; border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-corner { background:transparent; }
</style>
</head>
<body>
<header>
  <h1>산출물 SQL 가이드</h1>
  <div class="db-tabs" id="db_tabs"></div>
  <div class="schema-wrap">
    <label for="schemas">업무 스키마(쉼표 구분)</label>
    <input type="text" id="schemas" placeholder="SCHEMA_A,SCHEMA_B" oninput="onSchemaChange()">
    <label for="author" title="02·03의 최종수정자 열에 그대로 들어감 — DDL 실행자가 아니라 문서 작성자">작성자</label>
    <input type="text" id="author" class="narrow" placeholder="홍길동" oninput="onAuthorChange()">
  </div>
  <div class="excl-wrap">
    <label class="excl-master" title="테이블 목록 문서(02·03)에 공통 적용 — 한쪽만 걸면 건수 안 맞음">
      <input type="checkbox" id="excl_on" onchange="exclCfg.on=this.checked; saveExcl()"> 임시/백업 테이블 제외 필터 (02·03 공유)</label>
    <span id="excl_detail" class="excl-detail">
      <label title="_BAK로 끝나거나 _BAK_ 포함"><input type="checkbox" id="excl_bak" onchange="exclCfg.bak=this.checked; saveExcl()"> _BAK</label>
      <label title="이름에 _+숫자6자리 이상(_20240102 등) 또는 _연도4자리"><input type="checkbox" id="excl_date" onchange="exclCfg.date=this.checked; saveExcl()"> 날짜 스냅샷</label>
      <label title="이름에 TEST 포함 — LATEST 등 정상 이름도 걸릴 수 있음, 확인쿼리로 검증 필수"><input type="checkbox" id="excl_test" onchange="exclCfg.test=this.checked; saveExcl()"> TEST 포함</label>
      <input type="text" id="excl_pfx" placeholder="개인 접두사: TLYH_,YDI_ (쉼표)" title="개발자 이니셜 등 — 이 접두사로 시작하는 테이블 제외" onchange="exclCfg.pfx=this.value; saveExcl()">
      <button class="btn-excl-check" onclick="copyExclCheck()" title="제외될 테이블 목록 조회 쿼리 복사 — 정상 테이블이 잘못 걸렸는지 실행해서 검증">제외 목록 확인쿼리 복사</button>
    </span>
  </div>
</header>
<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>
<div id="toast"></div>

<script>
var DIALECTS = [
  { key:'oracle', label:'Oracle', cls:'oracle',
    hint:'스키마 = OWNER (보통 대문자)<br>[Oracle] [스키마=오너]──Table (2단, 스키마가 곧 최상위 실무단위)' },
  { key:'mysql',  label:'MySQL/MariaDB', cls:'mysql',
    hint:'스키마 = 데이터베이스명 (TABLE_SCHEMA, 대소문자는 서버 설정 따름)<br>[MySQL] [스키마=DB]──Table (2단, 스키마=DB 동의어)' },
  { key:'pg',     label:'PostgreSQL', cls:'pg',
    hint:'스키마 = 네임스페이스 (보통 소문자, public 등)<br>[PostgreSQL] DB──[스키마]──Table (3단, DB 밑에 스키마, 그 밑에 테이블)' },
  { key:'mssql',  label:'SQL Server', cls:'mssql',
    hint:'스키마 = sys.schemas.name (보통 dbo). DB는 USE로 선택<br>[SQL Server] DB──[스키마]──Table (3단, DB 밑에 스키마, 그 밑에 테이블)' },
  { key:'sybase', label:'Sybase ASE', cls:'sybase',
    hint:'DB 단위로 USE 데이터베이스명 후 실행 — 스키마 입력칸 대부분 미사용. 코멘트 저장 개념 없어 한글명은 수기<br>[Sybase] DB──Table (+소유자 태그) — 컨테이너 없음, uid는 테이블에 붙은 속성일 뿐' }
];

var DOCS = [
{
  key:'d00', no:'00', label:'공통 준비',
  sub:'모든 문서 작업 전 1회. 스키마 확정이 최우선 — 이후 전 쿼리의 IN절이 여기서 결정됨.',
  sql:[
    { title:'업무 테이블의 스키마(DB) 분포 — 제일 먼저 실행',
      q:{
        oracle:"SELECT OWNER, COUNT(*) AS TBL_CNT\nFROM   ALL_TABLES\nGROUP  BY OWNER\nORDER  BY TBL_CNT DESC;",
        mysql:"SELECT TABLE_SCHEMA, COUNT(*) AS TBL_CNT\nFROM   information_schema.TABLES\nWHERE  TABLE_TYPE = 'BASE TABLE'\nGROUP  BY TABLE_SCHEMA\nORDER  BY TBL_CNT DESC;",
        pg:"SELECT schemaname, COUNT(*) AS tbl_cnt\nFROM   pg_tables\nGROUP  BY schemaname\nORDER  BY tbl_cnt DESC;",
        mssql:"SELECT s.name AS schema_name, COUNT(*) AS tbl_cnt\nFROM   sys.tables t JOIN sys.schemas s ON t.schema_id = s.schema_id\nGROUP  BY s.name\nORDER  BY tbl_cnt DESC;\n-- DB 여러 개면 USE DB명 바꿔가며 실행",
        sybase:"SELECT db_name() AS 현재DB, COUNT(*) AS tbl_cnt\nFROM   sysobjects WHERE type = 'U';\n-- DB별로 USE 데이터베이스명 후 각각 실행"
      } }
  ],
  notes:[
    '결과에서 업무 테이블 있는 스키마만 상단 입력칸에 등록 → 전 문서 쿼리 자동 반영',
    '관리자/시스템 계정 스키마는 시스템성 테이블 섞임 — 업무 스키마만 등록',
    '딕셔너리 뷰는 권한 있는 것만 보임. 툴 브라우저엔 보이는데 쿼리에 안 나오면 권한 요청',
    'DBeaver: 기본 200행만 로드 — 설정→데이터 편집기→ResultSet 페치 크기 200000 권장, 아니면 그리드에서 Ctrl+End',
    '결과 붙여넣기: 수백 행 = 그리드 Ctrl+A 복사, 수만 행 = CSV 내보내기(UTF-8 + BOM 체크)',
    '엑셀 서식: 데이터 먼저 값 붙여넣기 → 서식 행 복사 → 이름상자에 3:5000 → Ctrl+Alt+V → 서식(T)',
    '테이블 수 정합성: 01·02·03·04는 같은 시점에 추출'
  ]
},
{
  key:'d01', no:'01', label:'데이터베이스 정의서',
  sub:'DB 단위 1행 문서. 물리DB명·규모·환경 요약.',
  formCols:'기관명 | 부서명 | 적용업무 | DB설명 | 논리DB명 | 물리DB명 | DBMS명 | DBMS버전 | 운영체제명 | 테이블수 | 데이터용량',
  sql:[
    { title:'물리DB명 / 버전',
      q:{
        oracle:"SELECT NAME FROM V$DATABASE;\n-- 안 되면:\nSELECT SYS_CONTEXT('USERENV','DB_NAME') FROM DUAL;",
        mysql:"SELECT DATABASE() AS 현재DB, VERSION() AS 버전;\n-- 전체 DB 목록: SHOW DATABASES;",
        pg:"SELECT current_database() AS 현재DB, version() AS 버전;",
        mssql:"SELECT DB_NAME() AS 현재DB, @@VERSION AS 버전;",
        sybase:"SELECT db_name() AS 현재DB, @@version AS 버전;"
      } },
    { title:'테이블수 (02번 건수와 일치해야 함)',
      q:{
        oracle:"SELECT COUNT(*) AS TABLE_CNT\nFROM   ALL_TABLES\nWHERE  OWNER IN __SCHEMAS__;",
        mysql:"SELECT COUNT(*) AS TABLE_CNT\nFROM   information_schema.TABLES\nWHERE  TABLE_SCHEMA IN __SCHEMAS__ AND TABLE_TYPE = 'BASE TABLE';",
        pg:"-- 02번과 같은 기준(pg_class + 파티션 자식 제외)으로 세야 건수가 일치한다.\n-- information_schema.tables는 파티션 자식도 BASE TABLE로 세므로 쓰지 않는다.\nSELECT COUNT(*) AS table_cnt\nFROM   pg_class c JOIN pg_namespace n ON c.relnamespace = n.oid\nWHERE  c.relkind IN ('r','p') AND NOT c.relispartition\n       AND n.nspname IN __SCHEMAS__;\n-- PG 9.x는 relispartition 컬럼이 없음 → 그 조건 삭제 후 실행 (구버전엔 선언적 파티션도 없음)",
        mssql:"SELECT COUNT(*) AS table_cnt\nFROM   sys.tables t JOIN sys.schemas s ON t.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS__;",
        sybase:"SELECT COUNT(*) AS table_cnt FROM sysobjects WHERE type = 'U';"
      } },
    { title:'데이터 용량',
      q:{
        oracle:"SELECT ROUND(SUM(BYTES)/1024/1024/1024, 1) || 'GB' AS DATA_SIZE\nFROM   DBA_SEGMENTS\nWHERE  OWNER IN __SCHEMAS__;\n-- DBA_ 권한 없으면 접속 계정 한정: USER_SEGMENTS",
        mysql:"SELECT CONCAT(ROUND(SUM(DATA_LENGTH + INDEX_LENGTH)/1024/1024/1024, 1), 'GB') AS DATA_SIZE\nFROM   information_schema.TABLES\nWHERE  TABLE_SCHEMA IN __SCHEMAS__;",
        pg:"SELECT pg_size_pretty(pg_database_size(current_database())) AS data_size;\n-- 스키마 한정:\nSELECT pg_size_pretty(SUM(pg_total_relation_size(quote_ident(schemaname)||'.'||quote_ident(tablename))))\nFROM   pg_tables WHERE schemaname IN __SCHEMAS__;",
        mssql:"EXEC sp_spaceused;  -- 현재 DB 전체\n-- 스키마 한정:\nSELECT CAST(ROUND(SUM(a.total_pages) * 8 / 1024.0 / 1024.0, 1) AS VARCHAR(20)) + 'GB'\nFROM   sys.partitions p\n       JOIN sys.allocation_units a ON (a.type IN (1,3) AND a.container_id = p.hobt_id)\n                                   OR (a.type = 2      AND a.container_id = p.partition_id)\n       JOIN sys.tables t ON p.object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS__;\n-- container_id 매핑: type 1·3 → partitions.hobt_id / type 2(LOB) → partitions.partition_id (공식 문서 sys.allocation_units)\n--   partition_id 로만 조인하면 LOB 이외 할당단위가 어긋난다",
        sybase:"-- (1) 권위값 — 아래 (2)와는 배치가 달라 따로 실행할 것\nsp_spaceused;\n\n-- (2) GB 숫자로 산출 (인덱스 포함)\nDECLARE @pgkb int\nSELECT  @pgkb = @@maxpagesize / 1024   -- @@maxpagesize 미지원 버전이면 실제 페이지 크기(2/4/8/16)를 직접 지정\n\nSELECT CONVERT(numeric(20,2), SUM(st.pagecnt)) * @pgkb / 1024.0 / 1024.0 AS 데이터용량GB\nFROM   systabstats st\n       JOIN sysobjects o ON o.id = st.id\nWHERE  o.type = 'U'__EXCL(o.name)__;\n\n-- (3) 대상 테이블 목록만 한정할 때 — 위 WHERE 에 아래 한 줄 추가\n--     AND o.name IN ('TABLE1','TABLE2','TABLE3')\n--     엑셀에서 IN절 생성: =\"'\" & TEXTJOIN(\"','\", TRUE, A2:A100) & \"'\"\n--     ★ 누락 검증 필수 — 아래 건수가 목록 개수와 같아야 한다 (오타·타DB 테이블이 조용히 빠진다)\n--     SELECT COUNT(DISTINCT o.name) FROM sysobjects o\n--     WHERE o.type = 'U' AND o.name IN ('TABLE1','TABLE2','TABLE3');\n-- sp_spaceused 의 reserved 와 자릿수가 어긋나면 통계가 낡은 것 — update statistics 후 재추출\n-- DB 여러 개면 DB별로 USE 데이터베이스명 후 각각 실행해 합산"
      } },
    { title:'인스턴스/환경 정보',
      q:{
        oracle:"-- DBMS버전 / 호스트 (V$INSTANCE 는 INSTANCE_NAME 있음 — 공식 레퍼런스 확인)\nSELECT INSTANCE_NAME, DB_NAME, HOST_NAME, VERSION, STATUS, STARTUP_TIME\nFROM   V$INSTANCE;\n\n-- 운영체제명 / CPU (SQL로 나온다 — 서버 담당자에게 안 물어봐도 됨)\nSELECT PLATFORM_NAME AS 운영체제명, CPU_NAME, CPU_MODEL\nFROM   V$DATABASE;\n-- 전체 컬럼이 궁금하면: SELECT * FROM V$INSTANCE;  /  SELECT * FROM V$DATABASE;",
        mysql:"SHOW VARIABLES LIKE 'version%';   -- version_compile_os에 OS 계열 표시",
        pg:"SELECT version();   -- 문자열 안에 컴파일 OS 표시 (예: linux-gnu)",
        mssql:"SELECT @@VERSION;   -- 문자열 안에 Windows/Linux 표기",
        sybase:"SELECT @@version;   -- 문자열 안에 플랫폼 표기"
      } }
  ],
  manual:[
    '기관명·부서명 등 조직 항목: 발주처 확인',
    '적용업무 분류체계: 기관 담당자 확인',
    'DBMS명/버전: 실제 엔진 그대로'
  ]
},
{
  key:'d02', no:'02', label:'테이블 정의서',
  sub:'테이블 1행. DB명 칸은 관례상 물리DB명이지만 스키마 분산 구조면 스키마명 기재 후 발주처 확인.',
  formCols:'순번 | 테이블소유자 | 테이블명(영문) | 테이블명(한글) | 테이블용도 | 관련엔터티명 | 테이블설명 | 보존기간 | 갱신주기 | 테이블볼륨(건) | 예상발생량(건) | 분류명 | 태그정보 | 담당부서 | 담당자 | 최초등록일 | 최종수정일 | 최종수정자 | 변경구분',
  sql:[
    { title:'한 방 쿼리 (순번/DB명=스키마/영문·한글명/볼륨/등록·수정일)',
      q:{
        oracle:"SELECT ROWNUM AS 순번, T.* FROM (\n    SELECT A.OWNER                                  AS 테이블소유자,\n           A.TABLE_NAME                             AS 테이블명_영문,\n           C.COMMENTS                               AS 테이블명_한글,\n           A.NUM_ROWS                               AS 테이블볼륨,  -- 통계 기준\n           TO_CHAR(O.CREATED, 'YYYY-MM-DD')         AS 최초등록일,\n           TO_CHAR(NVL(O.LAST_DDL_TIME, O.CREATED), 'YYYY-MM-DD')   AS 최종수정일,\n           __AUTHOR__                               AS 최종수정자,\n           CASE WHEN O.LAST_DDL_TIME > O.CREATED THEN '수정' ELSE '신규' END AS 변경구분\n    FROM   ALL_TABLES A\n           LEFT JOIN ALL_TAB_COMMENTS C ON A.OWNER = C.OWNER\n                                       AND A.TABLE_NAME = C.TABLE_NAME\n           JOIN ALL_OBJECTS O ON O.OWNER = A.OWNER\n                             AND O.OBJECT_NAME = A.TABLE_NAME\n                             AND O.OBJECT_TYPE = 'TABLE'\n    WHERE  A.OWNER IN __SCHEMAS____EXCL(A.TABLE_NAME)__\n    ORDER  BY A.OWNER, A.TABLE_NAME\n) T;\n-- 변경구분: LAST_DDL_TIME 은 GRANT·COMMENT·인덱스 생성·통계수집에도 갱신돼 '수정'이 과다 판정될 수 있다\n--   구조 변경만 엄밀히 보려면 ALL_OBJECTS.TIMESTAMP(\"latest changes on object structure\") 로 판정한다:\n--   CASE WHEN O.TIMESTAMP <> TO_CHAR(O.CREATED,'YYYY-MM-DD:HH24:MI:SS') THEN '수정' ELSE '신규' END\n--   ★ TIMESTAMP 는 VARCHAR(19) — 포맷을 환경에서 확인한 뒤 교체할 것\n-- 최종수정자: DDL 실행자는 어느 딕셔너리에도 없다 — 상단 \"작성자\" 입력칸 값이 전 행에 들어간다",
        mysql:"SELECT ROW_NUMBER() OVER (ORDER BY TABLE_SCHEMA, TABLE_NAME) AS 순번,\n       TABLE_SCHEMA        AS 테이블소유자,\n       TABLE_NAME          AS 테이블명_영문,\n       TABLE_COMMENT       AS 테이블명_한글,\n       TABLE_ROWS          AS 테이블볼륨,   -- 통계 기준(InnoDB 근사치)\n       DATE(CREATE_TIME)   AS 최초등록일,\n       DATE(CREATE_TIME)   AS 최종수정일,   -- DDL 변경 시각이 없어 생성일로 대체 (아래 ★)\n       __AUTHOR__          AS 최종수정자,\n       '신규'              AS 변경구분\nFROM   information_schema.TABLES\nWHERE  TABLE_SCHEMA IN __SCHEMAS__ AND TABLE_TYPE = 'BASE TABLE'__EXCL(TABLE_NAME)__\nORDER  BY TABLE_SCHEMA, TABLE_NAME;\n-- ROW_NUMBER()는 MySQL 8.0/MariaDB 10.2+ — 하위 버전이면 열 빼고 엑셀에서 연번\n-- ★ MySQL은 테이블 DDL 변경 시각을 제공하지 않는다. UPDATE_TIME 은 마지막 UPDATE/INSERT/DELETE 시각이고\n--   서버 재시작·DD 캐시 축출 시 NULL 로 리셋되며 파티션 InnoDB 는 항상 NULL (매뉴얼 28.3.38)\n--   LAST_ALTERED 는 ROUTINES·EVENTS 전용 — TABLES 엔 없다\n-- → 최종수정일 = CREATE_TIME, 변경구분 = '신규' 고정. 개편·이관 사업이면 변경 테이블만 수기로 '수정' 보정",
        pg:"SELECT ROW_NUMBER() OVER (ORDER BY n.nspname, c.relname) AS 순번,\n       n.nspname                          AS 테이블소유자,\n       c.relname                          AS 테이블명_영문,\n       obj_description(c.oid, 'pg_class') AS 테이블명_한글,\n       c.reltuples::bigint                AS 테이블볼륨,  -- 통계 기준\n       NULL::date                         AS 최초등록일,  -- PG 딕셔너리엔 없음 (아래 ★)\n       NULL::date                         AS 최종수정일,\n       __AUTHOR__                         AS 최종수정자,\n       '신규'                             AS 변경구분\nFROM   pg_class c JOIN pg_namespace n ON c.relnamespace = n.oid\nWHERE  c.relkind IN ('r','p') AND NOT c.relispartition AND n.nspname IN __SCHEMAS____EXCL(c.relname)__\nORDER  BY n.nspname, c.relname;\n-- ★ PG 카탈로그엔 생성일·DDL 변경일이 아예 없다 → 최초등록일·최종수정일 NULL, 변경구분 '신규' 고정\n--   상시 추적하려면 ddl_command_end 이벤트 트리거로 별도 이력 테이블을 쌓아야 한다 (사후 복원 불가)\n--   이번 산출물은 마이그레이션 스크립트·형상관리 커밋 이력으로 보완\n-- 파티션 부모만 1건으로 집계(자식 제외) — 01번 테이블수와 같은 기준\n-- PG 9.x는 relispartition 컬럼 없음 → 그 조건 삭제 후 실행\n-- 파티션 부모의 reltuples는 0 → 볼륨은 자식 합계 필요: SELECT SUM(reltuples) ... WHERE relispartition",
        mssql:"SELECT ROW_NUMBER() OVER (ORDER BY s.name, t.name) AS 순번,\n       s.name                              AS 테이블소유자,\n       t.name                              AS 테이블명_영문,\n       CAST(ep.value AS NVARCHAR(200))     AS 테이블명_한글,\n       (SELECT SUM(p.rows) FROM sys.partitions p\n        WHERE  p.object_id = t.object_id AND p.index_id IN (0,1)) AS 테이블볼륨,\n       CONVERT(CHAR(10), t.create_date, 23) AS 최초등록일,\n       CONVERT(CHAR(10), ISNULL(t.modify_date, t.create_date), 23) AS 최종수정일,\n       __AUTHOR__                           AS 최종수정자,\n       CASE WHEN t.modify_date > t.create_date THEN '수정' ELSE '신규' END AS 변경구분\nFROM   sys.tables t\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\n       LEFT JOIN sys.extended_properties ep ON ep.major_id = t.object_id\n            AND ep.minor_id = 0 AND ep.name = 'MS_Description'\nWHERE  s.name IN __SCHEMAS____EXCL(t.name)__\nORDER  BY s.name, t.name;\n-- 변경구분: modify_date 는 \"last modified by using an ALTER statement\" 이지만 공식 문서 원문에\n--   \"테이블·뷰는 인덱스를 만들거나 변경해도 modify_date 가 바뀐다\" 고 명시 — '수정' 과다 판정 가능\n-- 최종수정자: DDL 실행자는 딕셔너리에 없다 — 상단 \"작성자\" 입력칸 값이 전 행에 들어간다",
        sybase:"-- systabstats PK = (id, indid, partitionid) — 파티션별로 1행이다 (PDF systabstats 장)\n-- indid IN (0,1) 로 데이터 행만 남는다(한 테이블이 0과 1을 동시에 갖지 않음: APL힙·모든 DOL=0, APL클러스터드=1)\n-- → 남는 중복은 파티션뿐이므로 SUM 으로 합산해야 파티션 테이블 건수가 맞다. MAX 는 최대 파티션 하나만 집계한다\n-- ★ ASE는 db.owner.table 3단계 — 테이블을 담는 컨테이너는 database 다(owner 는 컨테이너가 아니라 속성).\n--   양식의 \"DB명\" 칸에는 db_name() 값을 적는다. 소유자는 거의 전부 dbo 라 그 칸에 적으면 변별력이 없다.\nSELECT db_name()      AS DB명,\n       u.name         AS 테이블소유자,\n       o.name         AS 테이블명_영문,\n       str_replace(convert(varchar(10), MAX(o.crdate), 102), '.', '-')  AS 최초등록일,\n       SUM(st.rowcnt)                                                   AS 테이블볼륨,\n       str_replace(convert(varchar(10), MAX(o.crdate), 102), '.', '-')  AS 최종수정일,\n       __AUTHOR__                                                  AS 최종수정자,\n       '신규'                                                           AS 변경구분\nFROM   sysobjects o\n       LEFT JOIN sysusers u ON o.uid = u.uid\n       LEFT JOIN systabstats st ON o.id = st.id AND st.indid IN (0,1)\nWHERE  o.type = 'U'__EXCL(o.name)__\nGROUP  BY u.name, o.name\nORDER  BY u.name, o.name;\n-- 건수 검증: SELECT COUNT(*) FROM sysobjects WHERE type = 'U'  ← 위 결과 행 수와 같아야 함\n-- 소유자 계정이 삭제된 테이블도 빠지지 않게 sysusers 는 LEFT JOIN (03번과 테이블 수가 어긋나는 원인)\n-- ★ 최종수정일·변경구분: ASE는 DDL 변경 이력을 남기지 않는다. sysobjects 의 날짜 컬럼은 crdate 하나뿐이고\n--   (expdate 는 \"Reserved\", versionts 는 binary(6) 내부 버전값이라 달력 날짜로 못 바꾼다)\n--   → 최종수정일 = 최초등록일(crdate), 변경구분 = '신규' 고정. MySQL·PG 와 같은 처리다.\n--   sysobjects.schemacnt 는 쓰지 않는다 — PDF 원문의 증가 조건이 \"rule 이나 default 추가\" 하나뿐이라\n--   컬럼 변경을 잡는다는 보장이 없고, 이관·재생성으로 초기화돼 오래된 테이블이 0 으로 찍히기도 한다\n--   변경 테이블은 형상관리 DDL 커밋 이력이나 이전 버전 정의서와 diff 해서 수기로 '수정' 보정할 것\n--   감사가 켜진 환경이면 sp_configure 'auditing' 이 1 이고 sp_displayaudit 에 alter 옵션이 있는지 확인 후:\n--   SELECT eventtime, loginname, objname FROM sybsecurity..sysaudits_01 WHERE objname = '테이블명'\n-- ★ 날짜 포맷: style 23(yyyy-mm-dd)은 MSSQL 스타일이라 ASE에서 미지원 — 에러 없이 조용히 NULL 을 돌려준다.\n--   ASE 전 버전에서 되는 style 102(yyyy.mm.dd) 로 뽑고 str_replace 로 점을 하이픈으로 바꾼다.\n--   확인: SELECT convert(varchar(10), getdate(), 23), convert(varchar(10), getdate(), 102)\n-- 최종수정자: loginame 은 \"user who created the object\" 라 생성자다 — 상단 \"작성자\" 입력칸 값을 쓴다\n-- 한글명: ASE는 코멘트 저장 개념 없음 — 설계서/수기 (같은 폴더 논리명_변환기.html 로 조립 가능)\n-- sysusers는 DB마다 별도 테이블 — DB별로 USE 데이터베이스명 후 실행"
      } },
    { title:'[참고] 테이블별 데이터 용량 — 01번 데이터용량의 근거 (양식 외 열)',
      q:{
        oracle:"-- DBA_SEGMENTS를 SEGMENT_NAME으로 그냥 묶으면 인덱스명이 테이블처럼 한 행씩 잡힌다\n-- INDEX→DBA_INDEXES, LOB/LOB인덱스→DBA_LOBS 로 소속 테이블에 환원 (Tibero 참조안내서 DBA_SEGMENTS 장)\nSELECT 스키마명, 테이블명,\n       ROUND(SUM(CASE WHEN 구분 = 'DATA'  THEN BYTES ELSE 0 END)/1024/1024, 2) AS 데이터MB,\n       ROUND(SUM(CASE WHEN 구분 = 'INDEX' THEN BYTES ELSE 0 END)/1024/1024, 2) AS 인덱스MB,\n       ROUND(SUM(CASE WHEN 구분 = 'LOB'   THEN BYTES ELSE 0 END)/1024/1024, 2) AS LOB_MB,\n       ROUND(SUM(BYTES)/1024/1024, 2)                                          AS 합계MB\nFROM (\n    SELECT S.OWNER AS 스키마명,\n           COALESCE(IX.TABLE_NAME, LB.TABLE_NAME, LI.TABLE_NAME, S.SEGMENT_NAME) AS 테이블명,\n           CASE WHEN S.SEGMENT_TYPE LIKE 'TABLE%' THEN 'DATA'\n                WHEN S.SEGMENT_TYPE LIKE 'LOB%'   THEN 'LOB'\n                ELSE 'INDEX' END                                                 AS 구분,\n           S.BYTES\n    FROM   DBA_SEGMENTS S\n           LEFT JOIN DBA_INDEXES IX ON IX.OWNER = S.OWNER AND IX.INDEX_NAME   = S.SEGMENT_NAME\n                                   AND S.SEGMENT_TYPE LIKE 'INDEX%'\n           LEFT JOIN DBA_LOBS    LB ON LB.OWNER = S.OWNER AND LB.SEGMENT_NAME = S.SEGMENT_NAME\n                                   AND S.SEGMENT_TYPE LIKE 'LOB%'\n           LEFT JOIN DBA_LOBS    LI ON LI.OWNER = S.OWNER AND LI.INDEX_NAME   = S.SEGMENT_NAME\n                                   AND S.SEGMENT_TYPE LIKE 'INDEX%'\n    WHERE  S.OWNER IN __SCHEMAS__\n) X\nWHERE  1 = 1__EXCL(테이블명)__\nGROUP  BY 스키마명, 테이블명\nORDER  BY 6 DESC;\n-- SEGMENT_TYPE: TABLE / TABLE PARTITION / INDEX / INDEX PARTITION / LOB / LOB PARTITION — 파티션도 같은 테이블명으로 합산된다\n-- DBA_ 권한 없으면 DBA_→ALL_ (세그먼트는 USER_SEGMENTS = 접속계정 한정)",
        mysql:"-- 통계는 캐시값(information_schema_stats_expiry 기본 86400초 = 24시간)\n-- 최신값이 필요하면 아래 한 줄 먼저 실행:  SET SESSION information_schema_stats_expiry = 0;\nSELECT TABLE_SCHEMA                                         AS 스키마명,\n       TABLE_NAME                                           AS 테이블명,\n       ROUND(DATA_LENGTH  / 1024 / 1024, 2)                 AS 데이터MB,\n       ROUND(INDEX_LENGTH / 1024 / 1024, 2)                 AS 인덱스MB,\n       ROUND(DATA_FREE    / 1024 / 1024, 2)                 AS 미사용MB,\n       ROUND((DATA_LENGTH + INDEX_LENGTH) / 1024 / 1024, 2) AS 합계MB\nFROM   information_schema.TABLES\nWHERE  TABLE_SCHEMA IN __SCHEMAS__ AND TABLE_TYPE = 'BASE TABLE'__EXCL(TABLE_NAME)__\nORDER  BY 6 DESC;\n-- InnoDB: DATA_LENGTH = 클러스터드 인덱스 크기, INDEX_LENGTH = 논클러스터드 인덱스 합 (매뉴얼 28.3.38) — 전부 근사치\n-- DATA_FREE 는 file-per-table 이 아니면 테이블스페이스 전체 여유공간이 찍힌다",
        pg:"SELECT n.nspname                                          AS 스키마명,\n       c.relname                                          AS 테이블명,\n       ROUND(pg_table_size(c.oid)   / 1024.0 / 1024.0, 2) AS 데이터MB,\n       ROUND(pg_indexes_size(c.oid) / 1024.0 / 1024.0, 2) AS 인덱스MB,\n       pg_size_pretty(pg_total_relation_size(c.oid))      AS 합계\nFROM   pg_class c JOIN pg_namespace n ON c.relnamespace = n.oid\nWHERE  c.relkind IN ('r','p') AND NOT c.relispartition\n       AND n.nspname IN __SCHEMAS____EXCL(c.relname)__\nORDER  BY pg_total_relation_size(c.oid) DESC;\n-- pg_table_size = 인덱스 제외(TOAST·FSM·VM 포함), pg_indexes_size = 인덱스, total = 둘의 합 (공식 매뉴얼)\n-- ★ 파티션 부모(relkind='p')는 자기 크기가 0 — 실제 용량은 자식에 있다 (자식 합계: WHERE c.relispartition)\n-- PG 9.x는 relispartition 컬럼 없음 → 그 조건 삭제 후 실행",
        mssql:"SELECT s.name AS 스키마명,\n       t.name AS 테이블명,\n       CAST(SUM(CASE WHEN p.index_id IN (0,1) THEN u.used_pages ELSE 0 END) * 8 / 1024.0 AS DECIMAL(18,2)) AS 데이터MB,\n       CAST(SUM(CASE WHEN p.index_id >= 2     THEN u.used_pages ELSE 0 END) * 8 / 1024.0 AS DECIMAL(18,2)) AS 인덱스MB,\n       CAST(SUM(u.total_pages) * 8 / 1024.0 AS DECIMAL(18,2))                                              AS 예약MB\nFROM   sys.allocation_units u\n       JOIN sys.partitions p ON (u.type IN (1,3) AND u.container_id = p.hobt_id)\n                             OR (u.type = 2      AND u.container_id = p.partition_id)\n       JOIN sys.tables  t ON p.object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS____EXCL(t.name)__\nGROUP  BY s.name, t.name\nORDER  BY 5 DESC;\n-- container_id 매핑: type 1·3 → partitions.hobt_id / type 2(LOB) → partitions.partition_id (공식 문서 sys.allocation_units)\n-- index_id 0=힙, 1=클러스터드, 2↑=넌클러스터드 (공식 문서 sys.partitions). 페이지 8KB 고정",
        sybase:"DECLARE @pgkb int\nSELECT  @pgkb = @@maxpagesize / 1024   -- @@maxpagesize 미지원 버전이면 실제 페이지 크기(2/4/8/16)를 직접 지정\n\nSELECT o.name AS 테이블명,\n       CONVERT(numeric(20,2),\n         SUM(CASE WHEN st.indid IN (0,1) THEN st.pagecnt ELSE 0 END)) * @pgkb / 1024.0     AS 데이터MB,\n       CONVERT(numeric(20,2),\n         SUM(CASE WHEN st.indid NOT IN (0,1) THEN st.pagecnt ELSE 0 END)) * @pgkb / 1024.0 AS 인덱스MB,\n       CONVERT(numeric(20,2), SUM(st.pagecnt)) * @pgkb / 1024.0                            AS 합계MB\nFROM   sysobjects o\n       LEFT JOIN systabstats st ON o.id = st.id\nWHERE  o.type = 'U'__EXCL(o.name)__\nGROUP  BY o.name\nORDER  BY 4 DESC;\n-- indid 조건을 걸지 않아 인덱스 세그먼트까지 잡힌다 (indid 0·1 = 데이터, 그 외 = 인덱스)\n-- 검증: sp_spaceused 테이블명 — 큰 테이블 몇 개만 대조 (pagecnt 는 통계값)\n-- reserved 와 used 격차가 크면 DELETE 후 공간 미반환 — 실데이터보다 크게 나온다\n-- DB별로 USE 데이터베이스명 후 실행"
      } }
  ],
  manual:[
    '★ 테이블볼륨은 옵티마이저 통계 기준 근사치 — 통계 미수집 테이블은 0 또는 -1이 그대로 찍힘.',
    '  Oracle: ALL_TABLES.LAST_ANALYZED 가 NULL이거나 오래됐으면 값 신뢰 불가',
    '  PG: reltuples = -1(PG14+) 또는 0 이면 미수집 / MySQL: InnoDB TABLE_ROWS는 최대 ±50% 오차',
    '  → 0·NULL·이상값인 행만 골라 SELECT COUNT(*) 전수 조사로 채울 것 (전 테이블 COUNT는 비현실적)',
    '  → 통계 수집 권한 있으면: Oracle DBMS_STATS.GATHER_SCHEMA_STATS / PG ANALYZE / MySQL ANALYZE TABLE 후 재추출',
    'MySQL 8.0은 information_schema 통계가 캐시값 — information_schema_stats_expiry 기본 86400초(24시간). 최신값은 SET SESSION information_schema_stats_expiry = 0 후 재조회',
    'Sybase는 rowcnt·pagecnt 모두 통계값 — update statistics 미실행 DOL 테이블은 낡은 값이 그대로 나온다. sp_spaceused 로 대조할 것',
    '테이블용도: 기본 "일반", 코드성 "코드", 이력성(_HIST 등) "이력", 통계성 "통계"',
    '관련엔터티명: 테이블 한글명 재사용 (04 관계정의서와 일치)',
    '보존기간: 내부 데이터 보존 정책 따름, 기준 없으면 "영구"',
    '갱신주기: 트랜잭션 "실시간" / 배치·통계 "일"·"월" / 코드 "수시"',
    '예상발생량: 등록일시 컬럼 있으면 최근 1년 COUNT, 없으면 추정 표기',
    '분류명: 01번 적용업무(BRM)와 통일',
    '테이블소유자(스키마 계정)는 01번 영문DB명(인스턴스명)과 별개 개념 — Oracle은 스키마=계정이라 값이 같아 보일 뿐, MySQL은 DB명과 동의어, PG·MSSQL은 DB 하나에 스키마 여럿이라 값이 다를 수 있음',
    '최종수정자: DDL 실행자를 딕셔너리에 남기는 DBMS가 5방언 중 하나도 없다 — 상단 "작성자" 입력칸 값이 전 행에 들어간다 (실제 DDL 실행자가 아니라 문서 작성자)',
    '변경구분: Oracle(LAST_DDL_TIME>CREATED)·MSSQL(modify_date>create_date)만 자동 판정 — 둘 다 인덱스 생성·GRANT·COMMENT에도 반응해 "수정"이 과다 판정될 수 있다',
    '변경구분: Sybase·MySQL·PG는 카탈로그에 DDL 변경 이력이 없어 전 행 "신규" 고정 — 개편·이관 사업이면 변경 테이블만 골라 수기로 "수정" 보정',
    'Sybase에서 schemacnt를 변경 판정에 쓰지 않는 이유: 문서화된 증가 조건이 "rule/default 추가" 하나뿐이라 컬럼 변경을 잡는다는 보장이 없고, 이관·재생성으로 초기화돼 오래된 테이블이 0으로 찍힌다',
    '최종수정일: Sybase는 날짜 컬럼이 crdate 하나뿐이라 최초등록일과 같은 값이 나간다(정상). PG는 생성일조차 없어 두 열 다 NULL — 형상관리 DDL 커밋 이력으로 보완',

    '02와 03의 최종수정일·최종수정자·변경구분은 같은 테이블 행에서 값이 일치해야 한다 (같은 시점에 추출할 것)',

{
  key:'d03', no:'03', label:'컬럼 정의서',
  sub:'컬럼 1행. 수만 행 가능 → CSV(UTF-8+BOM) 권장. 맨 뒤 컬럼순서 열은 논리명 변환기 FK 추론용 — 산출물로 낼 때는 지운다.',
  formCols:'순번 | 스키마명 | 테이블명 | 컬럼명(영문) | 컬럼명(한글) | 연관엔터티명 | 연관속성명 | Not Null | 데이터타입 | 데이터길이 | 기본값 | PK정보 | 컬럼설명 | (담당·수정일·변경구분 tail은 02와 동일) | +컬럼순서(양식 외, 변환기용)',
  sql:[
    { title:'한 방 쿼리 (권장 열 구성 맞춤, PK Y/N 포함)',
      q:{
        oracle:"SELECT ROWNUM AS 순번, T.* FROM (\n    SELECT A.OWNER                                   AS 스키마명,\n           A.TABLE_NAME                              AS 테이블명,\n           A.COLUMN_NAME                             AS 컬럼명_영문,\n           CC.COMMENTS                               AS 컬럼명_한글,\n           TC.COMMENTS                               AS 연관엔터티명,\n           CC.COMMENTS                               AS 연관속성명,\n           DECODE(A.NULLABLE, 'N', 'Y', 'N')         AS NOT_NULL,\n           A.DATA_TYPE                               AS 데이터타입,\n           CASE WHEN A.DATA_TYPE LIKE '%CHAR%'      THEN A.CHAR_LENGTH        -- 문자: 바이트 아닌 문자 수\n                WHEN A.DATA_TYPE IN ('NUMBER','FLOAT') THEN A.DATA_PRECISION  -- 미지정 NUMBER는 NULL (22 아님)\n                WHEN A.DATA_TYPE LIKE 'DATE%' OR A.DATA_TYPE LIKE 'TIMESTAMP%' OR A.DATA_TYPE LIKE 'INTERVAL%' THEN NULL\n                ELSE A.DATA_LENGTH END               AS 데이터길이,\n           A.DATA_SCALE                              AS 소수점길이,\n           NVL2(PK.COLUMN_NAME, 'Y', 'N')            AS PK정보,\n           CC.COMMENTS                               AS 컬럼설명,\n           TO_CHAR(NVL(O.LAST_DDL_TIME, O.CREATED), 'YYYY-MM-DD')    AS 최종수정일,\n           __AUTHOR__                                AS 최종수정자,\n           CASE WHEN O.LAST_DDL_TIME > O.CREATED THEN '수정' ELSE '신규' END AS 변경구분,\n           A.COLUMN_ID                               AS 컬럼순서\n    FROM   ALL_TAB_COLUMNS A\n           JOIN ALL_TABLES TB ON TB.OWNER = A.OWNER              -- 뷰 컬럼 제외 (02와 건수 정합)\n                             AND TB.TABLE_NAME = A.TABLE_NAME\n           JOIN ALL_OBJECTS O ON O.OWNER = A.OWNER               -- 수정일·변경구분 (테이블 단위 값을 상속)\n                             AND O.OBJECT_NAME = A.TABLE_NAME\n                             AND O.OBJECT_TYPE = 'TABLE'\n           LEFT JOIN ALL_COL_COMMENTS CC ON A.OWNER = CC.OWNER\n                  AND A.TABLE_NAME = CC.TABLE_NAME AND A.COLUMN_NAME = CC.COLUMN_NAME\n           LEFT JOIN ALL_TAB_COMMENTS TC ON A.OWNER = TC.OWNER\n                  AND A.TABLE_NAME = TC.TABLE_NAME\n           LEFT JOIN (SELECT C.OWNER, K.TABLE_NAME, K.COLUMN_NAME\n                      FROM   ALL_CONSTRAINTS C\n                             JOIN ALL_CONS_COLUMNS K ON C.OWNER = K.OWNER\n                                  AND C.CONSTRAINT_NAME = K.CONSTRAINT_NAME\n                      WHERE  C.CONSTRAINT_TYPE = 'P') PK\n                  ON PK.OWNER = A.OWNER AND PK.TABLE_NAME = A.TABLE_NAME\n                     AND PK.COLUMN_NAME = A.COLUMN_NAME\n    WHERE  A.OWNER IN __SCHEMAS____EXCL(A.TABLE_NAME)__\n    ORDER  BY A.OWNER, A.TABLE_NAME, A.COLUMN_ID\n) T;\n-- 기본값(DEFAULT): ALL_TAB_COLUMNS.DATA_DEFAULT는 LONG형 — 위 ROWNUM 인라인뷰에 넣으면 ORA-00997.\n-- 별도 추출 후 엑셀 병합: SELECT OWNER, TABLE_NAME, COLUMN_NAME, DATA_DEFAULT FROM ALL_TAB_COLUMNS WHERE OWNER IN __SCHEMAS____EXCLI(TABLE_NAME)__;",
        mysql:"SELECT ROW_NUMBER() OVER (ORDER BY c.TABLE_SCHEMA, c.TABLE_NAME, c.ORDINAL_POSITION) AS 순번,\n       c.TABLE_SCHEMA                                      AS 스키마명,\n       c.TABLE_NAME                                        AS 테이블명,\n       c.COLUMN_NAME                                       AS 컬럼명_영문,\n       c.COLUMN_COMMENT                                    AS 컬럼명_한글,\n       IF(c.IS_NULLABLE = 'NO', 'Y', 'N')                  AS NOT_NULL,\n       c.DATA_TYPE                                         AS 데이터타입,\n       COALESCE(c.CHARACTER_MAXIMUM_LENGTH, c.NUMERIC_PRECISION) AS 데이터길이,\n       c.NUMERIC_SCALE                                     AS 소수점길이,\n       c.COLUMN_DEFAULT                                   AS 기본값,\n       IF(c.COLUMN_KEY = 'PRI', 'Y', 'N')                  AS PK정보,\n       c.COLUMN_COMMENT                                    AS 컬럼설명,\n       DATE(t.CREATE_TIME)                                 AS 최종수정일,   -- DDL 변경 시각 없음 → 생성일\n       __AUTHOR__                                          AS 최종수정자,\n       '신규'                                              AS 변경구분,\n       c.ORDINAL_POSITION                                  AS 컬럼순서\nFROM   information_schema.COLUMNS c\n       JOIN information_schema.TABLES t                    -- 뷰 컬럼 제외\n            ON t.TABLE_SCHEMA = c.TABLE_SCHEMA AND t.TABLE_NAME = c.TABLE_NAME\n           AND t.TABLE_TYPE = 'BASE TABLE'\nWHERE  c.TABLE_SCHEMA IN __SCHEMAS____EXCL(c.TABLE_NAME)__\nORDER  BY c.TABLE_SCHEMA, c.TABLE_NAME, c.ORDINAL_POSITION;\n-- 최종수정일·변경구분은 02와 같은 근거 — MySQL은 테이블 DDL 변경 시각을 제공하지 않는다(매뉴얼 28.3.38).\n--   UPDATE_TIME 은 데이터 변경 시각이고 재시작 시 NULL, LAST_ALTERED 는 ROUTINES·EVENTS 전용.\n--   → 생성일 + '신규' 고정. 개편·이관 사업이면 변경 테이블만 수기로 '수정' 보정 (02와 반드시 동일하게)",
        pg:"SELECT ROW_NUMBER() OVER (ORDER BY n.nspname, c.relname, a.attnum) AS 순번,\n       n.nspname                              AS 스키마명,\n       c.relname                              AS 테이블명,\n       a.attname                              AS 컬럼명_영문,\n       col_description(c.oid, a.attnum)       AS 컬럼명_한글,\n       CASE WHEN a.attnotnull THEN 'Y' ELSE 'N' END AS NOT_NULL,\n       format_type(a.atttypid, a.atttypmod)   AS 데이터타입,   -- 길이 포함 (예: varchar(100))\n       pg_get_expr(ad.adbin, ad.adrelid)      AS 기본값,\n       CASE WHEN pk.attnum IS NOT NULL THEN 'Y' ELSE 'N' END AS PK정보,\n       col_description(c.oid, a.attnum)       AS 컬럼설명,\n       NULL::date                             AS 최종수정일,   -- PG 딕셔너리엔 DDL 시각 없음\n       __AUTHOR__                             AS 최종수정자,\n       '신규'                                 AS 변경구분,\n       a.attnum                               AS 컬럼순서\nFROM   pg_attribute a\n       JOIN pg_class c     ON a.attrelid = c.oid AND c.relkind IN ('r','p') AND NOT c.relispartition   -- 테이블만(뷰 제외) + 파티션 자식 중복 제거\n       JOIN pg_namespace n ON c.relnamespace = n.oid\n       LEFT JOIN (SELECT i.indrelid, unnest(i.indkey) AS attnum\n                  FROM   pg_index i WHERE i.indisprimary) pk\n              ON pk.indrelid = c.oid AND pk.attnum = a.attnum\n       LEFT JOIN pg_attrdef ad ON ad.adrelid = c.oid AND ad.adnum = a.attnum\nWHERE  a.attnum > 0 AND NOT a.attisdropped\n       AND n.nspname IN __SCHEMAS____EXCL(c.relname)__\nORDER  BY n.nspname, c.relname, a.attnum;\n-- pg_catalog 직접 조회 — 삭제된 컬럼 이력 있어도 코멘트가 정확한 컬럼에 붙음\n-- ★ 최종수정일·변경구분: PG 카탈로그엔 생성일·DDL 변경일이 아예 없다 → NULL + '신규' 고정 (02와 동일)\n--   상시 추적하려면 ddl_command_end 이벤트 트리거로 이력 테이블을 쌓아야 한다 (사후 복원 불가)",
        mssql:"SELECT ROW_NUMBER() OVER (ORDER BY s.name, t.name, c.column_id) AS 순번,\n       s.name                              AS 스키마명,\n       t.name                              AS 테이블명,\n       c.name                              AS 컬럼명_영문,\n       CAST(ep.value AS NVARCHAR(200))     AS 컬럼명_한글,\n       CASE WHEN c.is_nullable = 0 THEN 'Y' ELSE 'N' END AS NOT_NULL,\n       ty.name                             AS 데이터타입,\n       CASE WHEN c.max_length = -1 THEN NULL                            -- varchar(max)\n            WHEN ty.name LIKE 'n%' AND (ty.name LIKE '%char%' OR ty.name LIKE '%text%')\n                 THEN c.max_length / 2                                  -- N타입은 바이트/2 = 문자 수\n            WHEN ty.name LIKE '%char%' OR ty.name LIKE '%binary%' THEN c.max_length\n            WHEN ty.name IN ('decimal','numeric') THEN c.precision\n            ELSE NULL END                  AS 데이터길이,               -- 날짜/정수는 길이 개념 없음\n       CASE WHEN ty.name IN ('decimal','numeric') THEN c.scale ELSE NULL END AS 소수점길이,\n       dc.definition                       AS 기본값,\n       CASE WHEN pk.column_id IS NOT NULL THEN 'Y' ELSE 'N' END AS PK정보,\n       CONVERT(CHAR(10), ISNULL(t.modify_date, t.create_date), 23) AS 최종수정일,\n       __AUTHOR__                           AS 최종수정자,\n       CASE WHEN t.modify_date > t.create_date THEN '수정' ELSE '신규' END AS 변경구분,\n       c.column_id                         AS 컬럼순서\nFROM   sys.columns c\n       JOIN sys.tables t  ON c.object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\n       JOIN sys.types ty  ON c.user_type_id = ty.user_type_id\n       LEFT JOIN sys.extended_properties ep ON ep.major_id = c.object_id\n            AND ep.minor_id = c.column_id AND ep.name = 'MS_Description'\n       LEFT JOIN (SELECT ic.object_id, ic.column_id\n                  FROM   sys.index_columns ic\n                         JOIN sys.indexes i ON ic.object_id = i.object_id\n                              AND ic.index_id = i.index_id\n                  WHERE  i.is_primary_key = 1) pk\n              ON pk.object_id = c.object_id AND pk.column_id = c.column_id\n       LEFT JOIN sys.default_constraints dc ON dc.object_id = c.default_object_id\nWHERE  s.name IN __SCHEMAS____EXCL(t.name)__\nORDER  BY s.name, t.name, c.column_id;\n-- 최종수정일·변경구분은 테이블 단위 값(sys.tables)을 컬럼 행에 상속 — 02와 값이 같아야 한다\n--   modify_date 는 인덱스 생성·변경에도 갱신됨(공식 문서 원문) → '수정' 과다 판정 가능",
        sybase:"-- ★ ASE는 db.owner.table 3단계 — 테이블을 담는 컨테이너는 database 다(owner 는 컨테이너가 아니라 속성).\n--   Oracle 관행대로 양식의 \"DB명\"/\"스키마명\" 칸에 소유자를 적으면 전 행이 dbo 로 채워져 변별력이 없다.\n--   → 그 칸에는 db_name() 값을 적고, 소유자는 참고 열로 따로 둔다.\nSELECT db_name() AS DB명,\n       u.name    AS 테이블소유자,\n       o.name    AS 테이블명,\n       c.name    AS 컬럼명_영문,\n       t.name    AS 데이터타입,\n       CASE WHEN t.name IN ('numeric','decimal') THEN c.prec\n            ELSE c.length END                             AS 데이터길이,\n       CASE WHEN t.name IN ('numeric','decimal') THEN c.scale ELSE NULL END AS 소수점길이,\n       CASE WHEN (c.status & 8) = 8 THEN 'N' ELSE 'Y' END AS NOT_NULL,\n       CASE WHEN c.name IN (index_col(o.name, pk.indid, 1, o.uid),\n                            index_col(o.name, pk.indid, 2, o.uid),\n                            index_col(o.name, pk.indid, 3, o.uid),\n                            index_col(o.name, pk.indid, 4, o.uid),\n                            index_col(o.name, pk.indid, 5, o.uid),\n                            index_col(o.name, pk.indid, 6, o.uid),\n                            index_col(o.name, pk.indid, 7, o.uid),\n                            index_col(o.name, pk.indid, 8, o.uid))\n            THEN 'Y' ELSE 'N' END                          AS PK정보,\n       str_replace(convert(varchar(10), o.crdate, 102), '.', '-') AS 최종수정일,\n       __AUTHOR__                                          AS 최종수정자,\n       '신규'                                              AS 변경구분,\n       c.colid   AS 컬럼순서\nFROM   sysobjects o\n       LEFT JOIN sysusers  u  ON o.uid = u.uid\n       JOIN      syscolumns c ON o.id = c.id\n       JOIN      systypes  t  ON c.usertype = t.usertype\n       LEFT JOIN sysindexes pk ON pk.id = o.id AND pk.status & 2048 = 2048\nWHERE  o.type = 'U'__EXCL(o.name)__\nORDER  BY u.name, o.name, c.colid;\n-- PK정보: ASE엔 인덱스↔컬럼 매핑 카탈로그가 없다(MSSQL sys.index_columns / Oracle ALL_IND_COLUMNS 에 해당하는 것이 없음).\n--   키 컬럼은 sysindexes.keys1/keys2 에 varbinary 로 뭉쳐 있고 읽는 수단이 index_col() 뿐이라 1~8번째를 함수로 뽑아 비교한다.\n--   sysconstraints 는 referential(0x40)·check(0x80)·computed(0x100) 뿐이라 PK가 아예 없고,\n--   syskeys(type=1)는 colid 가 바로 있지만 sp_primarykey 로 수동 등록하는 정보성 테이블이라 비어 있을 수 있어 쓰지 않는다.\n-- PK 인덱스는 테이블당 최대 1개라 상관 서브쿼리(EXISTS) 없이 sysindexes 를 LEFT JOIN 한다\n--   (PK 없으면 pk.indid 가 NULL → index_col 이 NULL → IN 이 참이 안 돼 'N'. 키 개수를 넘는 자리도 같은 이유로 오탐 없음)\n-- ★ PK정보가 전부 N 이면 선언적 PK 없이 유니크 인덱스로만 운영하는 것 — sp_helpindex 테이블명 으로 실질 키를 확인할 것\n-- ★ 복합키가 9개 컬럼 이상인 테이블이 있으면 index_col 인자를 9,10... 으로 늘릴 것\n-- 한글명 없음(코멘트 미지원) — 수기. 제약 상세는 sp_helpconstraint 테이블명\n-- 기본값(DEFAULT): syscolumns.cdefault→syscomments 조인 필요(ASE 버전차 큼) — 설계서 확인\n-- 데이터길이: syscolumns.length 는 물리 저장 바이트(PDF syscolumns 장 \"Physical length of data\")\n--   numeric/decimal 은 prec 가 정밀도 — length 를 쓰면 numeric(10,2)가 10 이 아니라 저장 바이트로 찍힌다\n--   unichar/univarchar 는 length 가 문자수의 2배, text/image 는 16(포인터) — 문자수 기준 양식이면 별도 환산\n-- 소유자 계정이 삭제된 테이블도 빠지지 않게 sysusers 는 LEFT JOIN (02번과 테이블 수가 어긋나는 원인)\n-- ★ 최종수정일·변경구분: 테이블 단위 값(sysobjects)을 컬럼 행에 상속 — 02번과 값이 같아야 한다\n--   ASE는 DDL 변경 이력을 남기지 않는다(날짜 컬럼이 crdate 하나뿐) → 최종수정일 = crdate, 변경구분 = '신규' 고정\n--   schemacnt 는 쓰지 않는다 — 증가 조건이 \"rule 이나 default 추가\" 뿐이라 컬럼 변경을 잡는다는 보장이 없고\n--   이관·재생성으로 초기화된다. 변경 테이블은 형상관리 이력·이전 정의서 diff 로 수기 '수정' 보정\n-- 최종수정자: loginame 은 생성자라 못 쓴다 — 상단 \"작성자\" 입력칸 값이 전 행에 들어간다\n-- sysusers는 DB마다 별도 테이블 — DB별로 USE 데이터베이스명 후 실행"
      } }
  ],
  manual:[
    '소수점(데이터소수점길이)은 Oracle·MySQL·MSSQL·Sybase는 위 쿼리에 이미 열로 들어있음. PG는 format_type() 결과 문자열 안에 이미 포함(예: numeric(10,2)) — 따로 안 뽑아도 됨',
    '기본값(DEFAULT): MySQL COLUMN_DEFAULT / PG pg_attrdef(pg_get_expr) / MSSQL default_constraints.definition. Oracle는 DATA_DEFAULT가 LONG형이라 ROWNUM 인라인뷰서 ORA-00997 → 별도 추출 병합(쿼리 하단 주석). Sybase는 syscomments(버전차) → 설계서',
    'NOT_NULL 정의: NULL 불가 → Y (열이 "NotNull 여부"면 — 반대로 적지 말 것)',
    '연관엔터티/속성명 = 한글명 재사용이 관례 (논리모델 별도 있으면 그걸로)'
  ]
},
{
  key:'d04', no:'04', label:'테이블 관계 정의서',
  sub:'FK 관계를 부모/자식 테이블·컬럼 단위로 기재. 모델링 도구 있으면 ERD 이미지 제출로 갈음되는 경우도 많음 — 발주처 확인.',
  formCols:'순번 | 부모: 영문DB명·테이블소유자·한글테이블명·영문테이블명·한글컬럼명·영문컬럼명 | 자식: (동일 6열) | 삭제규칙 | 갱신규칙',
  sql:[
    { title:'FK 기준 한 방 쿼리 (부모/자식 각 6열)',
      q:{
        oracle:"SELECT ROWNUM AS 순번, T.* FROM (\n    SELECT RC.OWNER          AS 부모_영문DB명,\n           RC.OWNER          AS 부모_테이블소유자,\n           PTC.COMMENTS      AS 부모_한글테이블명,\n           RC.TABLE_NAME     AS 부모_영문테이블명,\n           PCC.COMMENTS      AS 부모_한글컬럼명,\n           RCC.COLUMN_NAME   AS 부모_영문컬럼명,\n           C.OWNER           AS 자식_영문DB명,\n           C.OWNER           AS 자식_테이블소유자,\n           CTC.COMMENTS      AS 자식_한글테이블명,\n           C.TABLE_NAME      AS 자식_영문테이블명,\n           CCC.COMMENTS      AS 자식_한글컬럼명,\n           CC.COLUMN_NAME    AS 자식_영문컬럼명,\n           C.DELETE_RULE     AS 삭제규칙,\n           'NO ACTION'       AS 갱신규칙   -- Oracle는 ON UPDATE 미지원(갱신 고정)\n    FROM   ALL_CONSTRAINTS C\n           JOIN ALL_CONS_COLUMNS CC   ON C.OWNER = CC.OWNER\n                AND C.CONSTRAINT_NAME = CC.CONSTRAINT_NAME\n           JOIN ALL_CONSTRAINTS RC    ON C.R_OWNER = RC.OWNER\n                AND C.R_CONSTRAINT_NAME = RC.CONSTRAINT_NAME\n           JOIN ALL_CONS_COLUMNS RCC  ON RC.OWNER = RCC.OWNER\n                AND RC.CONSTRAINT_NAME = RCC.CONSTRAINT_NAME AND CC.POSITION = RCC.POSITION\n           LEFT JOIN ALL_TAB_COMMENTS PTC ON RC.OWNER = PTC.OWNER AND RC.TABLE_NAME = PTC.TABLE_NAME\n           LEFT JOIN ALL_COL_COMMENTS PCC ON RC.OWNER = PCC.OWNER\n                AND RC.TABLE_NAME = PCC.TABLE_NAME AND RCC.COLUMN_NAME = PCC.COLUMN_NAME\n           LEFT JOIN ALL_TAB_COMMENTS CTC ON C.OWNER = CTC.OWNER AND C.TABLE_NAME = CTC.TABLE_NAME\n           LEFT JOIN ALL_COL_COMMENTS CCC ON C.OWNER = CCC.OWNER\n                AND C.TABLE_NAME = CCC.TABLE_NAME AND CC.COLUMN_NAME = CCC.COLUMN_NAME\n    WHERE  C.CONSTRAINT_TYPE = 'R'\n           AND C.OWNER IN __SCHEMAS__\n    ORDER  BY C.OWNER, C.TABLE_NAME, C.CONSTRAINT_NAME, CC.POSITION\n) T;",
        mysql:"SELECT ROW_NUMBER() OVER (ORDER BY k.CONSTRAINT_NAME, k.ORDINAL_POSITION) AS 순번,\n       k.REFERENCED_TABLE_SCHEMA  AS 부모_영문DB명,\n       k.REFERENCED_TABLE_SCHEMA  AS 부모_테이블소유자,\n       pt.TABLE_COMMENT           AS 부모_한글테이블명,\n       k.REFERENCED_TABLE_NAME    AS 부모_영문테이블명,\n       pc.COLUMN_COMMENT          AS 부모_한글컬럼명,\n       k.REFERENCED_COLUMN_NAME   AS 부모_영문컬럼명,\n       k.TABLE_SCHEMA             AS 자식_영문DB명,\n       k.TABLE_SCHEMA             AS 자식_테이블소유자,\n       ct.TABLE_COMMENT           AS 자식_한글테이블명,\n       k.TABLE_NAME               AS 자식_영문테이블명,\n       cc.COLUMN_COMMENT          AS 자식_한글컬럼명,\n       k.COLUMN_NAME              AS 자식_영문컬럼명,\n       rc.DELETE_RULE            AS 삭제규칙,\n       rc.UPDATE_RULE            AS 갱신규칙\nFROM   information_schema.KEY_COLUMN_USAGE k\n       LEFT JOIN information_schema.TABLES pt ON pt.TABLE_SCHEMA = k.REFERENCED_TABLE_SCHEMA\n            AND pt.TABLE_NAME = k.REFERENCED_TABLE_NAME\n       LEFT JOIN information_schema.COLUMNS pc ON pc.TABLE_SCHEMA = k.REFERENCED_TABLE_SCHEMA\n            AND pc.TABLE_NAME = k.REFERENCED_TABLE_NAME AND pc.COLUMN_NAME = k.REFERENCED_COLUMN_NAME\n       LEFT JOIN information_schema.TABLES ct ON ct.TABLE_SCHEMA = k.TABLE_SCHEMA\n            AND ct.TABLE_NAME = k.TABLE_NAME\n       LEFT JOIN information_schema.COLUMNS cc ON cc.TABLE_SCHEMA = k.TABLE_SCHEMA\n            AND cc.TABLE_NAME = k.TABLE_NAME AND cc.COLUMN_NAME = k.COLUMN_NAME\n       LEFT JOIN information_schema.REFERENTIAL_CONSTRAINTS rc\n            ON rc.CONSTRAINT_SCHEMA = k.TABLE_SCHEMA AND rc.CONSTRAINT_NAME = k.CONSTRAINT_NAME\nWHERE  k.REFERENCED_TABLE_NAME IS NOT NULL\n       AND k.TABLE_SCHEMA IN __SCHEMAS__\nORDER  BY k.CONSTRAINT_NAME, k.ORDINAL_POSITION;",
        pg:"SELECT ROW_NUMBER() OVER (ORDER BY con.conname, k.ord) AS 순번,\n       pn.nspname                          AS 부모_영문DB명,\n       pn.nspname                          AS 부모_테이블소유자,\n       obj_description(pc.oid, 'pg_class') AS 부모_한글테이블명,\n       pc.relname                          AS 부모_영문테이블명,\n       col_description(pc.oid, k.confkey)  AS 부모_한글컬럼명,\n       pa.attname                          AS 부모_영문컬럼명,\n       cn.nspname                          AS 자식_영문DB명,\n       cn.nspname                          AS 자식_테이블소유자,\n       obj_description(cc.oid, 'pg_class') AS 자식_한글테이블명,\n       cc.relname                          AS 자식_영문테이블명,\n       col_description(cc.oid, k.conkey)   AS 자식_한글컬럼명,\n       ca.attname                          AS 자식_영문컬럼명,\n       CASE con.confdeltype WHEN 'a' THEN 'NO ACTION' WHEN 'r' THEN 'RESTRICT' WHEN 'c' THEN 'CASCADE' WHEN 'n' THEN 'SET NULL' WHEN 'd' THEN 'SET DEFAULT' END AS 삭제규칙,\n       CASE con.confupdtype WHEN 'a' THEN 'NO ACTION' WHEN 'r' THEN 'RESTRICT' WHEN 'c' THEN 'CASCADE' WHEN 'n' THEN 'SET NULL' WHEN 'd' THEN 'SET DEFAULT' END AS 갱신규칙\nFROM   pg_constraint con\n       CROSS JOIN LATERAL unnest(con.conkey, con.confkey)\n                  WITH ORDINALITY AS k(conkey, confkey, ord)\n       JOIN pg_class cc     ON con.conrelid = cc.oid\n       JOIN pg_namespace cn ON cc.relnamespace = cn.oid\n       JOIN pg_class pc     ON con.confrelid = pc.oid\n       JOIN pg_namespace pn ON pc.relnamespace = pn.oid\n       JOIN pg_attribute ca ON ca.attrelid = cc.oid AND ca.attnum = k.conkey\n       JOIN pg_attribute pa ON pa.attrelid = pc.oid AND pa.attnum = k.confkey\nWHERE  con.contype = 'f' AND cn.nspname IN __SCHEMAS__\nORDER  BY con.conname, k.ord;\n-- 복합 FK도 컬럼 짝 정확 (unnest WITH ORDINALITY, PG 9.4+) + 한글명 포함",
        mssql:"SELECT ROW_NUMBER() OVER (ORDER BY fk.name, fkc.constraint_column_id) AS 순번,\n       SCHEMA_NAME(pt.schema_id)         AS 부모_영문DB명,\n       SCHEMA_NAME(pt.schema_id)         AS 부모_테이블소유자,\n       CAST(ptd.value AS NVARCHAR(200))  AS 부모_한글테이블명,\n       pt.name                           AS 부모_영문테이블명,\n       CAST(pcd.value AS NVARCHAR(200))  AS 부모_한글컬럼명,\n       pc.name                           AS 부모_영문컬럼명,\n       SCHEMA_NAME(ct.schema_id)         AS 자식_영문DB명,\n       SCHEMA_NAME(ct.schema_id)         AS 자식_테이블소유자,\n       CAST(ctd.value AS NVARCHAR(200))  AS 자식_한글테이블명,\n       ct.name                           AS 자식_영문테이블명,\n       CAST(ccd.value AS NVARCHAR(200))  AS 자식_한글컬럼명,\n       cc.name                           AS 자식_영문컬럼명,\n       fk.delete_referential_action_desc AS 삭제규칙,\n       fk.update_referential_action_desc AS 갱신규칙\nFROM   sys.foreign_key_columns fkc\n       JOIN sys.foreign_keys fk ON fkc.constraint_object_id = fk.object_id\n       JOIN sys.tables pt  ON fkc.referenced_object_id = pt.object_id\n       JOIN sys.columns pc ON pc.object_id = pt.object_id AND pc.column_id = fkc.referenced_column_id\n       JOIN sys.tables ct  ON fkc.parent_object_id = ct.object_id\n       JOIN sys.columns cc ON cc.object_id = ct.object_id AND cc.column_id = fkc.parent_column_id\n       LEFT JOIN sys.extended_properties ptd ON ptd.major_id = pt.object_id AND ptd.minor_id = 0 AND ptd.name = 'MS_Description'\n       LEFT JOIN sys.extended_properties pcd ON pcd.major_id = pt.object_id AND pcd.minor_id = pc.column_id AND pcd.name = 'MS_Description'\n       LEFT JOIN sys.extended_properties ctd ON ctd.major_id = ct.object_id AND ctd.minor_id = 0 AND ctd.name = 'MS_Description'\n       LEFT JOIN sys.extended_properties ccd ON ccd.major_id = ct.object_id AND ccd.minor_id = cc.column_id AND ccd.name = 'MS_Description'\nWHERE  SCHEMA_NAME(ct.schema_id) IN __SCHEMAS__\nORDER  BY fk.name, fkc.constraint_column_id;",
        sybase:"-- 테이블 단위 FK 존재 여부 (컬럼 매핑은 sp_helpconstraint로)\nSELECT object_name(r.reftabid) AS 부모테이블,\n       object_name(r.tableid)  AS 자식테이블\nFROM   sysreferences r;\n\nsp_helpconstraint 테이블명;   -- 테이블별 상세 (컬럼 매핑 + 삭제/갱신규칙 포함)"
      } },
    { title:'FK 0건일 때 — 추정 관계 후보 (PK 컬럼명이 타 테이블에 존재)',
      q:{
        oracle:"SELECT PK.OWNER, PK.TABLE_NAME AS 부모후보, PK.COLUMN_NAME AS 조인컬럼,\n       C.TABLE_NAME AS 자식후보\nFROM   (SELECT C.OWNER, K.TABLE_NAME, K.COLUMN_NAME\n        FROM   ALL_CONSTRAINTS C\n               JOIN ALL_CONS_COLUMNS K ON C.OWNER = K.OWNER\n                    AND C.CONSTRAINT_NAME = K.CONSTRAINT_NAME\n        WHERE  C.CONSTRAINT_TYPE = 'P') PK\n       JOIN ALL_TAB_COLUMNS C ON C.OWNER = PK.OWNER\n            AND C.COLUMN_NAME = PK.COLUMN_NAME AND C.TABLE_NAME <> PK.TABLE_NAME\nWHERE  PK.OWNER IN __SCHEMAS__\nORDER  BY PK.TABLE_NAME, C.TABLE_NAME;",
        mysql:"SELECT p.TABLE_SCHEMA, p.TABLE_NAME AS 부모후보, p.COLUMN_NAME AS 조인컬럼,\n       c.TABLE_NAME AS 자식후보\nFROM   information_schema.COLUMNS p\n       JOIN information_schema.COLUMNS c ON c.TABLE_SCHEMA = p.TABLE_SCHEMA\n            AND c.COLUMN_NAME = p.COLUMN_NAME AND c.TABLE_NAME <> p.TABLE_NAME\nWHERE  p.COLUMN_KEY = 'PRI' AND p.TABLE_SCHEMA IN __SCHEMAS__\nORDER  BY p.TABLE_NAME, c.TABLE_NAME;",
        pg:"SELECT pk.table_schema, pk.table_name AS 부모후보, pk.column_name AS 조인컬럼,\n       c.table_name AS 자식후보\nFROM   (SELECT tc.table_schema, tc.table_name, kcu.column_name\n        FROM   information_schema.table_constraints tc\n               JOIN information_schema.key_column_usage kcu\n                    ON tc.constraint_name = kcu.constraint_name\n                   AND tc.table_schema = kcu.table_schema\n        WHERE  tc.constraint_type = 'PRIMARY KEY') pk\n       JOIN information_schema.columns c ON c.table_schema = pk.table_schema\n            AND c.column_name = pk.column_name AND c.table_name <> pk.table_name\nWHERE  pk.table_schema IN __SCHEMAS__\nORDER  BY pk.table_name, c.table_name;",
        mssql:"SELECT s.name, pt.name AS 부모후보, pc.name AS 조인컬럼, t2.name AS 자식후보\nFROM   sys.index_columns ic\n       JOIN sys.indexes i ON ic.object_id = i.object_id AND ic.index_id = i.index_id\n            AND i.is_primary_key = 1\n       JOIN sys.tables pt ON ic.object_id = pt.object_id\n       JOIN sys.schemas s ON pt.schema_id = s.schema_id\n       JOIN sys.columns pc ON pc.object_id = ic.object_id AND pc.column_id = ic.column_id\n       JOIN sys.columns c2 ON c2.name = pc.name AND c2.object_id <> pc.object_id\n       JOIN sys.tables t2 ON c2.object_id = t2.object_id AND t2.schema_id = pt.schema_id\nWHERE  s.name IN __SCHEMAS__\nORDER  BY pt.name, t2.name;",
        sybase:"-- ASE는 조인 폭발 위험 — 컬럼명 목록 뽑아 엑셀에서 매칭 권장\nSELECT o.name AS 테이블명, c.name AS 컬럼명\nFROM   sysobjects o JOIN syscolumns c ON o.id = c.id\nWHERE  o.type = 'U'\nORDER  BY c.name, o.name;"
      } }
  ],
  manual:[
    'FK 0건이면 (국내 SI DB 흔함) 추정 쿼리 후보에서 실제 관계만 선별 → "논리적 관계(FK 미설정)" 표기',
    '모델링 도구(ERwin 등) 사용 가능하면 리버스 엔지니어링 → ERD 캡처 제출이 수기 작성보다 빠름',
    '추정 후보는 공통코드성 컬럼(등록자ID 등)이 대량 매칭됨 — 기계적으로 다 넣지 말 것',
    'FK 삭제/갱신규칙(CASCADE·RESTRICT·SET NULL·NO ACTION) = 데이터 삭제정책 근거. Oracle는 ON UPDATE 미지원이라 갱신규칙 NO ACTION 고정. Sybase는 sp_helpconstraint로 확인'
  ]
},
{
  key:'d05', no:'07', label:'DB 표준용어',
  sub:'원본 표준사전 없으면 컬럼명·코멘트에서 역추출. 용어 = 컬럼 단위 개념.',
  formCols:'순번 | 기관명 | DB명 | 표준용어명 | 영문명 | 영문약어명 | 용어설명 | 표준도메인명 | 허용값 | 관리부서명 | 표준코드명 | 업무분야 | 행정표준코드명 | 제정일자 | 특이사항',
  sql:[
    { title:'용어 역추출 (코멘트=용어명, 컬럼명=영문약어명)',
      q:{
        oracle:"-- 용어 1개 = 컬럼명 1개 (컬럼명으로만 GROUP BY — 코멘트로 묶으면 같은 컬럼이 여러 행으로 쪼개짐)\nSELECT MIN(A.OWNER)                                       AS DB명,\n       NVL(MIN(B.COMMENTS), '(코멘트 없음)')              AS 표준용어명,\n       A.COLUMN_NAME                                      AS 영문약어명,\n       NVL(MIN(B.COMMENTS), '(코멘트 없음)')              AS 용어설명,\n       MIN(A.DATA_TYPE || CASE WHEN A.DATA_TYPE LIKE '%CHAR%'        THEN '(' || A.CHAR_LENGTH || ')'\n                               WHEN A.DATA_PRECISION IS NOT NULL     THEN '(' || A.DATA_PRECISION || ')'\n                               ELSE '' END)               AS 도메인후보,\n       COUNT(*)                                           AS 사용횟수,        -- 검증용, 제출 시 삭제\n       COUNT(DISTINCT B.COMMENTS)                         AS 코멘트종류수     -- 2 이상 = 표준화 안 된 컬럼\nFROM   ALL_TAB_COLUMNS A\n       JOIN ALL_TABLES TB ON TB.OWNER = A.OWNER AND TB.TABLE_NAME = A.TABLE_NAME   -- 뷰 컬럼 제외\n       LEFT JOIN ALL_COL_COMMENTS B ON A.OWNER = B.OWNER\n              AND A.TABLE_NAME = B.TABLE_NAME AND A.COLUMN_NAME = B.COLUMN_NAME\nWHERE  A.OWNER IN __SCHEMAS__\nGROUP  BY A.COLUMN_NAME\nORDER  BY A.COLUMN_NAME;",
        mysql:"-- MySQL은 코멘트 없으면 NULL이 아니라 빈 문자열 → NULLIF로 걸러야 함\nSELECT MIN(c.TABLE_SCHEMA)                                AS DB명,\n       COALESCE(NULLIF(MIN(c.COLUMN_COMMENT), ''), '(코멘트 없음)') AS 표준용어명,\n       c.COLUMN_NAME                                      AS 영문약어명,\n       COALESCE(NULLIF(MIN(c.COLUMN_COMMENT), ''), '(코멘트 없음)') AS 용어설명,\n       MIN(c.COLUMN_TYPE)                                 AS 도메인후보,\n       COUNT(*)                                           AS 사용횟수,\n       COUNT(DISTINCT NULLIF(c.COLUMN_COMMENT, ''))       AS 코멘트종류수\nFROM   information_schema.COLUMNS c\n       JOIN information_schema.TABLES t                    -- 뷰 컬럼 제외\n            ON t.TABLE_SCHEMA = c.TABLE_SCHEMA AND t.TABLE_NAME = c.TABLE_NAME\n           AND t.TABLE_TYPE = 'BASE TABLE'\nWHERE  c.TABLE_SCHEMA IN __SCHEMAS__\nGROUP  BY c.COLUMN_NAME\nORDER  BY c.COLUMN_NAME;",
        pg:"SELECT MIN(n.nspname)                                     AS DB명,\n       COALESCE(MIN(col_description(c.oid, a.attnum)), '(코멘트 없음)') AS 표준용어명,\n       a.attname                                          AS 영문약어명,\n       COALESCE(MIN(col_description(c.oid, a.attnum)), '(코멘트 없음)') AS 용어설명,\n       MIN(format_type(a.atttypid, a.atttypmod))          AS 도메인후보,\n       COUNT(*)                                           AS 사용횟수,\n       COUNT(DISTINCT col_description(c.oid, a.attnum))   AS 코멘트종류수\nFROM   pg_attribute a\n       JOIN pg_class c     ON a.attrelid = c.oid AND c.relkind IN ('r','p') AND NOT c.relispartition   -- 파티션 부모만 (자식 중복 제거)\n       JOIN pg_namespace n ON c.relnamespace = n.oid\nWHERE  a.attnum > 0 AND NOT a.attisdropped\n       AND n.nspname IN __SCHEMAS__\nGROUP  BY a.attname\nORDER  BY a.attname;",
        mssql:"SELECT MIN(s.name)                                        AS DB명,\n       ISNULL(MIN(CAST(ep.value AS NVARCHAR(4000))), '(코멘트 없음)') AS 표준용어명,\n       c.name                                             AS 영문약어명,\n       ISNULL(MIN(CAST(ep.value AS NVARCHAR(4000))), '(코멘트 없음)') AS 용어설명,\n       MIN(ty.name + CASE WHEN ty.name LIKE '%char%' OR ty.name LIKE '%binary%'\n                          THEN '(' + CASE WHEN c.max_length = -1 THEN 'max'\n                                          WHEN ty.name LIKE 'n%' THEN CAST(c.max_length/2 AS VARCHAR(10))  -- N타입은 바이트/2 = 문자 수\n                                          ELSE CAST(c.max_length AS VARCHAR(10)) END + ')'\n                          WHEN ty.name IN ('decimal','numeric')\n                          THEN '(' + CAST(c.precision AS VARCHAR(10)) + ',' + CAST(c.scale AS VARCHAR(10)) + ')'\n                          ELSE '' END)                    AS 도메인후보,\n       COUNT(*)                                           AS 사용횟수,\n       COUNT(DISTINCT CAST(ep.value AS NVARCHAR(4000)))   AS 코멘트종류수   -- 200자로 자르면 서로 다른 코멘트가 같게 세임\nFROM   sys.columns c\n       JOIN sys.tables t  ON c.object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\n       JOIN sys.types ty  ON c.user_type_id = ty.user_type_id\n       LEFT JOIN sys.extended_properties ep ON ep.major_id = c.object_id\n            AND ep.minor_id = c.column_id AND ep.name = 'MS_Description'\nWHERE  s.name IN __SCHEMAS__\nGROUP  BY c.name\nORDER  BY c.name;",
        sybase:"-- ASE는 코멘트 저장 개념 없음 → 표준용어명/용어설명은 설계서 기준 수기\nSELECT db_name()          AS DB명,\n       '(코멘트 미지원)'  AS 표준용어명,\n       c.name             AS 영문약어명,\n       '(코멘트 미지원)'  AS 용어설명,\n       MIN(t.name)        AS 도메인후보,\n       COUNT(*)           AS 사용횟수\nFROM   sysobjects o\n       JOIN syscolumns c ON o.id = c.id\n       JOIN systypes   t ON c.usertype = t.usertype\nWHERE  o.type = 'U'\nGROUP  BY c.name\nORDER  BY c.name;"
      } }
  ],
  manual:[
    '기관명: 발주 기관명',
    '영문명(풀네임)·표준도메인명 확정·제정일자 수기 — 제정일자는 시스템 구축일(02번 최초등록일 최솟값)로 통일 가능',
    '같은 코멘트에 컬럼명 여럿 = 표준화 안 된 흔적 → 대표 정하고 특이사항 기록',
    '"코멘트종류수" 2 이상 = 같은 컬럼명인데 테이블마다 다른 한글명 → 표준 용어 하나로 확정 필요 (검증용 열, 제출 시 삭제)',
    '표준용어명이 "(코멘트 없음)"인 행 = 코멘트 미등록 컬럼 → 직접 명명 후 표시 (행을 지우지 말 것, 누락 파악용)'
  ]
},
{
  key:'d06', no:'05', label:'DB 표준단어',
  sub:'용어를 구성하는 최소 단위. 컬럼명을 _ 로 분해.',
  formCols:'순번 | 기관명 | DB명 | 표준단어명 | 단어영문명 | 단어영문약어명 | 단어설명 | 형식단어여부 | 도메인분류명 | 이음동의어목록 | 금칙어목록 | 관리부서명 | 제정일자 | 특이사항',
  sql:[
    { title:'단어 분해 (유니크 단어 + 사용횟수)',
      q:{
        oracle:"SELECT 단어 AS 단어영문약어명, COUNT(*) AS 사용횟수\nFROM (\n    SELECT REGEXP_SUBSTR(C.COLUMN_NAME, '[^_]+', 1, L.LV) AS 단어\n    FROM   (SELECT DISTINCT COLUMN_NAME FROM ALL_TAB_COLUMNS\n            WHERE  OWNER IN __SCHEMAS__) C,\n           (SELECT LEVEL LV FROM DUAL CONNECT BY LEVEL <= 10) L\n    WHERE  REGEXP_SUBSTR(C.COLUMN_NAME, '[^_]+', 1, L.LV) IS NOT NULL\n)\nGROUP  BY 단어\nORDER  BY 사용횟수 DESC;",
        mysql:"-- MySQL 8.0 / MariaDB 10.2+ (재귀 CTE)\nWITH RECURSIVE cols AS (\n    SELECT DISTINCT COLUMN_NAME\n    FROM   information_schema.COLUMNS\n    WHERE  TABLE_SCHEMA IN __SCHEMAS__\n), n AS (\n    SELECT 1 AS i UNION ALL SELECT i + 1 FROM n WHERE i < 10\n)\nSELECT SUBSTRING_INDEX(SUBSTRING_INDEX(COLUMN_NAME, '_', i), '_', -1) AS 단어,\n       COUNT(*) AS 사용횟수\nFROM   cols JOIN n\n       ON i <= 1 + LENGTH(COLUMN_NAME) - LENGTH(REPLACE(COLUMN_NAME, '_', ''))\nGROUP  BY 단어\nORDER  BY 사용횟수 DESC;",
        pg:"SELECT word AS 단어, COUNT(*) AS 사용횟수\nFROM   (SELECT DISTINCT column_name FROM information_schema.columns\n        WHERE  table_schema IN __SCHEMAS__) c,\n       LATERAL regexp_split_to_table(c.column_name, '_') AS word\nGROUP  BY word\nORDER  BY 2 DESC;",
        mssql:"-- SQL Server 2016+ (STRING_SPLIT)\nSELECT value AS 단어, COUNT(*) AS 사용횟수\nFROM   (SELECT DISTINCT c.name\n        FROM   sys.columns c\n               JOIN sys.tables t  ON c.object_id = t.object_id\n               JOIN sys.schemas s ON t.schema_id = s.schema_id\n        WHERE  s.name IN __SCHEMAS__) x\n       CROSS APPLY STRING_SPLIT(x.name, '_')\nGROUP  BY value\nORDER  BY 2 DESC;",
        sybase:"-- ASE는 문자열 분해 함수 부재 — 컬럼명 목록만 뽑아 엑셀 '텍스트 나누기'로 분해\nSELECT DISTINCT c.name AS 컬럼명\nFROM   sysobjects o JOIN syscolumns c ON o.id = c.id\nWHERE  o.type = 'U'\nORDER  BY c.name;"
      } }
  ],
  manual:[
    '단어별 한글명(표준단어명)·설명 매칭 수기 — 사용횟수 상위부터 채우면 효율적',
    '형식단어여부 기본 N (여부/코드/일자 같은 분류성 단어만 Y 검토)'
  ]
},
{
  key:'d07', no:'06', label:'DB 표준도메인',
  sub:'타입+길이 조합의 표준. 컬럼 접미사(_YN, _CD, _DT…)가 분류 힌트.',
  formCols:'순번 | 기관명 | DB명 | 표준도메인그룹명 | 도메인분류명 | 도메인명 | 도메인설명 | 데이터타입 | 데이터길이 | 소수점길이 | 저장형식 | 표현형식 | 단위 | 허용값 | 관리부서명 | 제정일자 | 특이사항',
  sql:[
    { title:'도메인 후보 (접미사=분류, 타입+길이 집계)',
      q:{
        oracle:"SELECT MIN(OWNER)                                                AS DB명,\n       SUBSTR(COLUMN_NAME, INSTR(COLUMN_NAME, '_', -1) + 1)      AS 도메인분류후보,\n       DATA_TYPE                                                 AS 데이터타입,\n       CASE WHEN DATA_TYPE LIKE '%CHAR%'        THEN CHAR_LENGTH\n            WHEN DATA_TYPE IN ('NUMBER','FLOAT') THEN DATA_PRECISION\n            WHEN DATA_TYPE LIKE 'DATE%' OR DATA_TYPE LIKE 'TIMESTAMP%' OR DATA_TYPE LIKE 'INTERVAL%' THEN NULL\n            ELSE DATA_LENGTH END                                 AS 데이터길이,\n       DATA_SCALE                                                AS 소수점길이,\n       COUNT(*)                                                  AS 사용횟수\nFROM   ALL_TAB_COLUMNS\nWHERE  OWNER IN __SCHEMAS__\nGROUP  BY SUBSTR(COLUMN_NAME, INSTR(COLUMN_NAME, '_', -1) + 1),\n       DATA_TYPE, CHAR_LENGTH, DATA_PRECISION, DATA_LENGTH, DATA_SCALE\nORDER  BY 2, 6 DESC;",
        mysql:"SELECT MIN(TABLE_SCHEMA)                            AS DB명,\n       SUBSTRING_INDEX(COLUMN_NAME, '_', -1)        AS 도메인분류후보,\n       DATA_TYPE                                    AS 데이터타입,\n       COALESCE(CHARACTER_MAXIMUM_LENGTH, NUMERIC_PRECISION) AS 데이터길이,\n       NUMERIC_SCALE                                AS 소수점길이,\n       COUNT(*)                                     AS 사용횟수\nFROM   information_schema.COLUMNS\nWHERE  TABLE_SCHEMA IN __SCHEMAS__\nGROUP  BY SUBSTRING_INDEX(COLUMN_NAME, '_', -1), DATA_TYPE,\n       COALESCE(CHARACTER_MAXIMUM_LENGTH, NUMERIC_PRECISION), NUMERIC_SCALE\nORDER  BY 2, 6 DESC;",
        pg:"SELECT MIN(table_schema)                              AS DB명,\n       substring(column_name FROM '[^_]+$')           AS 도메인분류후보,\n       data_type                                      AS 데이터타입,\n       COALESCE(character_maximum_length, numeric_precision) AS 데이터길이,\n       numeric_scale                                  AS 소수점길이,\n       COUNT(*)                                       AS 사용횟수\nFROM   information_schema.columns\nWHERE  table_schema IN __SCHEMAS__\nGROUP  BY substring(column_name FROM '[^_]+$'), data_type,\n       COALESCE(character_maximum_length, numeric_precision), numeric_scale\nORDER  BY 2, 6 DESC;",
        mssql:"SELECT s.name                                                       AS DB명,\n       RIGHT(c.name, CHARINDEX('_', REVERSE(c.name) + '_') - 1)     AS 도메인분류후보,\n       ty.name                                                      AS 데이터타입,\n       CASE WHEN c.max_length = -1 THEN NULL\n            WHEN ty.name LIKE 'n%' AND (ty.name LIKE '%char%' OR ty.name LIKE '%text%') THEN c.max_length / 2\n            WHEN ty.name LIKE '%char%' OR ty.name LIKE '%binary%' THEN c.max_length\n            WHEN ty.name IN ('decimal','numeric') THEN c.precision\n            ELSE NULL END                                           AS 데이터길이,\n       CASE WHEN ty.name IN ('decimal','numeric') THEN c.scale ELSE NULL END AS 소수점길이,\n       COUNT(*)                                                     AS 사용횟수\nFROM   sys.columns c\n       JOIN sys.tables t  ON c.object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\n       JOIN sys.types ty  ON c.user_type_id = ty.user_type_id\nWHERE  s.name IN __SCHEMAS__\nGROUP  BY s.name, RIGHT(c.name, CHARINDEX('_', REVERSE(c.name) + '_') - 1),\n       ty.name, c.max_length, c.precision, c.scale\nORDER  BY 2, 6 DESC;",
        sybase:"SELECT t.name   AS 데이터타입,\n       c.length AS 데이터길이,\n       COUNT(*) AS 사용횟수\nFROM   sysobjects o\n       JOIN syscolumns c ON o.id = c.id\n       JOIN systypes  t ON c.usertype = t.usertype\nWHERE  o.type = 'U'\nGROUP  BY t.name, c.length\nORDER  BY 3 DESC;\n-- 접미사 분해는 엑셀에서 (문자열 함수 제약)"
      } }
  ],
  manual:[
    '도메인명 명명 수기 (예: _YN+CHAR(1) → "여부C1", _DT+VARCHAR(14) → "일시C14")',
    '같은 접미사에 타입 여럿 = 도메인 불일치 → 대표 정하고 특이사항 기록'
  ]
},
{
  key:'d08', no:'08', label:'DB 표준코드',
  sub:'행 단위 = 코드값 1개. 공통코드 테이블 실명은 시스템마다 다름 — 2단계로.',
  formCols:'순번 | 기관명 | DB명 | 관리부서명 | 코드명(한글) | 코드명(영문) | 데이터타입 | 데이터길이 | 코드값 | 코드값의미 | 코드값설명 | 제정일자 | 사용여부 | 특이사항',
  sql:[
    { title:'1단계: 공통코드 테이블 후보 탐색',
      q:{
        oracle:"SELECT A.OWNER, A.TABLE_NAME, B.COMMENTS\nFROM   ALL_TABLES A\n       LEFT JOIN ALL_TAB_COMMENTS B ON A.OWNER = B.OWNER AND A.TABLE_NAME = B.TABLE_NAME\nWHERE  A.OWNER IN __SCHEMAS__\n       AND (A.TABLE_NAME LIKE '%CD%' OR A.TABLE_NAME LIKE '%CODE%'\n            OR A.TABLE_NAME LIKE '%COMM%' OR B.COMMENTS LIKE '%코드%');",
        mysql:"SELECT TABLE_SCHEMA, TABLE_NAME, TABLE_COMMENT\nFROM   information_schema.TABLES\nWHERE  TABLE_SCHEMA IN __SCHEMAS__ AND TABLE_TYPE = 'BASE TABLE'\n       AND (TABLE_NAME LIKE '%CD%' OR TABLE_NAME LIKE '%CODE%'\n            OR TABLE_NAME LIKE '%COMM%' OR TABLE_COMMENT LIKE '%코드%');",
        pg:"SELECT n.nspname, c.relname, obj_description(c.oid, 'pg_class') AS comments\nFROM   pg_class c JOIN pg_namespace n ON c.relnamespace = n.oid\nWHERE  c.relkind IN ('r','p') AND NOT c.relispartition AND n.nspname IN __SCHEMAS__\n       AND (c.relname ILIKE '%cd%' OR c.relname ILIKE '%code%'\n            OR c.relname ILIKE '%comm%'\n            OR obj_description(c.oid, 'pg_class') LIKE '%코드%');",
        mssql:"SELECT s.name, t.name, CAST(ep.value AS NVARCHAR(200)) AS comments\nFROM   sys.tables t\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\n       LEFT JOIN sys.extended_properties ep ON ep.major_id = t.object_id\n            AND ep.minor_id = 0 AND ep.name = 'MS_Description'\nWHERE  s.name IN __SCHEMAS__\n       AND (t.name LIKE '%CD%' OR t.name LIKE '%CODE%' OR t.name LIKE '%COMM%'\n            OR CAST(ep.value AS NVARCHAR(200)) LIKE '%코드%');",
        sybase:"SELECT name FROM sysobjects\nWHERE  type = 'U'\n       AND (name LIKE '%CD%' OR name LIKE '%CODE%' OR name LIKE '%COMM%');"
      } },
    { title:'2단계: 확정 후 (테이블·컬럼명 실물로 치환 — 전 방언 공통 틀)',
      q:{
        oracle:"SELECT G.그룹코드     AS 코드명_영문,\n       G.그룹코드명   AS 코드명_한글,\n       D.코드         AS 코드값,\n       D.코드명       AS 코드값의미,\n       D.사용여부     AS 사용여부\nFROM   공통코드그룹 G JOIN 공통코드상세 D ON G.그룹코드 = D.그룹코드\nORDER  BY G.그룹코드, D.정렬순서;",
        mysql:"SELECT G.그룹코드, G.그룹코드명, D.코드, D.코드명, D.사용여부\nFROM   공통코드그룹 G JOIN 공통코드상세 D ON G.그룹코드 = D.그룹코드\nORDER  BY G.그룹코드, D.정렬순서;",
        pg:"SELECT G.그룹코드, G.그룹코드명, D.코드, D.코드명, D.사용여부\nFROM   공통코드그룹 G JOIN 공통코드상세 D ON G.그룹코드 = D.그룹코드\nORDER  BY G.그룹코드, D.정렬순서;",

        pg:"SELECT n.nspname, c.relname, obj_description(c.oid, 'pg_class') AS comments\nFROM   pg_class c JOIN pg_namespace n ON c.relnamespace = n.oid\nWHERE  c.relkind IN ('r','p') AND NOT c.relispartition AND n.nspname IN __SCHEMAS__\n       AND (c.relname ILIKE 'if%' OR c.relname ILIKE '%_if_%'\n            OR c.relname ILIKE '%rcv%' OR c.relname ILIKE '%snd%'\n            OR obj_description(c.oid, 'pg_class') LIKE '%연계%');",
