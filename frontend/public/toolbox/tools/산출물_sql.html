{
  key:'d10', no:'10', label:'인덱스 정의서',
  sub:'인덱스 1컬럼 = 1행. 복합인덱스는 컬럼순서대로. 성능·마이그레이션 기준선. (시스템 필요분)',
  formCols:'순번 | DB명 | 테이블명 | 인덱스명 | 인덱스구분(PK/UNIQUE/일반) | 컬럼순서 | 컬럼명 | 정렬(ASC/DESC) | 유니크여부',
  sql:[
    { title:'인덱스 + 컬럼 (컬럼순서대로)',
      q:{
        oracle:"SELECT I.TABLE_OWNER      AS DB명,\n       I.TABLE_NAME       AS 테이블명,\n       I.INDEX_NAME       AS 인덱스명,\n       CASE WHEN C.CONSTRAINT_TYPE = 'P' THEN 'PK'\n            WHEN C.CONSTRAINT_TYPE = 'U' THEN 'UNIQUE'\n            WHEN I.UNIQUENESS = 'UNIQUE' THEN 'UNIQUE' ELSE '일반' END AS 인덱스구분,\n       IC.COLUMN_POSITION AS 컬럼순서,\n       IC.COLUMN_NAME     AS 컬럼명,\n       IC.DESCEND         AS 정렬,\n       DECODE(I.UNIQUENESS, 'UNIQUE', 'Y', 'N') AS 유니크여부\nFROM   ALL_INDEXES I\n       JOIN ALL_IND_COLUMNS IC ON IC.INDEX_OWNER = I.OWNER AND IC.INDEX_NAME = I.INDEX_NAME\n       LEFT JOIN ALL_CONSTRAINTS C ON C.OWNER = I.TABLE_OWNER AND C.INDEX_NAME = I.INDEX_NAME\n            AND C.CONSTRAINT_TYPE IN ('P','U')\nWHERE  I.TABLE_OWNER IN __SCHEMAS__\nORDER  BY I.TABLE_NAME, I.INDEX_NAME, IC.COLUMN_POSITION;\n-- 함수기반 인덱스는 IC.COLUMN_NAME이 SYS_NC$ 형태(숨김) — 식 원문은 ALL_IND_EXPRESSIONS 참고",
        mysql:"SELECT TABLE_SCHEMA AS DB명, TABLE_NAME AS 테이블명, INDEX_NAME AS 인덱스명,\n       CASE WHEN INDEX_NAME = 'PRIMARY' THEN 'PK' WHEN NON_UNIQUE = 0 THEN 'UNIQUE' ELSE '일반' END AS 인덱스구분,\n       SEQ_IN_INDEX AS 컬럼순서, COLUMN_NAME AS 컬럼명,\n       CASE WHEN COLLATION = 'D' THEN 'DESC' ELSE 'ASC' END AS 정렬,\n       IF(NON_UNIQUE = 0, 'Y', 'N') AS 유니크여부\nFROM   information_schema.STATISTICS\nWHERE  TABLE_SCHEMA IN __SCHEMAS__\nORDER  BY TABLE_NAME, INDEX_NAME, SEQ_IN_INDEX;",
        pg:"SELECT n.nspname AS DB명, t.relname AS 테이블명, i.relname AS 인덱스명,\n       CASE WHEN ix.indisprimary THEN 'PK' WHEN ix.indisunique THEN 'UNIQUE' ELSE '일반' END AS 인덱스구분,\n       k.ord AS 컬럼순서, a.attname AS 컬럼명,\n       CASE WHEN ix.indisunique THEN 'Y' ELSE 'N' END AS 유니크여부\nFROM   pg_index ix\n       JOIN pg_class i     ON i.oid = ix.indexrelid\n       JOIN pg_class t     ON t.oid = ix.indrelid\n       JOIN pg_namespace n ON n.oid = t.relnamespace\n       CROSS JOIN LATERAL unnest(ix.indkey) WITH ORDINALITY AS k(attnum, ord)\n       LEFT JOIN pg_attribute a ON a.attrelid = t.oid AND a.attnum = k.attnum\nWHERE  n.nspname IN __SCHEMAS__ AND k.ord <= ix.indnkeyatts   -- INCLUDE(covering) 컬럼 제외; indnkeyatts는 PG11+ (10↓은 이 조건 삭제)\nORDER  BY t.relname, i.relname, k.ord;\n-- 정렬(ASC/DESC)·표현식 인덱스 원문: SELECT pg_get_indexdef(ix.indexrelid) — attname NULL은 표현식 인덱스",
        mssql:"SELECT s.name AS DB명, t.name AS 테이블명, i.name AS 인덱스명,\n       CASE WHEN i.is_primary_key = 1 THEN 'PK' WHEN i.is_unique = 1 THEN 'UNIQUE' ELSE '일반' END AS 인덱스구분,\n       ic.key_ordinal AS 컬럼순서, c.name AS 컬럼명,\n       CASE WHEN ic.is_descending_key = 1 THEN 'DESC' ELSE 'ASC' END AS 정렬,\n       CASE WHEN i.is_unique = 1 THEN 'Y' ELSE 'N' END AS 유니크여부\nFROM   sys.indexes i\n       JOIN sys.tables t  ON i.object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\n       JOIN sys.index_columns ic ON ic.object_id = i.object_id AND ic.index_id = i.index_id\n       JOIN sys.columns c ON c.object_id = ic.object_id AND c.column_id = ic.column_id\nWHERE  s.name IN __SCHEMAS__ AND i.type > 0 AND ic.is_included_column = 0\nORDER  BY t.name, i.name, ic.key_ordinal;",
        sybase:"-- ASE: sysindexes.indid 1~254 = 인덱스 (0 = 데이터, 255 = text chain)\n-- index_col 4번째 인자 = 소유자 uid. 생략하면 접속 계정 기준이라 소유자가 다른 테이블은 컬럼명이 NULL 로 빠진다\nSELECT db_name() AS DB명,\n       o.name    AS 테이블명,\n       i.name    AS 인덱스명,\n       CASE WHEN i.status & 2048 = 2048 THEN 'PK'\n            WHEN i.status & 2    = 2    THEN 'UNIQUE'\n            ELSE '일반' END                              AS 인덱스구분,\n       CASE WHEN i.status & 2 = 2 THEN 'Y' ELSE 'N' END AS 유니크여부,\n       index_col(o.name, i.indid, 1, o.uid) AS 컬럼1,\n       index_col(o.name, i.indid, 2, o.uid) AS 컬럼2,\n       index_col(o.name, i.indid, 3, o.uid) AS 컬럼3,\n       index_col(o.name, i.indid, 4, o.uid) AS 컬럼4,\n       index_col(o.name, i.indid, 5, o.uid) AS 컬럼5,\n       index_col(o.name, i.indid, 6, o.uid) AS 컬럼6,\n       index_col(o.name, i.indid, 7, o.uid) AS 컬럼7,\n       index_col(o.name, i.indid, 8, o.uid) AS 컬럼8\nFROM   sysobjects o\n       JOIN sysindexes i ON o.id = i.id\nWHERE  o.type = 'U' AND i.indid BETWEEN 1 AND 254__EXCL(o.name)__\nORDER  BY o.name, i.indid;\n-- 인덱스구분: sysindexes.status 2048 = Index on primary key / 2 = Unique index (PDF sysindexes status 비트표)\n--   status2 비트2 는 PK와 UNIQUE 제약을 구분하지 않으므로 쓰지 않는다\n-- keycnt 는 넌클러스터드에서 실제 키 개수+1이라 루프 상한으로 쓰지 않는다 — 남는 자리는 NULL 로 비고 무시\n-- ★ 컬럼순서|컬럼명 세로 양식은 엑셀에서 컬럼1~8 을 행으로 전개(피벗 해제)해서 만든다\n-- ★ 복합키가 9개 컬럼 이상이면 index_col 인자를 9,10... 으로 늘릴 것\n-- 정렬(ASC/DESC): ASE 딕셔너리에 노출 안 됨(keys1/keys2 varbinary) — sp_helpindex 테이블명 출력으로 확인\n-- 상세: sp_helpindex 테이블명. DB별로 USE 데이터베이스명 후 실행"
      } }
  ],
  manual:[
    '인덱스구분: PK/UNIQUE 제약 백킹인덱스는 그걸로, 나머지는 UNIQUE 속성이면 UNIQUE 아니면 일반',
    'PG는 정렬(ASC/DESC)·표현식 인덱스 판별이 딕셔너리에서 복잡 — 필요시 pg_get_indexdef로 원문 확인',
    'Sybase는 정렬(ASC/DESC)이 딕셔너리에 없음(keys1/keys2 varbinary) — sp_helpindex 출력으로 확인. 컬럼1~8 가로 형태는 엑셀에서 세로 전개',
    '인덱스 통계 신선도(Oracle LAST_ANALYZED 등) 오래되면 옵티마이저 오판 — 02 볼륨 통계경고와 같은 기준으로 확인'
  ]
},
{
  key:'d11', no:'11', label:'제약조건 정의서',
  sub:'PK/UNIQUE/CHECK 제약. CHECK식은 06/07 허용값 근거. DEFAULT는 03 기본값 열 참조. (시스템 필요분)',
  formCols:'순번 | DB명 | 테이블명 | 제약조건명 | 제약유형(PK/UNIQUE/CHECK) | 제약내용(CHECK식·컬럼구성은 10 인덱스정의서 참고)',
  sql:[
    { title:'제약조건 (P/U/C)',
      q:{
        oracle:"SELECT C.OWNER AS DB명, C.TABLE_NAME AS 테이블명, C.CONSTRAINT_NAME AS 제약조건명,\n       DECODE(C.CONSTRAINT_TYPE, 'P','PK', 'U','UNIQUE', 'C','CHECK') AS 제약유형,\n       C.SEARCH_CONDITION AS 제약내용   -- CHECK식\nFROM   ALL_CONSTRAINTS C\nWHERE  C.OWNER IN __SCHEMAS__ AND C.CONSTRAINT_TYPE IN ('P','U','C')\nORDER  BY C.TABLE_NAME, C.CONSTRAINT_TYPE, C.CONSTRAINT_NAME;\n-- 제약별 1행(방언 정합). PK/UNIQUE 컬럼 구성은 10 인덱스정의서 참고\n-- NOT NULL도 CHECK(SYS_C...)로 잡힘 — 순수 CHECK만: AND CONSTRAINT_NAME NOT LIKE 'SYS[_]%' 추가\n-- DEFAULT값은 03 컬럼정의서 기본값 열(DATA_DEFAULT) 참고\n-- ※ SEARCH_CONDITION 컬럼 타입은 실행 환경마다 다름 — Tibero 6은 VARCHAR(65532)라 인라인뷰/GROUP BY 제약 없음.\n--   순정 Oracle은 LONG이라 ROWNUM 인라인뷰에 넣으면 ORA-00997 남 — 실행 환경(Tibero/Oracle) 확인 후 판단 (03번 DATA_DEFAULT 와 같은 함정)",
        mysql:"-- CHECK는 MySQL 8.0.16+ / MariaDB 10.2+\nSELECT tc.TABLE_SCHEMA AS DB명, tc.TABLE_NAME AS 테이블명, tc.CONSTRAINT_NAME AS 제약조건명,\n       tc.CONSTRAINT_TYPE AS 제약유형, cc.CHECK_CLAUSE AS 제약내용\nFROM   information_schema.TABLE_CONSTRAINTS tc\n       LEFT JOIN information_schema.CHECK_CONSTRAINTS cc\n            ON cc.CONSTRAINT_SCHEMA = tc.TABLE_SCHEMA AND cc.CONSTRAINT_NAME = tc.CONSTRAINT_NAME\nWHERE  tc.TABLE_SCHEMA IN __SCHEMAS__ AND tc.CONSTRAINT_TYPE IN ('PRIMARY KEY','UNIQUE','CHECK')\nORDER  BY tc.TABLE_NAME, tc.CONSTRAINT_TYPE;\n-- DEFAULT는 03 기본값 열(COLUMN_DEFAULT) 참고",
        pg:"SELECT n.nspname AS DB명, t.relname AS 테이블명, con.conname AS 제약조건명,\n       CASE con.contype WHEN 'p' THEN 'PK' WHEN 'u' THEN 'UNIQUE' WHEN 'c' THEN 'CHECK' END AS 제약유형,\n       pg_get_constraintdef(con.oid) AS 제약내용\nFROM   pg_constraint con\n       JOIN pg_class t     ON t.oid = con.conrelid\n       JOIN pg_namespace n ON n.oid = t.relnamespace\nWHERE  n.nspname IN __SCHEMAS__ AND con.contype IN ('p','u','c')\nORDER  BY t.relname, con.contype, con.conname;\n-- DEFAULT는 03 기본값 열(pg_attrdef) 참고",
        mssql:"-- CHECK\nSELECT s.name AS DB명, t.name AS 테이블명, cc.name AS 제약조건명, 'CHECK' AS 제약유형, cc.definition AS 제약내용\nFROM   sys.check_constraints cc JOIN sys.tables t ON cc.parent_object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS__\nUNION ALL\n-- DEFAULT\nSELECT s.name, t.name, dc.name, 'DEFAULT', dc.definition\nFROM   sys.default_constraints dc JOIN sys.tables t ON dc.parent_object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS__\nUNION ALL\n-- UNIQUE\nSELECT s.name, t.name, i.name, 'UNIQUE', NULL\nFROM   sys.indexes i JOIN sys.tables t ON i.object_id = t.object_id\n       JOIN sys.schemas s ON t.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS__ AND i.is_unique_constraint = 1\nORDER  BY 2, 4;",
        sybase:"-- ASE: CHECK/DEFAULT 텍스트는 syscomments(sysconstraints 연결) — 버전차 큼. 정확은 sp_helpconstraint\nSELECT o.name AS 테이블명, obj.name AS 제약조건명, com.text AS 제약내용\nFROM   sysconstraints con\n       JOIN sysobjects o   ON con.tableid = o.id\n       JOIN sysobjects obj ON con.constrid = obj.id\n       LEFT JOIN syscomments com ON com.id = con.constrid\nWHERE  o.type = 'U'\nORDER  BY o.name;"
      } }
  ],
  manual:[
    'CHECK식 = 06/07 도메인 허용값(_YN → Y/N 등) 자동 초안 근거 — 엑셀서 허용값만 추출',
    'Oracle SEARCH_CONDITION·PG constraintdef·MSSQL definition은 정의 원문 그대로',
    'DEFAULT값은 03 컬럼정의서 기본값 열과 중복 — 이 문서는 CHECK/UNIQUE 위주, DEFAULT는 참조만'
  ]
},
{
  key:'d12', no:'12', label:'뷰 정의서',
  sub:'뷰 1개 = 1행(정의문 포함). 09 연계용 뷰목록과 달리 전체 뷰+정의+의존. (시스템 필요분)',
  formCols:'순번 | DB명 | 뷰명 | 뷰정의(SQL) | 비고(의존 기저테이블)',
  sql:[
    { title:'뷰 목록 + 정의문',
      q:{
        oracle:"SELECT V.OWNER AS DB명, V.VIEW_NAME AS 뷰명, V.TEXT AS 뷰정의   -- TEXT는 LONG형\nFROM   ALL_VIEWS V\nWHERE  V.OWNER IN __SCHEMAS__\nORDER  BY V.VIEW_NAME;\n-- 의존 기저테이블: SELECT OWNER, NAME, REFERENCED_OWNER, REFERENCED_NAME FROM ALL_DEPENDENCIES\n--   WHERE OWNER IN __SCHEMAS__ AND TYPE = 'VIEW' AND REFERENCED_TYPE = 'TABLE';",
        mysql:"SELECT TABLE_SCHEMA AS DB명, TABLE_NAME AS 뷰명, VIEW_DEFINITION AS 뷰정의\nFROM   information_schema.VIEWS\nWHERE  TABLE_SCHEMA IN __SCHEMAS__\nORDER  BY TABLE_NAME;",
        pg:"SELECT schemaname AS DB명, viewname AS 뷰명,\n       pg_get_viewdef((quote_ident(schemaname) || '.' || quote_ident(viewname))::regclass, true) AS 뷰정의\nFROM   pg_views\nWHERE  schemaname IN __SCHEMAS__\nORDER  BY viewname;",
        mssql:"SELECT s.name AS DB명, v.name AS 뷰명, m.definition AS 뷰정의\nFROM   sys.views v\n       JOIN sys.schemas s ON v.schema_id = s.schema_id\n       LEFT JOIN sys.sql_modules m ON m.object_id = v.object_id\nWHERE  s.name IN __SCHEMAS__\nORDER  BY v.name;\n-- 의존: SELECT referenced_entity_name FROM sys.sql_expression_dependencies WHERE referencing_id = OBJECT_ID('스키마.뷰명');",
        sybase:"-- text가 여러 조각 — colid2 순으로 이어붙여야 완전한 정의. 전문 한 번에: sp_helptext 뷰명\nSELECT o.name AS 뷰명, c.text AS 뷰정의조각\nFROM   sysobjects o JOIN syscomments c ON o.id = c.id\nWHERE  o.type = 'V'\nORDER  BY o.name, c.colid2;"
      } }
  ],
  manual:[
    '뷰정의(TEXT/definition)는 CREATE VIEW 원문 — 업무로직 담긴 뷰는 용도 수기 보강',
    '의존 기저테이블은 딕셔너리에서 매핑 가능(주석 쿼리) — 연계용 뷰는 09와 교차확인'
  ]
},
{
  key:'d13', no:'13', label:'프로시저·함수·트리거 정의서',
  sub:'DB에 든 업무로직. 소스가 행 단위로 쪼개짐 → 객체별 이어붙이기. (시스템 필요분)',
  formCols:'순번 | DB명 | 객체명 | 객체유형(PROC/FUNC/TRIGGER) | 정의(소스)',
  sql:[
    { title:'프로시저/함수/트리거 소스',
      q:{
        oracle:"-- 소스 전문(행 단위). 목록만이면 하단 주석 쿼리\nSELECT OWNER AS DB명, NAME AS 객체명, TYPE AS 객체유형, LINE AS 행, TEXT AS 소스\nFROM   ALL_SOURCE\nWHERE  OWNER IN __SCHEMAS__ AND TYPE IN ('PROCEDURE','FUNCTION','PACKAGE','PACKAGE BODY','TRIGGER')\nORDER  BY NAME, LINE;\n-- 목록: SELECT OWNER, OBJECT_NAME, OBJECT_TYPE FROM ALL_OBJECTS WHERE OWNER IN __SCHEMAS__\n--   AND OBJECT_TYPE IN ('PROCEDURE','FUNCTION','TRIGGER','PACKAGE');\n-- 트리거 상세: SELECT TABLE_NAME, TRIGGERING_EVENT, TRIGGER_BODY FROM ALL_TRIGGERS WHERE OWNER IN __SCHEMAS__;",
        mysql:"-- 프로시저/함수\nSELECT ROUTINE_SCHEMA AS DB명, ROUTINE_NAME AS 객체명, ROUTINE_TYPE AS 객체유형, ROUTINE_DEFINITION AS 정의\nFROM   information_schema.ROUTINES\nWHERE  ROUTINE_SCHEMA IN __SCHEMAS__;\n-- 트리거\nSELECT TRIGGER_SCHEMA AS DB명, TRIGGER_NAME AS 객체명, 'TRIGGER' AS 객체유형,\n       CONCAT(ACTION_TIMING, ' ', EVENT_MANIPULATION, ' ON ', EVENT_OBJECT_TABLE) AS 정의\nFROM   information_schema.TRIGGERS\nWHERE  TRIGGER_SCHEMA IN __SCHEMAS__;",
        pg:"SELECT n.nspname AS DB명, p.proname AS 객체명,\n       CASE p.prokind WHEN 'f' THEN 'FUNCTION' WHEN 'p' THEN 'PROCEDURE' WHEN 'a' THEN 'AGGREGATE' WHEN 'w' THEN 'WINDOW' END AS 객체유형,\n       pg_get_functiondef(p.oid) AS 정의\nFROM   pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace\nWHERE  n.nspname IN __SCHEMAS__\nORDER  BY p.proname;\n-- prokind는 PG11+ (10↓은 proisagg/proiswindow)\n-- 트리거: SELECT event_object_table, trigger_name, action_timing, event_manipulation, action_statement\n--   FROM information_schema.triggers WHERE trigger_schema IN __SCHEMAS__;",
        mssql:"SELECT s.name AS DB명, o.name AS 객체명, o.type_desc AS 객체유형, m.definition AS 정의\nFROM   sys.sql_modules m\n       JOIN sys.objects o ON m.object_id = o.object_id\n       JOIN sys.schemas s ON o.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS__ AND o.type IN ('P','FN','IF','TF','TR')\nORDER  BY o.type, o.name;\n-- P=프로시저 FN/IF/TF=함수 TR=트리거. definition NULL이면 암호화(WITH ENCRYPTION)",
        sybase:"SELECT o.name AS 객체명,\n       CASE o.type WHEN 'P' THEN 'PROCEDURE' WHEN 'TR' THEN 'TRIGGER' END AS 객체유형,\n       c.text AS 정의조각\nFROM   sysobjects o JOIN syscomments c ON o.id = c.id\nWHERE  o.type IN ('P','TR')\nORDER  BY o.name, c.colid2;\n-- 전문: sp_helptext 객체명. 암호화면 text 없음"
      } }
  ],
  manual:[
    '소스가 행 단위로 쪼개짐(Oracle ALL_SOURCE·Sybase syscomments) — 객체별 이어붙이거나 sp_helptext/원문',
    'DB에 업무로직 있으면 필수. 트리거는 대상테이블·이벤트 함께 기재',
    '암호화 객체는 정의 NULL — 소스 형상관리(SVN 등)에서 별도 확보'
  ]
},
{
  key:'d14', no:'14', label:'시퀀스 목록',
  sub:'채번 객체. MySQL/Sybase는 시퀀스 없어 AUTO_INCREMENT/IDENTITY로 대체. (시스템 필요분 · 소품)',
  formCols:'순번 | DB명 | 시퀀스명 | 현재값 | 증가값 | 최소값 | 최대값 | 순환여부',
  sql:[
    { title:'시퀀스 속성',
      q:{
        oracle:"SELECT SEQUENCE_OWNER AS DB명, SEQUENCE_NAME AS 시퀀스명, LAST_NUMBER AS 현재값,\n       INCREMENT_BY AS 증가값, MIN_VALUE AS 최소값, MAX_VALUE AS 최대값, CYCLE_FLAG AS 순환여부\nFROM   ALL_SEQUENCES\nWHERE  SEQUENCE_OWNER IN __SCHEMAS__\nORDER  BY SEQUENCE_NAME;",
        mysql:"-- MySQL엔 시퀀스 객체 없음(AUTO_INCREMENT). MariaDB 10.3+만 시퀀스\nSELECT TABLE_SCHEMA AS DB명, TABLE_NAME AS 시퀀스명\nFROM   information_schema.TABLES\nWHERE  TABLE_SCHEMA IN __SCHEMAS__ AND TABLE_TYPE = 'SEQUENCE';\n-- AUTO_INCREMENT 현재값: SELECT TABLE_NAME, AUTO_INCREMENT FROM information_schema.TABLES\n--   WHERE TABLE_SCHEMA IN __SCHEMAS__ AND AUTO_INCREMENT IS NOT NULL;",
        pg:"SELECT schemaname AS DB명, sequencename AS 시퀀스명, last_value AS 현재값,\n       increment_by AS 증가값, min_value AS 최소값, max_value AS 최대값, cycle AS 순환여부\nFROM   pg_sequences\nWHERE  schemaname IN __SCHEMAS__\nORDER  BY sequencename;\n-- pg_sequences는 PG10+ (9.x는 각 시퀀스 SELECT * FROM 시퀀스명)",
        mssql:"-- 시퀀스는 SQL Server 2012+ (이전은 IDENTITY)\nSELECT s.name AS DB명, seq.name AS 시퀀스명, seq.current_value AS 현재값,\n       seq.increment AS 증가값, seq.minimum_value AS 최소값,\n       seq.maximum_value AS 최대값, seq.is_cycling AS 순환여부   -- sql_variant 원형(decimal 시퀀스도 안전)\nFROM   sys.sequences seq JOIN sys.schemas s ON seq.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS__\nORDER  BY seq.name;",
        sybase:"-- ASE는 시퀀스 객체 없음 — IDENTITY 컬럼 사용. 해당 테이블·컬럼:\nSELECT o.name AS 테이블명, c.name AS IDENTITY컬럼\nFROM   sysobjects o JOIN syscolumns c ON o.id = c.id\nWHERE  o.type = 'U' AND (c.status & 128) = 128;"
      } }
  ],
  manual:[
    '시퀀스 개념 없는 DBMS(MySQL/Sybase)는 AUTO_INCREMENT/IDENTITY로 대체 — 채번 방식만 기재',
    '현재값(LAST_NUMBER/last_value)은 캐시 반영 근사 — 정확한 다음값은 운영 중 변동'
  ]
},
{
  key:'d15', no:'15', label:'권한·롤 명세 ⚠',
  sub:'⚠ 민감 산출물. 실계정 반드시 익명화, 결과 파일 저장 금지. 이관 후 접근제어 재설정 기준. (시스템 필요분)',
  formCols:'순번 | 계정(★익명화) | 롤 | 권한종류 | 대상객체',
  sql:[
    { title:'계정·롤·권한 (실계정 익명화 전제)',
      q:{
        oracle:"-- ⚠ 결과에 실계정명 포함. 산출물 붙이기 전 반드시 익명화(APP_USER 식). 이 HTML엔 결과 저장 금지(OneDrive 동기화)\n-- 계정 목록\nSELECT USERNAME, ACCOUNT_STATUS, DEFAULT_TABLESPACE FROM DBA_USERS ORDER BY USERNAME;\n-- 롤 부여\nSELECT GRANTEE, GRANTED_ROLE FROM DBA_ROLE_PRIVS ORDER BY GRANTEE;\n-- 시스템 권한\nSELECT GRANTEE, PRIVILEGE FROM DBA_SYS_PRIVS ORDER BY GRANTEE;\n-- 객체 권한(업무 스키마 객체)\nSELECT GRANTEE, PRIVILEGE, OWNER, TABLE_NAME FROM DBA_TAB_PRIVS WHERE OWNER IN __SCHEMAS__ ORDER BY GRANTEE;\n-- DBA_ 권한 없으면 USER_/ALL_ 대체 또는 DBA 요청",
        mysql:"-- ⚠ 실계정 포함 — 익명화 후 제출. 결과 파일 저장 금지\nSELECT User AS 계정, Host FROM mysql.user ORDER BY User;\nSELECT GRANTEE, PRIVILEGE_TYPE FROM information_schema.USER_PRIVILEGES ORDER BY GRANTEE;\nSELECT GRANTEE, TABLE_SCHEMA, PRIVILEGE_TYPE FROM information_schema.SCHEMA_PRIVILEGES WHERE TABLE_SCHEMA IN __SCHEMAS__;\n-- 계정별 상세: SHOW GRANTS FOR 'user'@'host';",
        pg:"-- ⚠ 실계정(롤) 포함 — 익명화 후 제출. 결과 파일 저장 금지\nSELECT rolname AS 롤, rolsuper AS 슈퍼유저, rolcanlogin AS 로그인가능 FROM pg_roles ORDER BY rolname;\nSELECT grantee AS 계정, table_schema, table_name, privilege_type\nFROM   information_schema.role_table_grants\nWHERE  table_schema IN __SCHEMAS__\nORDER  BY grantee;",
        mssql:"-- ⚠ 실계정 포함 — 익명화 후 제출. 결과 파일 저장 금지\nSELECT name AS 계정, type_desc AS 유형 FROM sys.database_principals WHERE type IN ('S','U','G') ORDER BY name;\nSELECT dp.name AS 계정, o.name AS 대상객체, p.permission_name AS 권한, p.state_desc AS 상태\nFROM   sys.database_permissions p\n       JOIN sys.database_principals dp ON p.grantee_principal_id = dp.principal_id\n       LEFT JOIN sys.objects o ON p.major_id = o.object_id\nORDER  BY dp.name;",
        sybase:"-- ⚠ 실계정 포함 — 익명화 후 제출. 결과 파일 저장 금지\nSELECT name AS 계정 FROM master..syslogins ORDER BY name;\nSELECT u.name AS 사용자, o.name AS 대상객체, p.action AS 권한\nFROM   sysprotects p JOIN sysusers u ON p.uid = u.uid\n       JOIN sysobjects o ON p.id = o.id\nORDER  BY u.name;"
      } }
  ],
  manual:[
    '★ 보안: 결과에 실계정·권한구조 = 민감정보. 산출물엔 계정명 익명화(APP_USER/BATCH_USER 식) + 권한 구조만',
    '★ 이 HTML은 OneDrive 동기화 폴더 — 쿼리 결과(실계정)를 절대 파일에 저장·붙여넣기 금지 (실데이터 금지 규칙)',
    '용도: 시스템 이관 후 계정·접근제어 재설정 기준. 발주처 보안담당 승인 후 제출',
    'DBA_/master.. 권한 필요 — 없으면 DBA에 위임 추출 요청'
  ]
},
{
  key:'d90', no:'90', label:'데이터 품질 진단·정제',
  sub:'산출물 작성 중 만나는 오염 데이터 대응 쿼리 팩. 순서 고정: [진단] 분포 확인 → [정제] SELECT 변환 → [검증] 대사. 대상컬럼·테이블명은 자리표시자 — 치환 후 실행.',
  sql:[
    { title:'[진단] 문자 컬럼 포맷 분포 — 숫자→9, 영문→a/A로 접어 시그니처 집계',
      q:{
        oracle:"-- 어떤 포맷이 몇 건 섞였는지 전수 확인 — 정제 CASE는 이 결과를 보고 짠다 (짐작 금지)\nSELECT 포맷, COUNT(*) AS 건수, MIN(원값) AS 샘플1, MAX(원값) AS 샘플2\nFROM  (SELECT 대상컬럼 AS 원값,\n              TRANSLATE(대상컬럼,\n                '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ',\n                '9999999999aaaaaaaaaaaaaaaaaaaaaaaaaaAAAAAAAAAAAAAAAAAAAAAAAAAA') AS 포맷\n       FROM   스키마명.테이블명) x\nGROUP  BY 포맷\nORDER  BY 건수 DESC;\n-- 결과 예: '9999-99-99 99:' 1200건 / 'Aaa 99 9999  9' 300건 / '99999999999999' 50000건",
        mysql:"-- MySQL 5.7·8.0 · MariaDB 공통 — REGEXP_REPLACE(8.0+) 대신 REPLACE 62중첩(0-9→9, a-z→a, A-Z→A). REPLACE 는 늘 대소문자를 가린다\nSELECT 포맷, COUNT(*) AS 건수, MIN(원값) AS 샘플1, MAX(원값) AS 샘플2\nFROM  (SELECT 대상컬럼 AS 원값,\n              REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(CONVERT(대상컬럼 USING utf8mb4) COLLATE utf8mb4_bin, '0', '9'), '1', '9'), '2', '9'), '3', '9'), '4', '9'), '5', '9'), '6', '9'), '7', '9'), '8', '9'), '9', '9'), 'a', 'a'), 'b', 'a'), 'c', 'a'), 'd', 'a'), 'e', 'a'), 'f', 'a'), 'g', 'a'), 'h', 'a'), 'i', 'a'), 'j', 'a'), 'k', 'a'), 'l', 'a'), 'm', 'a'), 'n', 'a'), 'o', 'a'), 'p', 'a'), 'q', 'a'), 'r', 'a'), 's', 'a'), 't', 'a'), 'u', 'a'), 'v', 'a'), 'w', 'a'), 'x', 'a'), 'y', 'a'), 'z', 'a'), 'A', 'A'), 'B', 'A'), 'C', 'A'), 'D', 'A'), 'E', 'A'), 'F', 'A'), 'G', 'A'), 'H', 'A'), 'I', 'A'), 'J', 'A'), 'K', 'A'), 'L', 'A'), 'M', 'A'), 'N', 'A'), 'O', 'A'), 'P', 'A'), 'Q', 'A'), 'R', 'A'), 'S', 'A'), 'T', 'A'), 'U', 'A'), 'V', 'A'), 'W', 'A'), 'X', 'A'), 'Y', 'A'), 'Z', 'A') AS 포맷\n       FROM   스키마명.테이블명) x\nGROUP  BY 포맷\nORDER  BY 건수 DESC;",
        pg:"SELECT 포맷, COUNT(*) AS 건수, MIN(원값) AS 샘플1, MAX(원값) AS 샘플2\nFROM  (SELECT 대상컬럼 AS 원값,\n              TRANSLATE(대상컬럼,\n                '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ',\n                '9999999999aaaaaaaaaaaaaaaaaaaaaaaaaaAAAAAAAAAAAAAAAAAAAAAAAAAA') AS 포맷\n       FROM   스키마명.테이블명) x\nGROUP  BY 포맷\nORDER  BY 건수 DESC;",
        mssql:"-- SQL Server 2017+ (TRANSLATE). 2016 이하: REPLACE 10중첩으로 숫자만 접기\n-- COLLATE _BIN 필수: 기본 CI collation이면 대소문자 매핑이 섞인다\nSELECT 포맷, COUNT(*) AS 건수, MIN(원값) AS 샘플1, MAX(원값) AS 샘플2\nFROM  (SELECT 대상컬럼 AS 원값,\n              TRANSLATE(대상컬럼 COLLATE Latin1_General_BIN,\n                '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ',\n                '9999999999aaaaaaaaaaaaaaaaaaaaaaaaaaAAAAAAAAAAAAAAAAAAAAAAAAAA') AS 포맷\n       FROM   스키마명.테이블명) x\nGROUP  BY 포맷\nORDER  BY 건수 DESC;",
        sybase:"-- TRANSLATE 없음 — 숫자만 9로 접는다. 영문 월('Mar' 등)은 그대로 남지만 그룹 수가 적어 충분\nSELECT 포맷, COUNT(*) AS 건수, MIN(원값) AS 샘플1\nFROM  (SELECT 대상컬럼 AS 원값,\n              str_replace(str_replace(str_replace(str_replace(str_replace(\n              str_replace(str_replace(str_replace(str_replace(대상컬럼,\n                '0','9'),'1','9'),'2','9'),'3','9'),'4','9'),'5','9'),'6','9'),'7','9'),'8','9') AS 포맷\n       FROM   테이블명) x\nGROUP  BY 포맷\nORDER  BY 건수 DESC;"
      } },
    { title:'[진단] PK 없는 테이블 목록 — 관계정의서·중복 위험 사전 확인',
      q:{
        oracle:"SELECT t.OWNER, t.TABLE_NAME\nFROM   ALL_TABLES t\nWHERE  t.OWNER IN __SCHEMAS__\n  AND  NOT EXISTS (SELECT 1 FROM ALL_CONSTRAINTS c\n                   WHERE  c.OWNER = t.OWNER AND c.TABLE_NAME = t.TABLE_NAME\n                     AND  c.CONSTRAINT_TYPE = 'P')\nORDER  BY t.OWNER, t.TABLE_NAME;",
        mysql:"SELECT t.TABLE_SCHEMA, t.TABLE_NAME\nFROM   information_schema.TABLES t\nWHERE  t.TABLE_SCHEMA IN __SCHEMAS__ AND t.TABLE_TYPE = 'BASE TABLE'\n  AND  NOT EXISTS (SELECT 1 FROM information_schema.TABLE_CONSTRAINTS c\n                   WHERE  c.TABLE_SCHEMA = t.TABLE_SCHEMA AND c.TABLE_NAME = t.TABLE_NAME\n                     AND  c.CONSTRAINT_TYPE = 'PRIMARY KEY')\nORDER  BY t.TABLE_SCHEMA, t.TABLE_NAME;",
        pg:"SELECT n.nspname AS 스키마, c.relname AS 테이블\nFROM   pg_class c JOIN pg_namespace n ON c.relnamespace = n.oid\nWHERE  c.relkind IN ('r','p') AND NOT c.relispartition\n  AND  n.nspname IN __SCHEMAS__\n  AND  NOT EXISTS (SELECT 1 FROM pg_constraint x WHERE x.conrelid = c.oid AND x.contype = 'p')\nORDER  BY 1, 2;\n-- PG 9.x: relispartition 없음 → 그 조건 삭제",
        mssql:"SELECT s.name AS 스키마, t.name AS 테이블\nFROM   sys.tables t JOIN sys.schemas s ON t.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS__\n  AND  NOT EXISTS (SELECT 1 FROM sys.key_constraints kc\n                   WHERE  kc.parent_object_id = t.object_id AND kc.type = 'PK')\nORDER  BY 1, 2;",
        sybase:"-- sysindexes.status 비트 2048 = 선언적 PK 인덱스 (시스템테이블 레퍼런스 PDF sysindexes 장)\nSELECT o.name AS 테이블\nFROM   sysobjects o\nWHERE  o.type = 'U'\n  AND  NOT EXISTS (SELECT 1 FROM sysindexes i WHERE i.id = o.id AND i.status & 2048 = 2048)\nORDER  BY o.name;\n-- PK 선언 없이 유니크 인덱스로만 운영하는 테이블도 잡힘 — 실질 키는 sp_helpindex 테이블명 으로 확인"
      } },
    { title:'[진단] 후보키 중복·NULL 검사 — 0행이어야 PK 자격 (전 방언 공통)',
      q:{
        oracle:"-- PK 승격 후보 검증: 0행이어야 유일성 성립\nSELECT 후보키1, 후보키2, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 후보키1, 후보키2\nHAVING COUNT(*) > 1\nORDER  BY 건수 DESC;\n\n-- PK는 NULL 불가 — 중복과 별도로 확인\nSELECT COUNT(*) AS 키_NULL_건수\nFROM   테이블명\nWHERE  후보키1 IS NULL OR 후보키2 IS NULL;",
        mysql:"-- PK 승격 후보 검증: 0행이어야 유일성 성립\nSELECT 후보키1, 후보키2, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 후보키1, 후보키2\nHAVING COUNT(*) > 1\nORDER  BY 건수 DESC;\n\n-- PK는 NULL 불가 — 중복과 별도로 확인\nSELECT COUNT(*) AS 키_NULL_건수\nFROM   테이블명\nWHERE  후보키1 IS NULL OR 후보키2 IS NULL;",
        pg:"-- PK 승격 후보 검증: 0행이어야 유일성 성립\nSELECT 후보키1, 후보키2, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 후보키1, 후보키2\nHAVING COUNT(*) > 1\nORDER  BY 건수 DESC;\n\n-- PK는 NULL 불가 — 중복과 별도로 확인\nSELECT COUNT(*) AS 키_NULL_건수\nFROM   테이블명\nWHERE  후보키1 IS NULL OR 후보키2 IS NULL;",
        mssql:"-- PK 승격 후보 검증: 0행이어야 유일성 성립\nSELECT 후보키1, 후보키2, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 후보키1, 후보키2\nHAVING COUNT(*) > 1\nORDER  BY 건수 DESC;\n\n-- PK는 NULL 불가 — 중복과 별도로 확인\nSELECT COUNT(*) AS 키_NULL_건수\nFROM   테이블명\nWHERE  후보키1 IS NULL OR 후보키2 IS NULL;",
        sybase:"-- PK 승격 후보 검증: 0행이어야 유일성 성립\nSELECT 후보키1, 후보키2, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 후보키1, 후보키2\nHAVING COUNT(*) > 1\nORDER  BY 건수 DESC;\n\n-- PK는 NULL 불가 — 중복과 별도로 확인\nSELECT COUNT(*) AS 키_NULL_건수\nFROM   테이블명\nWHERE  후보키1 IS NULL OR 후보키2 IS NULL;"

    { title:'[진단] 값없음 표현 혼재 — NULL 대체값 분포 (\'\', \'-\', \'N/A\', 99991231 …)',
      q:{
        oracle:"-- Oracle는 '' = NULL — TRIM 결과가 NULL이면 공백뿐인 값\nSELECT 대상컬럼 AS 값, COUNT(*) AS 건수\nFROM   스키마명.테이블명\nWHERE  대상컬럼 IS NULL\n   OR  TRIM(대상컬럼) IS NULL\n   OR  TRIM(대상컬럼) IN ('-', '.', '0', 'N/A', 'NA', 'NULL', '없음', '미상', '해당없음', '99999999', '99991231')\nGROUP  BY 대상컬럼\nORDER  BY 건수 DESC;\n-- 발견된 대체값은 산출물 기입 전 통일 (실제 NULL 처리 방침은 발주처 협의)",
        mysql:"SELECT 대상컬럼 AS 값, COUNT(*) AS 건수\nFROM   스키마명.테이블명\nWHERE  대상컬럼 IS NULL\n   OR  TRIM(대상컬럼) = ''\n   OR  TRIM(대상컬럼) IN ('-', '.', '0', 'N/A', 'NA', 'NULL', '없음', '미상', '해당없음', '99999999', '99991231')\nGROUP  BY 대상컬럼\nORDER  BY 건수 DESC;",
        pg:"SELECT 대상컬럼 AS 값, COUNT(*) AS 건수\nFROM   스키마명.테이블명\nWHERE  대상컬럼 IS NULL\n   OR  TRIM(대상컬럼) = ''\n   OR  TRIM(대상컬럼) IN ('-', '.', '0', 'N/A', 'NA', 'NULL', '없음', '미상', '해당없음', '99999999', '99991231')\nGROUP  BY 대상컬럼\nORDER  BY 건수 DESC;\n-- PG는 '' 와 NULL이 별개 — 둘 다 잡는다",
        mssql:"-- TRIM은 2017+ — 구버전 호환 위해 LTRIM(RTRIM()) 사용\nSELECT 대상컬럼 AS 값, COUNT(*) AS 건수\nFROM   스키마명.테이블명\nWHERE  대상컬럼 IS NULL\n   OR  LTRIM(RTRIM(대상컬럼)) = ''\n   OR  LTRIM(RTRIM(대상컬럼)) IN ('-', '.', '0', 'N/A', 'NA', 'NULL', '없음', '미상', '해당없음', '99999999', '99991231')\nGROUP  BY 대상컬럼\nORDER  BY 건수 DESC;",
        sybase:"SELECT 대상컬럼 AS 값, COUNT(*) AS 건수\nFROM   테이블명\nWHERE  대상컬럼 IS NULL\n   OR  ltrim(rtrim(대상컬럼)) = ''\n   OR  ltrim(rtrim(대상컬럼)) IN ('-', '.', '0', 'N/A', 'NA', 'NULL', '없음', '미상', '해당없음', '99999999', '99991231')\nGROUP  BY 대상컬럼\nORDER  BY 건수 DESC;"
      } },
    { title:'[진단] 공백·개행·비숫자·전각 혼입 탐지 (컬럼 성격별 지표 선택)',
      q:{
        oracle:"SELECT\n  COUNT(CASE WHEN 대상컬럼 <> TRIM(대상컬럼) THEN 1 END)  AS 앞뒤공백,\n  COUNT(CASE WHEN INSTR(대상컬럼, '　') > 0 THEN 1 END)   AS 전각공백,\n  COUNT(CASE WHEN INSTR(대상컬럼, CHR(10)) > 0 OR INSTR(대상컬럼, CHR(13)) > 0\n              OR INSTR(대상컬럼, CHR(9)) > 0 THEN 1 END)  AS 개행_탭,\n  COUNT(CASE WHEN TRANSLATE(대상컬럼, 'x0123456789', 'x') IS NOT NULL THEN 1 END) AS 비숫자_혼입,\n  COUNT(CASE WHEN LENGTHB(대상컬럼) <> LENGTH(대상컬럼) THEN 1 END) AS 한글_전각_포함\nFROM 스키마명.테이블명;\n-- 비숫자_혼입: 숫자만 들어야 하는 컬럼(금액·번호)에서만 의미\n-- 한글_전각_포함: 영숫자 컬럼(코드·ID)에서만 의미 — 한글 텍스트 컬럼이면 무시\n-- 개행_탭 있는 컬럼은 CSV 추출 시 행 깨짐 — 산출물 뽑기 전 REPLACE 필요",
        mysql:"SELECT\n  SUM(대상컬럼 <> TRIM(대상컬럼))                          AS 앞뒤공백,\n  SUM(INSTR(대상컬럼, '　') > 0)                           AS 전각공백,\n  SUM(INSTR(대상컬럼, CHAR(10)) > 0 OR INSTR(대상컬럼, CHAR(13)) > 0\n      OR INSTR(대상컬럼, CHAR(9)) > 0)                     AS 개행_탭,\n  SUM(대상컬럼 REGEXP '[^0-9]')                            AS 비숫자_혼입,\n  SUM(LENGTH(대상컬럼) <> CHAR_LENGTH(대상컬럼))            AS 한글_전각_포함\nFROM 스키마명.테이블명;\n-- LENGTH=바이트, CHAR_LENGTH=글자수 — 다르면 멀티바이트(한글·전각) 포함",
        pg:"SELECT\n  COUNT(*) FILTER (WHERE 대상컬럼 <> TRIM(대상컬럼))       AS 앞뒤공백,\n  COUNT(*) FILTER (WHERE POSITION('　' IN 대상컬럼) > 0)   AS 전각공백,\n  COUNT(*) FILTER (WHERE 대상컬럼 ~ '[\\n\\r\\t]')            AS 개행_탭,\n  COUNT(*) FILTER (WHERE 대상컬럼 ~ '[^0-9]')              AS 비숫자_혼입,\n  COUNT(*) FILTER (WHERE OCTET_LENGTH(대상컬럼) <> LENGTH(대상컬럼)) AS 한글_전각_포함\nFROM 스키마명.테이블명;",
        mssql:"SELECT\n  SUM(CASE WHEN 대상컬럼 <> LTRIM(RTRIM(대상컬럼)) THEN 1 ELSE 0 END) AS 앞뒤공백,\n  SUM(CASE WHEN CHARINDEX(N'　', 대상컬럼) > 0 THEN 1 ELSE 0 END)     AS 전각공백,\n  SUM(CASE WHEN CHARINDEX(CHAR(10), 대상컬럼) > 0 OR CHARINDEX(CHAR(13), 대상컬럼) > 0\n            OR CHARINDEX(CHAR(9), 대상컬럼) > 0 THEN 1 ELSE 0 END)    AS 개행_탭,\n  SUM(CASE WHEN PATINDEX('%[^0-9]%', 대상컬럼) > 0 THEN 1 ELSE 0 END) AS 비숫자_혼입,\n  SUM(CASE WHEN DATALENGTH(대상컬럼) <> LEN(대상컬럼) THEN 1 ELSE 0 END) AS 바이트_불일치\nFROM 스키마명.테이블명;\n-- 바이트_불일치: nvarchar 컬럼은 항상 2배라 무의미 — varchar 컬럼에서만 참고",
        sybase:"SELECT\n  SUM(CASE WHEN 대상컬럼 <> ltrim(rtrim(대상컬럼)) THEN 1 ELSE 0 END) AS 앞뒤공백,\n  SUM(CASE WHEN charindex('　', 대상컬럼) > 0 THEN 1 ELSE 0 END)      AS 전각공백,\n  SUM(CASE WHEN charindex(char(10), 대상컬럼) > 0 OR charindex(char(13), 대상컬럼) > 0\n            OR charindex(char(9), 대상컬럼) > 0 THEN 1 ELSE 0 END)    AS 개행_탭,\n  SUM(CASE WHEN patindex('%[^0-9]%', 대상컬럼) > 0 THEN 1 ELSE 0 END) AS 비숫자_혼입\nFROM 테이블명;"
      } },
    { title:'[정제] 오염 날짜 → YYYYMMDD 정규화 CASE (실사례: ISO·14자리·영문 혼재+절단)',
      q:{
        oracle:"SELECT 대상컬럼,\n       CASE\n         -- ISO (2018-09-18 ...): '-' 제거 후 앞 8자리\n         WHEN REGEXP_LIKE(대상컬럼, '^[0-9][0-9][0-9][0-9]-')\n              THEN SUBSTR(REPLACE(대상컬럼, '-', ''), 1, 8)\n         -- 슬래시 (2019/03/29 ...)\n         WHEN REGEXP_LIKE(대상컬럼, '^[0-9][0-9][0-9][0-9]/')\n              THEN SUBSTR(REPLACE(대상컬럼, '/', ''), 1, 8)\n         -- 영문 (Mar 29 2019 ...): Sybase CONVERT(varchar, getdate()) 기본 출력 흔적\n         WHEN REGEXP_LIKE(대상컬럼, '^[A-Za-z]')\n              THEN TO_CHAR(\n                     TO_DATE(REGEXP_SUBSTR(대상컬럼, '^[A-Za-z]+ +[0-9]+ +[0-9]+'),\n                             'Mon DD YYYY', 'NLS_DATE_LANGUAGE=AMERICAN'),\n                     'YYYYMMDD')\n         -- 8자리 이상 숫자 (20190329 / 20190329143020)\n         WHEN REGEXP_LIKE(대상컬럼, '^[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]')\n              THEN SUBSTR(대상컬럼, 1, 8)\n         -- 미지 포맷은 NULL로 드러낸다 — ELSE로 원값 통과시키면 쓰레기가 은폐됨\n         ELSE NULL\n       END AS 날짜_정규화\nFROM   스키마명.테이블명;\n-- Tibero 6 정규식 제약: (a|b) 교대·{n} 반복 금지 — JDBC-11042 (그래서 [0-9]를 풀어 씀)",
        mysql:"SELECT 대상컬럼,\n       CASE\n         WHEN 대상컬럼 REGEXP '^[0-9]{4}-'  THEN LEFT(REPLACE(대상컬럼, '-', ''), 8)\n         WHEN 대상컬럼 REGEXP '^[0-9]{4}/'  THEN LEFT(REPLACE(대상컬럼, '/', ''), 8)\n         WHEN 대상컬럼 REGEXP '^[A-Za-z]+ +[0-9]+ +[0-9]+'\n              THEN DATE_FORMAT(STR_TO_DATE(대상컬럼, '%b %d %Y'), '%Y%m%d')\n         WHEN 대상컬럼 REGEXP '^[0-9]{8}'   THEN LEFT(대상컬럼, 8)\n         ELSE NULL\n       END AS 날짜_정규화\nFROM   스키마명.테이블명;\n-- MySQL 5.7·8.0 · MariaDB 공통(REGEXP 연산자만 쓴다). STR_TO_DATE 는 앞의 「월 일 년」만 읽고 뒤 시각은 버린다. 실패는 NULL(에러 아님) — 검증 쿼리에서 걸러짐",
        pg:"SELECT 대상컬럼,\n       CASE\n         WHEN 대상컬럼 ~ '^[0-9]{4}-' THEN LEFT(REPLACE(대상컬럼, '-', ''), 8)\n         WHEN 대상컬럼 ~ '^[0-9]{4}/' THEN LEFT(REPLACE(대상컬럼, '/', ''), 8)\n         WHEN 대상컬럼 ~ '^[A-Za-z]'\n              THEN TO_CHAR(TO_DATE(SUBSTRING(대상컬럼 FROM '^[A-Za-z]+ +[0-9]+ +[0-9]+'),\n                                   'Mon DD YYYY'), 'YYYYMMDD')\n         WHEN 대상컬럼 ~ '^[0-9]{8}' THEN LEFT(대상컬럼, 8)\n         ELSE NULL\n       END AS 날짜_정규화\nFROM   스키마명.테이블명;\n-- ⚠ TO_DATE가 못 읽는 값이면 에러로 중단 — 1번 진단으로 포맷 전수 확인 후 실행",
        mssql:"SELECT 대상컬럼,\n       CASE\n         WHEN 대상컬럼 LIKE '[0-9][0-9][0-9][0-9]-%' THEN LEFT(REPLACE(대상컬럼, '-', ''), 8)\n         WHEN 대상컬럼 LIKE '[0-9][0-9][0-9][0-9]/%' THEN LEFT(REPLACE(대상컬럼, '/', ''), 8)\n         WHEN 대상컬럼 LIKE '[A-Za-z]%'\n              THEN CONVERT(varchar(8), TRY_CONVERT(date, LEFT(대상컬럼, 11)), 112)\n         WHEN 대상컬럼 LIKE '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]%' THEN LEFT(대상컬럼, 8)\n         ELSE NULL\n       END AS 날짜_정규화\nFROM   스키마명.테이블명;\n-- 'Mar 29 2019' 해석은 언어 설정 의존 — SET LANGUAGE us_english 후 실행\n-- TRY_CONVERT(2012+) 실패는 NULL 반환 → 검증 쿼리에서 걸러짐",
        sybase:"-- ⚠ ASE엔 TRY_CONVERT 없음 — convert 실패 시 배치 중단.\n--    반드시 1번 진단 쿼리로 포맷 전수 확인하고 WHEN을 맞춘 뒤 실행\nSELECT 대상컬럼,\n       CASE\n         WHEN 대상컬럼 LIKE '[0-9][0-9][0-9][0-9]-%'\n              THEN substring(str_replace(대상컬럼, '-', NULL), 1, 8)\n         WHEN 대상컬럼 LIKE '[A-Za-z]%'\n              THEN convert(varchar(8), convert(date, substring(대상컬럼, 1, 11)), 112)\n         WHEN 대상컬럼 LIKE '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]%'\n              THEN substring(대상컬럼, 1, 8)\n         ELSE NULL\n       END AS 날짜_정규화\nFROM   테이블명;\n-- str_replace 세 번째 인자 NULL = 해당 문자 삭제. 언어 설정 us_english 전제"
      } },
    { title:'[검증] 정규화 실패·비정상 월일 확인 — 0행이면 통과',
      q:{
        oracle:"-- 위 [정제] CASE를 서브쿼리에 붙여 실행\nSELECT 원값, 날짜_정규화\nFROM  (SELECT 대상컬럼 AS 원값,\n              CASE /* ← [정제] 항목의 CASE WHEN ~ END 통째로 붙여넣기 */ END AS 날짜_정규화\n       FROM   스키마명.테이블명) x\nWHERE  날짜_정규화 IS NULL\n   OR  SUBSTR(날짜_정규화, 5, 2) NOT BETWEEN '01' AND '12'\n   OR  SUBSTR(날짜_정규화, 7, 2) NOT BETWEEN '01' AND '31';\n-- 건수 대사: 전체 = 정규화 성공 + 이 쿼리 건수\n-- 윤년·월별 말일(0229, 0431)까지는 마지막에 TO_DATE(날짜_정규화, 'YYYYMMDD') 1회 실행으로 확인",
        mysql:"SELECT 원값, 날짜_정규화\nFROM  (SELECT 대상컬럼 AS 원값,\n              CASE /* ← [정제] 항목의 CASE WHEN ~ END 통째로 붙여넣기 */ END AS 날짜_정규화\n       FROM   스키마명.테이블명) x\nWHERE  날짜_정규화 IS NULL\n   OR  SUBSTR(날짜_정규화, 5, 2) NOT BETWEEN '01' AND '12'\n   OR  SUBSTR(날짜_정규화, 7, 2) NOT BETWEEN '01' AND '31';\n-- 윤년·말일까지: STR_TO_DATE(날짜_정규화, '%Y%m%d') IS NULL 조건 추가",
        pg:"SELECT 원값, 날짜_정규화\nFROM  (SELECT 대상컬럼 AS 원값,\n              CASE /* ← [정제] 항목의 CASE WHEN ~ END 통째로 붙여넣기 */ END AS 날짜_정규화\n       FROM   스키마명.테이블명) x\nWHERE  날짜_정규화 IS NULL\n   OR  SUBSTR(날짜_정규화, 5, 2) NOT BETWEEN '01' AND '12'\n   OR  SUBSTR(날짜_정규화, 7, 2) NOT BETWEEN '01' AND '31';",
        mssql:"SELECT 원값, 날짜_정규화\nFROM  (SELECT 대상컬럼 AS 원값,\n              CASE /* ← [정제] 항목의 CASE WHEN ~ END 통째로 붙여넣기 */ END AS 날짜_정규화\n       FROM   스키마명.테이블명) x\nWHERE  날짜_정규화 IS NULL\n   OR  SUBSTRING(날짜_정규화, 5, 2) NOT BETWEEN '01' AND '12'\n   OR  SUBSTRING(날짜_정규화, 7, 2) NOT BETWEEN '01' AND '31';\n-- 윤년·말일까지: TRY_CONVERT(date, 날짜_정규화, 112) IS NULL 조건 추가",
        sybase:"SELECT 원값, 날짜_정규화\nFROM  (SELECT 대상컬럼 AS 원값,\n              CASE /* ← [정제] 항목의 CASE WHEN ~ END 통째로 붙여넣기 */ END AS 날짜_정규화\n       FROM   테이블명) x\nWHERE  날짜_정규화 IS NULL\n   OR  substring(날짜_정규화, 5, 2) NOT BETWEEN '01' AND '12'\n   OR  substring(날짜_정규화, 7, 2) NOT BETWEEN '01' AND '31';"
      } },
    { title:'[진단] 코드값 분포·코드테이블 대사 (전 방언 공통)',
      q:{
        oracle:"-- 코드컬럼 분포 — 정의서에 없는 값, 표기 혼재('Y'/'y'/'1') 발견용\nSELECT 코드컬럼 AS 코드값, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 코드컬럼\nORDER  BY 건수 DESC;\n\n-- 공통코드 테이블과 대사 — 정의 안 된 코드값만 나옴\nSELECT d.코드컬럼, COUNT(*) AS 건수\nFROM   업무테이블 d\nWHERE  NOT EXISTS (SELECT 1 FROM 공통코드테이블 c\n                   WHERE  c.그룹코드 = '해당그룹' AND c.코드 = d.코드컬럼)\nGROUP  BY d.코드컬럼\nORDER  BY 건수 DESC;",
        mysql:"SELECT 코드컬럼 AS 코드값, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 코드컬럼\nORDER  BY 건수 DESC;\n\nSELECT d.코드컬럼, COUNT(*) AS 건수\nFROM   업무테이블 d\nWHERE  NOT EXISTS (SELECT 1 FROM 공통코드테이블 c\n                   WHERE  c.그룹코드 = '해당그룹' AND c.코드 = d.코드컬럼)\nGROUP  BY d.코드컬럼\nORDER  BY 건수 DESC;",
        pg:"SELECT 코드컬럼 AS 코드값, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 코드컬럼\nORDER  BY 건수 DESC;\n\nSELECT d.코드컬럼, COUNT(*) AS 건수\nFROM   업무테이블 d\nWHERE  NOT EXISTS (SELECT 1 FROM 공통코드테이블 c\n                   WHERE  c.그룹코드 = '해당그룹' AND c.코드 = d.코드컬럼)\nGROUP  BY d.코드컬럼\nORDER  BY 건수 DESC;",
        mssql:"SELECT 코드컬럼 AS 코드값, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 코드컬럼\nORDER  BY 건수 DESC;\n\nSELECT d.코드컬럼, COUNT(*) AS 건수\nFROM   업무테이블 d\nWHERE  NOT EXISTS (SELECT 1 FROM 공통코드테이블 c\n                   WHERE  c.그룹코드 = '해당그룹' AND c.코드 = d.코드컬럼)\nGROUP  BY d.코드컬럼\nORDER  BY 건수 DESC;",
        sybase:"SELECT 코드컬럼 AS 코드값, COUNT(*) AS 건수\nFROM   테이블명\nGROUP  BY 코드컬럼\nORDER  BY 건수 DESC;\n\nSELECT d.코드컬럼, COUNT(*) AS 건수\nFROM   업무테이블 d\nWHERE  NOT EXISTS (SELECT 1 FROM 공통코드테이블 c\n                   WHERE  c.그룹코드 = '해당그룹' AND c.코드 = d.코드컬럼)\nGROUP  BY d.코드컬럼\nORDER  BY 건수 DESC;"
      } }
  ],
  notes:[
    '순서 고정: 진단 → 정제 → 검증. 분포 진단 없이 짐작으로 CASE 쓰면 미지 포맷이 ELSE로 조용히 통과한다',
    'CASE의 ELSE는 반드시 NULL — ELSE SUBSTR(원값...) 식 원값 통과는 쓰레기를 은폐. NULL로 드러내고 검증 쿼리로 잡는다',
    '실전 사례(2026-07): VARCHAR(14) 날짜 컬럼에 ISO·14자리·영문(Mon DD YYYY) 3계열 혼재 + 전부 14자 절단. 영문형은 Sybase CONVERT(varchar, getdate()) 기본 출력 흔적(이관 레거시). 절단 탓에 시간 복원 불가 → 날짜 8자리만 신뢰',
    'Tibero 6 정규식 제약: 그룹 내 교대 (a|b) → JDBC-11042. {n} 반복도 피하고 [0-9]를 풀어 쓴다 (db_docs README 확인 사실)',

    '★ 진단 중 평문 주민번호 등 개인정보 발견 시 작업 중단·보고. 결과를 이 HTML·OneDrive에 저장 금지 (실데이터 금지 규칙)',
    '비숫자 혼입·멀티바이트 지표는 숫자·영숫자 성격 컬럼에서만 의미 — 한글 텍스트 컬럼이면 무시'

{
  key:'d91', no:'91', label:'ERD 리버스 엔지니어링용 DDL 추출 (ERwin)',
  sub:'제출 산출물이 아ERwin에 물리모델을 불러오기 위한 작업용 스크립트. 전체 스키마가 아니라 지정한 테이블 목록(수십~수백 개)만 골라 뽑는 것이 목적 — 방언마다 표준 도구가 달라 SQL로 안 되는 구간은 명령행 도구를 그대로 안내한다.',
  sql:[
    { title:'1단계 — 테이블 목록 지정 DDL 추출 (CREATE TABLE + 인라인 PK/UK/FK)',
      q:{
        oracle:"-- 세미콜론 종결자·들여쓰기 적용, STORAGE/TABLESPACE 절 제거(ERwin엔 노이즈)\nBEGIN\n  DBMS_METADATA.SET_TRANSFORM_PARAM(DBMS_METADATA.SESSION_TRANSFORM, 'SQLTERMINATOR', TRUE);\n  DBMS_METADATA.SET_TRANSFORM_PARAM(DBMS_METADATA.SESSION_TRANSFORM, 'PRETTY', TRUE);\n  DBMS_METADATA.SET_TRANSFORM_PARAM(DBMS_METADATA.SESSION_TRANSFORM, 'SEGMENT_ATTRIBUTES', FALSE);\n  DBMS_METADATA.SET_TRANSFORM_PARAM(DBMS_METADATA.SESSION_TRANSFORM, 'STORAGE', FALSE);\nEND;\n/\n\n-- SQL*Plus/SQLcl: CLOB 결과가 잘리지 않게 먼저 세팅\nSET LONG 1000000\nSET LONGCHUNKSIZE 1000000\nSET LINESIZE 32767\nSET PAGESIZE 0\nSET FEEDBACK OFF\nSET TRIMSPOOL ON\nSPOOL erwin_ddl.sql\n\n-- GET_DDL은 함수라 SELECT 안에 넣으면 됨 — IN 리스트로 한 번에 여러 테이블\nSELECT DBMS_METADATA.GET_DDL('TABLE', TABLE_NAME) AS DDL\nFROM   ALL_TABLES\nWHERE  OWNER IN __SCHEMAS__\n  AND  TABLE_NAME IN ('TABLE1','TABLE2','TABLE3')  \nORDER  BY TABLE_NAME;\n\nSPOOL OFF\n-- 결과에 그 테이블에 걸린 FK까지 인라인으로 포함됨. 주석(COMMENT)은 안 딸려옴 — 3단계 참고",
        mysql:"-- 배치 DDL 표준 도구는 mysqldump — CREATE TABLE + FK + 컬럼/테이블 COMMENT까지 한 번에 포함\nmysqldump -u 계정 -p --no-data --skip-add-drop-table \\\n  --tables TABLE1 TABLE2 TABLE3 \\\n  DB명 > erwin_ddl.sql   -- DB명은 위 스키마 입력칸 값으로 교체(mysqldump는 DB 1개 단위 — IN 리스트 자동반영 안 됨)\n-- 100개면 --tables 뒤에 공백구분으로 전부 나열 (나열 순서는 상관없음)\n\n-- mysqldump 실행 파일 반입이 막힌 폐쇄망이면 방언 특성상 배치 함수가 없어\n-- 아래로 테이블별 실행문 목록만 뽑아 하나씩 실행해 결과를 이어붙인다\nSELECT CONCAT('SHOW CREATE TABLE ', TABLE_NAME, ';') AS 실행할_문장\nFROM   information_schema.TABLES\nWHERE  TABLE_SCHEMA IN __SCHEMAS__\n  AND  TABLE_NAME IN ('table1','table2','table3')\nORDER  BY TABLE_NAME;",
        pg:"-- 배치 DDL 표준 도구는 pg_dump — CREATE TABLE + FK + COMMENT ON까지 기본 포함(--no-comments로 끌 수 있음)\npg_dump --schema-only \\\n  -t 스키마명.table1 -t 스키마명.table2 -t 스키마명.table3 \\\n  DB명 > erwin_ddl.sql   -- 스키마명·DB명은 위 스키마 입력칸 값으로 교체(커맨드라인이라 IN 리스트 자동반영 안 됨)\n-- 100개면 -t 옵션을 테이블 수만큼 반복 (예: -t '스키마명.접두사*' 와일드카드도 가능)\n\n-- pg_dump 실행 파일을 못 쓰면 카탈로그만으로는 CREATE TABLE 원문을 재구성해주는\n-- 내장 함수가 PG에 없음 — 이 경우는 pg_dump 반입/설치를 요청하는 편이 빠름",
        mssql:"-- MSSQL은 CREATE TABLE 원문을 돌려주는 T-SQL 함수가 없음 — SSMS 마법사가 표준 방법\n-- 1) SSMS 개체 탐색기 → DB 우클릭 → 작업 → 스크립트 생성\n-- 2) '특정 데이터베이스 개체 선택' → 테이블 100개 체크 (아래 쿼리로 대상 목록 뽑아 대조)\n-- 3) 고급 옵션에서 반드시 켤 것:\n--    · 외래 키 스크립트 생성 = True\n--    · 인덱스 스크립트 생성 = True\n--    · 확장 속성 스크립트 생성 = True   ← 꺼져 있으면 컬럼/테이블 코멘트 누락\n\n-- 마법사 '테이블 선택' 화면에 대조할 대상 목록\nSELECT s.name AS 스키마, t.name AS 테이블명\nFROM   sys.tables t JOIN sys.schemas s ON t.schema_id = s.schema_id\nWHERE  s.name IN __SCHEMAS__\n  AND  t.name IN ('TABLE1','TABLE2','TABLE3')\nORDER  BY t.name;",
        sybase:"-- ASE도 CREATE TABLE 원문을 돌려주는 SQL 함수가 없음 — ddlgen 유틸리티(ASE 설치본 동봉)가 표준 방법\n-- $SYBASE/ASE-*/bin/ddlgen 예시 — 정확한 옵션은 사내 ASE 버전 매뉴얼로 재확인 (db_docs 미수집 영역)\nddlgen -U 계정 -P 비번 -S 서버명 -D DB명 -T TABLE \\\n  -N \"TABLE1,TABLE2,TABLE3\" -O erwin_ddl.sql\n-- 코멘트(한글명)는 ASE 자체에 저장 개념이 없어 이 방법으로도 안 나옴 — 설계서 수기\n\n-- 유틸리티 접근이 안 되면 최소한 테이블 존재만 확인\nSELECT o.name AS 테이블명\nFROM   sysobjects o\nWHERE  o.type = 'U' AND o.name IN ('TABLE1','TABLE2','TABLE3')\nORDER  BY o.name;"
      } },
    { title:'2단계 — FK가 참조하는데 목록 밖에 있는 부모테이블 확인 (관계선 끊김 방지)',
      q:{
        oracle:"SELECT DISTINCT B.TABLE_NAME AS 빠진부모테이블\nFROM   ALL_CONSTRAINTS A, ALL_CONSTRAINTS B\nWHERE  A.R_CONSTRAINT_NAME = B.CONSTRAINT_NAME\n  AND  A.R_OWNER = B.OWNER\n  AND  A.OWNER IN __SCHEMAS__\n  AND  A.CONSTRAINT_TYPE = 'R'\n  AND  A.TABLE_NAME IN ('TABLE1','TABLE2','TABLE3')\n  AND  B.TABLE_NAME NOT IN ('TABLE1','TABLE2','TABLE3');\n-- 나오면 그 테이블을 목록에 추가하고 1단계 다시 실행",
        mysql:"SELECT DISTINCT k.REFERENCED_TABLE_NAME AS 빠진부모테이블\nFROM   information_schema.KEY_COLUMN_USAGE k\nWHERE  k.TABLE_SCHEMA IN __SCHEMAS__\n  AND  k.REFERENCED_TABLE_NAME IS NOT NULL\n  AND  k.TABLE_NAME IN ('table1','table2','table3')\n  AND  k.REFERENCED_TABLE_NAME NOT IN ('table1','table2','table3');",
        pg:"SELECT DISTINCT pc.relname AS 빠진부모테이블\nFROM   pg_constraint con\n       JOIN pg_class cc ON con.conrelid = cc.oid\n       JOIN pg_namespace cn ON cc.relnamespace = cn.oid\n       JOIN pg_class pc ON con.confrelid = pc.oid\nWHERE  con.contype = 'f'\n  AND  cn.nspname IN __SCHEMAS__\n  AND  cc.relname IN ('table1','table2','table3')\n  AND  pc.relname NOT IN ('table1','table2','table3');",
        mssql:"SELECT DISTINCT pt.name AS 빠진부모테이블\nFROM   sys.foreign_keys fk\n       JOIN sys.tables ct ON fk.parent_object_id = ct.object_id\n       JOIN sys.schemas s ON ct.schema_id = s.schema_id\n       JOIN sys.tables pt ON fk.referenced_object_id = pt.object_id\nWHERE  s.name IN __SCHEMAS__\n  AND  ct.name IN ('TABLE1','TABLE2','TABLE3')\n  AND  pt.name NOT IN ('TABLE1','TABLE2','TABLE3');",
        sybase:"SELECT DISTINCT object_name(r.reftabid) AS 빠진부모테이블\nFROM   sysreferences r\nWHERE  object_name(r.tableid) IN ('TABLE1','TABLE2','TABLE3')\n  AND  object_name(r.reftabid) NOT IN ('TABLE1','TABLE2','TABLE3');"
      } },
    { title:'3단계 — [Oracle 전용] 주석을 COMMENT ON 문으로 뽑아 DDL 뒤에 이어붙이기',
      q:{
        oracle:"SELECT 'COMMENT ON TABLE '||TABLE_NAME||' IS '''||REPLACE(COMMENTS,'''','''''')||''';' AS DDL\nFROM   ALL_TAB_COMMENTS\nWHERE  OWNER IN __SCHEMAS__ AND TABLE_NAME IN ('TABLE1','TABLE2','TABLE3') AND COMMENTS IS NOT NULL\nUNION ALL\nSELECT 'COMMENT ON COLUMN '||TABLE_NAME||'.'||COLUMN_NAME||' IS '''||REPLACE(COMMENTS,'''','''''')||''';'\nFROM   ALL_COL_COMMENTS\nWHERE  OWNER IN __SCHEMAS__ AND TABLE_NAME IN ('TABLE1','TABLE2','TABLE3') AND COMMENTS IS NOT NULL;\n-- 위 1단계 SPOOL 파일 맨 뒤에 이 결과를 이어붙인다",
        mysql:"-- 해당 없음 — mysqldump/SHOW CREATE TABLE 결과에 COMMENT='...' 절로 이미 포함됨",
        pg:"-- 해당 없음 — pg_dump 기본 옵션에 COMMENT ON 문이 이미 포함됨 (--no-comments를 주지 않았는지만 확인)",
        mssql:"-- 조건부 해당 없음 — SSMS 마법사에서 '확장 속성 스크립트 생성=True'를 켰을 때만 포함됨.\n-- 꺼진 채 뽑았으면 1단계 고급 옵션을 다시 켜고 재실행",
        sybase:"-- 해당 없음 — ASE는 테이블/컬럼 코멘트 저장 개념 자체가 없음(엔진 한계). 논리명은 설계서에서 수기로만 관리"
      } }
  ],
  notes:[
    '제출용 문서는 04번(테이블 관계 정의서)을 쓴다 — 이 부록은 그걸 대신하지 않는다',
    'ERwin 임포트: Tools → Reverse Engineer → Script에 위에서 뽑은 .sql을 붙여넣는다(폐쇄망 dump-and-paste). ODBC 직결 가능한 환경이면 Reverse Engineer → ODBC로 카탈로그를 직접 읽는 쪽이 코멘트·인덱스까지 자동으로 더 정확하다',
    '코멘트(COMMENT)는 ERwin에서 Comment 속성으로만 들어가지 Logical Name으로 자동 매핑되지 않는다 — 논리명은 논리명_변환기.html로 물리명→논리명 사전을 입혀 별도로 반영한다',
    'mysqldump·pg_dump·ddlgen은 SQL이 아니라 클라이언트 명령행 도구 — 폐쇄망 반입 정책상 실행 파일이 막혀 있으면 접속 서버에서 직접 돌리거나 DBA에게 요청',
    '100개 안팎 테이블 목록은 위 SQL 블록의 편집 버튼을 눌러 IN (...) 자리를 직접 교체해서 쓴다',
    '상단 "작성자" 입력칸은 02·03의 최종수정자 열에 그대로 들어간다 — 비우면 __작성자_미입력__ 으로 나가고 쿼리 상단에 경고가 붙는다. 스키마 칸과 달리 Sybase에서도 활성',
    'SQL 블록(1단계 Oracle·MSSQL 대상목록, 2·3단계 전체)은 상단 "업무 스키마" 입력칸 값을 다른 산출물 문서와 동일하게 자동 반영한다 — mysqldump·pg_dump 커맨드라인은 텍스트라 DB명·스키마명을 직접 교체해야 한다. Sybase는 스키마 개념이 없어 입력칸이 비활성화된다',
    '2단계는 목록에 넣은 테이블을 참조하는 FK만 잡는다 — 참조하는 쪽(자식)이 목록 밖에 있으면 안 걸리니 반대 방향 관계도 있는지 04번 문서로 한 번 더 확인'
  ]
}
];

function hashParts(){
  var raw = (location.hash || '').replace('#','').trim().split(':');
  var doc = /^d\d{2}$/.test(raw[0]) ? raw[0] : '';
  var db  = raw[1] || '';
  return { doc: doc, db: db };
}
function hashKey(){ return hashParts().doc; }
function hashDialect(){
  var db = hashParts().db;
  return DIALECTS.some(function(x){ return x.key === db; }) ? db : '';
}
var currentKey = hashKey() || localStorage.getItem('deliv_lastdoc') || 'd00';
var currentDialect = hashDialect() || localStorage.getItem('deliv_dialect') || 'oracle';
if (!DIALECTS.some(function(x){ return x.key === currentDialect; })) currentDialect = 'oracle';  
var editMode = {};    
var editBuffer = {};  
var docUse = {};   
try { docUse = JSON.parse(localStorage.getItem('deliv_use') || '{}') || {}; } catch(e) {}

var schemaInput = document.getElementById('schemas');
schemaInput.value = localStorage.getItem('deliv_schemas') || '';
function schemaNames() {
  return schemaInput.value.split(',').map(function(s){
    return s.trim().replace(/^["`[]|["`\]]$/g, '').trim().replace(/'/g, "''");
  }).filter(Boolean);
}
function schemaMissing() { return schemaNames().length === 0; }
function schemaList() {
  var arr = schemaNames();
  if (!arr.length) arr = ['__스키마_미입력__'];   
  return "('" + arr.join("', '") + "')";
}
function onSchemaChange() {
  localStorage.setItem('deliv_schemas', schemaInput.value);
  render();
}

var authorInput = document.getElementById('author');
authorInput.value = localStorage.getItem('deliv_author') || '';
function authorMissing() { return !authorInput.value.trim(); }
function authorLit() {
  var v = authorInput.value.trim();
  if (!v) v = '__작성자_미입력__';   
  return "'" + v.replace(/'/g, "''") + "'";
}
function onAuthorChange() {
  localStorage.setItem('deliv_author', authorInput.value);
  render();
}

var exclCfg; 
try { exclCfg = JSON.parse(localStorage.getItem('deliv_excl') || ''); } catch(e) {}
if (!exclCfg || typeof exclCfg !== 'object') exclCfg = {on:true, bak:true, date:true, test:false, pfx:''};
function saveExcl() {
  localStorage.setItem('deliv_excl', JSON.stringify(exclCfg));
  syncExclUI();
  render();
}
function syncExclUI() {
  document.getElementById('excl_on').checked = exclCfg.on;
  document.getElementById('excl_detail').style.display = exclCfg.on ? '' : 'none';
  document.getElementById('excl_bak').checked = exclCfg.bak;
  document.getElementById('excl_date').checked = exclCfg.date;
  document.getElementById('excl_test').checked = exclCfg.test;
  document.getElementById('excl_pfx').value = exclCfg.pfx;
}
function exclPrefixes() {
  return exclCfg.pfx.split(',').map(function(s){ return s.trim().replace(/'/g, "''").toUpperCase(); }).filter(Boolean);
}
function exclConds(col) {
  var d = currentDialect, c = [];
  var U = 'UPPER(' + col + ')';
  function likeEsc(pat) {   
    if (d === 'mssql' || d === 'sybase') return U + " LIKE '" + pat.replace(/_/g, '[_]') + "'";
    if (d === 'oracle') return U + " LIKE '" + pat.replace(/_/g, '\\_') + "' ESCAPE '\\'";
    return U + " LIKE '" + pat.replace(/_/g, '!_') + "' ESCAPE '!'";   
  }
  if (exclCfg.bak) { c.push(likeEsc('%_BAK')); c.push(likeEsc('%_BAK_%')); }
  if (exclCfg.date) {
    if (d === 'oracle') {        
      c.push("REGEXP_LIKE(" + col + ", '_[0-9]{6,}')");
      c.push("REGEXP_LIKE(" + col + ", '_(19|20)[0-9]{2,}(_|$)')");
    } else if (d === 'mysql') {
      c.push(col + " REGEXP '_[0-9]{6,}'");
      c.push(col + " REGEXP '_(19|20)[0-9]{2,}(_|$)'");
    } else if (d === 'pg') {
      c.push(col + " ~ '_[0-9]{6,}'");
      c.push(col + " ~ '_(19|20)[0-9]{2,}(_|$)'");
    } else {                     
      c.push(col + " LIKE '%[_][0-9][0-9][0-9][0-9][0-9][0-9]%'");
      c.push(col + " LIKE '%[_]19[0-9][0-9]'");
      c.push(col + " LIKE '%[_]20[0-9][0-9]'");
      c.push(col + " LIKE '%[_]19[0-9][0-9][_]%'");
      c.push(col + " LIKE '%[_]20[0-9][0-9][_]%'");
      c.push(col + " LIKE '%[_]19[0-9][0-9][0-9]%'");
      c.push(col + " LIKE '%[_]20[0-9][0-9][0-9]%'");
    }
  }
  if (exclCfg.test) c.push(U + " LIKE '%TEST%'");
  exclPrefixes().forEach(function(p){ c.push(likeEsc(p + '%')); });
  return c;
}
function exclBlock(col, inline) {
  if (!exclCfg.on) return '';
  var conds = exclConds(col);
  if (!conds.length) return '';
  if (inline) return ' AND NOT (' + conds.join(' OR ') + ')';
  return '\n  AND NOT (   ' + conds.join('\n           OR ') + ' )';
}
var EXCL_CHECK = {
  oracle: { sel:'OWNER, TABLE_NAME', from:'ALL_TABLES',
            where:'OWNER IN __SCHEMAS__', col:'TABLE_NAME' },
  mysql:  { sel:'TABLE_SCHEMA, TABLE_NAME', from:'information_schema.TABLES',
            where:"TABLE_SCHEMA IN __SCHEMAS__ AND TABLE_TYPE = 'BASE TABLE'", col:'TABLE_NAME' },
  pg:     { sel:'schemaname, tablename', from:'pg_tables',
            where:'schemaname IN __SCHEMAS__', col:'tablename' },
  mssql:  { sel:'s.name, t.name', from:'sys.tables t JOIN sys.schemas s ON t.schema_id = s.schema_id',
            where:'s.name IN __SCHEMAS__', col:'t.name' },
  sybase: { sel:'o.name', from:'sysobjects o', where:"o.type = 'U'", col:'o.name' }
};
function copyExclCheck() {
  var m = EXCL_CHECK[currentDialect];
  var conds = exclConds(m.col);
  var q;
  if (!exclCfg.on || !conds.length) {
    q = '-- 제외 조건 없음 — 상단 필터 체크박스를 켜고 세부 항목을 선택할 것';
  } else {
    q = '-- 제외될(임시/백업 의심) 테이블 목록 — 정상 테이블이 섞였는지 눈으로 검증 후 산출물 추출\n'
      + 'SELECT ' + m.sel + '\nFROM   ' + m.from
      + '\nWHERE  ' + m.where.replace(/__SCHEMAS__/g, schemaList())
      + '\n  AND (   ' + conds.join('\n       OR ') + ' )'
      + '\nORDER  BY ' + m.sel + ';';
  }
  copyText(q, '제외 목록 확인쿼리 복사됨');
}
function syncSchemaInputState() {
  var off = (currentDialect === 'sybase');
  schemaInput.disabled = off;
  schemaInput.style.opacity = off ? '0.45' : '';
  schemaInput.placeholder = off ? 'Sybase ASE: 미사용 (USE DB명으로 전환)' : 'SCHEMA_A,SCHEMA_B';
}
function switchDialect(k) {
  currentDialect = k;
  editMode = {};
  editBuffer = {};
  localStorage.setItem('deliv_dialect', k);
  syncSchemaInputState();
  renderTabs();
  render();
}

var tabsWrap = document.getElementById('db_tabs');
DIALECTS.forEach(function(d) {
  var t = document.createElement('div');
  t.className = 'db-tab ' + d.cls;
  t.id = 'tab_' + d.key;
  t.textContent = d.label;
  t.title = d.hint;
  t.onclick = function(){ switchDialect(d.key); };
  tabsWrap.appendChild(t);
});
function renderTabs() {
  DIALECTS.forEach(function(d) {
    var el = document.getElementById('tab_' + d.key);
    el.className = 'db-tab ' + d.cls + (d.key === currentDialect ? ' active' : '');
  });
}

DOCS.sort(function(a, b) { return a.no.localeCompare(b.no); });   

var sidebar = document.getElementById('sidebar');
function groupOf(no) {
  if (no >= '90') return '부록';
  if (no <= '04') return '준비 · 구조';
  if (no <= '08') return '표준화';
  if (no === '09') return '연계';
  return '추가 산출물';
}
function renderSidebar() {
  sidebar.innerHTML = '';
  var lastGroup = null;
  DOCS.forEach(function(d) {
    var g = groupOf(d.no);
    if (g !== lastGroup) {   
      var h = document.createElement('div'); h.className = 'sidebar-group'; h.textContent = g; sidebar.appendChild(h); lastGroup = g;
    }
    var b = document.createElement('div');   
    b.className = 'doc-btn' + (docUse[d.key] ? ' used' : ' unused') + (d.key === currentKey ? ' active' : '');
    b.id = 'btn_' + d.key;
    b.innerHTML = '<input type="checkbox" class="doc-chk"' + (docUse[d.key] ? ' checked' : '')
                + ' onclick="toggleUse(event,\'' + d.key + '\')" title="산출물 낼 것으로 표시">'
                + '<span class="doc-txt"><span class="no">' + d.no + '</span>' + d.label + '</span>';
    b.onclick = function() { currentKey = d.key; editMode = {}; editBuffer = {}; localStorage.setItem('deliv_lastdoc', d.key); render(); };
    sidebar.appendChild(b);
  });
}
function toggleUse(e, key) {
  e.stopPropagation();   
  docUse[key] = !docUse[key];
  localStorage.setItem('deliv_use', JSON.stringify(docUse));
  renderSidebar();
}
renderSidebar();

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function buildQuery(raw) {
  var q = raw.replace(/__SCHEMAS__/g, schemaList());
  q = q.replace(/__AUTHOR__/g, authorLit());
  var hadExcl = false;
  q = q.replace(/__EXCLI\(([^)]+)\)__/g, function(_, col){ var b = exclBlock(col, true);  if (b) hadExcl = true; return b; });
  q = q.replace(/__EXCL\(([^)]+)\)__/g,  function(_, col){ var b = exclBlock(col, false); if (b) hadExcl = true; return b; });
  if (hadExcl) {
    var warn = '-- ⚠ 임시/백업 테이블 제외 필터 적용됨 (상단 체크박스) — 02·03 동일 적용해야 건수 정합\n'
             + '--    산출물 추출 전 "제외 목록 확인쿼리"로 오탐(정상 테이블 걸림) 검증할 것\n';
    if (currentDialect === 'mssql' || currentDialect === 'sybase') {
      warn += '--    이 방언은 정규식 미지원 — LIKE 근사라 일부 패턴(_2024A 등) 누락 가능\n';
    }
    if (exclCfg.test) {
      warn += "--    TEST 포함 제외 켜짐 — LATEST 등 정상 이름도 걸릴 수 있음 (확인쿼리 필수)\n";
    }
    q = warn + q;
  }
  if (raw.indexOf('__SCHEMAS__') >= 0 && schemaMissing() && currentDialect !== 'sybase') {
    q = '-- ⚠ 상단 "업무 스키마" 입력칸이 비어 있음 — 그대로 실행하면 0행만 나옵니다\n'
      + '--    00번 문서의 스키마 분포 쿼리로 먼저 확인할 것\n' + q;
  }
  if (raw.indexOf('__AUTHOR__') >= 0 && authorMissing()) {
    q = '-- ⚠ 상단 "작성자" 입력칸이 비어 있음 — 최종수정자 열이 __작성자_미입력__ 으로 나갑니다\n' + q;
  }
  return q;
}
function dialectObj() { return DIALECTS.filter(function(x){return x.key === currentDialect;})[0]; }

window.addEventListener('hashchange', function(){
  var k = hashKey(), db = hashDialect(), hit = false;
  if (k && k !== currentKey && DOCS.some(function(x){return x.key === k;})) {
    currentKey = k; localStorage.setItem('deliv_lastdoc', k); hit = true;
  }
  if (db && db !== currentDialect) {
    currentDialect = db; localStorage.setItem('deliv_dialect', db);
    syncSchemaInputState(); renderTabs(); hit = true;
  }
  if (hit) { editMode = {}; editBuffer = {}; render(); }
});

function render() {
  renderSidebar();
  var d = DOCS.filter(function(x){return x.key === currentKey;})[0];
  if (!d) {  
    currentKey = DOCS[0].key;
    localStorage.setItem('deliv_lastdoc', currentKey);
    d = DOCS[0];
  }
  var dl = dialectObj();
  var h = '<h2>' + d.no + ' ' + d.label + '</h2>'
        + '<div class="doc-sub">' + d.sub + '<br>[' + dl.label + '] ' + dl.hint + '</div>';

  if (d.formCols) {
    h += '<div class="sec"><div class="sec-title">권장 열 구성 (참고 — 환경별 가감)</div>'
       + '<div class="form-cols">' + d.formCols + '</div>'
       + '<div class="form-note">열이 다르면 아래 쿼리를 편집 모드로 열어 SELECT 목록만 가감하면 됨.</div></div>';
  }

  h += '<div class="sec"><div class="sec-title">SQL — ' + dl.label + '</div>';
  d.sql.forEach(function(s, i) {
    var id = d.key + '_' + i;
    var raw = s.q[currentDialect];
    var missing = !raw;
    var q = missing ? '-- 이 방언 버전 미작성 — 편집 모드에서 직접 작성하거나 다른 방언 참고' : buildQuery(raw);
    h += '<div class="sql-block"><div class="sql-head">'
       + '<span class="sql-title">' + s.title + '</span>'
       + '<button class="btn-copy" onclick="copyQ(\'' + id + '\')">복사</button>'
       + '<button class="btn-edit' + (editMode[id] ? ' on' : '') + '" onclick="toggleEdit(\'' + id + '\')">' + (editMode[id] ? '편집 중' : '편집') + '</button>'
       + '</div>';
    if (editMode[id]) {
      var val = (editBuffer[id] !== undefined) ? editBuffer[id] : q;   
      h += '<textarea class="q" id="q_' + id + '" rows="' + (val.split('\n').length + 1) + '" oninput="bufQ(\'' + id + '\', this.value)">' + esc(val) + '</textarea>';
    } else {
      h += '<pre class="q' + (missing ? ' missing' : '') + '" id="q_' + id + '">' + esc(q) + '</pre>';
    }
    h += '</div>';
  });
  h += '</div>';

  if (d.manual) {
    h += '<div class="sec"><div class="sec-title">수기 잔여 / 기입 규칙</div><ul class="plain">';
    d.manual.forEach(function(m){ h += '<li>' + m + '</li>'; });
    h += '</ul></div>';
  }
  if (d.notes) {
    h += '<div class="sec"><div class="sec-title">주의 / 팁</div><ul class="plain">';
    d.notes.forEach(function(m){ h += '<li>' + m + '</li>'; });
    h += '</ul></div>';
  }
  document.getElementById('content').innerHTML = h;
}

function bufQ(id, v) { editBuffer[id] = v; }

function toggleEdit(id) {
  if (editMode[id]) { delete editMode[id]; delete editBuffer[id]; } else { editMode[id] = true; }
  var scroll = document.getElementById('content').scrollTop;
  render();
  document.getElementById('content').scrollTop = scroll;
}

function copyText(text, okMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, function(){ copyTextFallback(text, okMsg); });
  } else {
    copyTextFallback(text, okMsg);
  }
}
function copyTextFallback(text, okMsg) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
  document.body.removeChild(ta);
  toast(ok ? okMsg : '복사 실패 — 쿼리를 직접 선택해 복사할 것');
}
function copyQ(id) {
  var el = document.getElementById('q_' + id);
  var text = (el.tagName === 'TEXTAREA') ? el.value : el.textContent;
  copyText(text, '복사됨');
}

var toastTimer;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.opacity = '0'; }, 1500);
}

syncSchemaInputState();
syncExclUI();
renderTabs();
render();
</script>
</body>
</html>
