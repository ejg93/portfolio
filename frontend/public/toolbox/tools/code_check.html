<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 검사</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --bg:#1e1e1e; --surface:#252526; --border:#3c3c3c; --text:#d4d4d4; --muted:#858585; --accent:#0078d4; --green:#16825d; --red:#f44747; --yel:#d7ba7d; }
body { font-family:'Consolas','D2Coding',monospace; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:12px; }
header { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:14px; flex-shrink:0; flex-wrap:wrap; }
header h1 { font-size:13px; color:#ccc; letter-spacing:2px; }
.opt { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
select, input[type=text] { background:#3c3c3c; border:1px solid #555; border-radius:3px; color:var(--text); font-family:'Consolas','D2Coding',monospace; font-size:12px; padding:4px 6px; outline:none; }
input[type=checkbox] { accent-color:var(--accent); }
button { font-family:'Consolas',monospace; font-size:12px; border:none; border-radius:4px; cursor:pointer; padding:6px 14px; letter-spacing:1px; }
button:hover { opacity:.85; }
.btn-p { background:var(--accent); color:#fff; font-weight:bold; }
.btn-g { background:#3c3c3c; color:var(--text); }
.btn-green { background:var(--green); color:#fff; }
.top { display:flex; gap:12px; padding:12px 14px 0; height:45%; min-height:200px; }
.col { flex:1; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.label { font-size:10px; color:var(--muted); letter-spacing:2px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
textarea { flex:1; background:#111; border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:'Consolas','D2Coding',monospace; font-size:12px; padding:10px; resize:none; outline:none; line-height:1.5; white-space:pre; }
#rules { flex:1; overflow:auto; background:#111; border:1px solid var(--border); border-radius:4px; padding:8px 10px; }
#rules .grp { margin-bottom:6px; }
#rules .ghead { display:flex; align-items:center; gap:6px; cursor:pointer; color:#ccc; }
#rules .ghead .n { color:var(--muted); font-size:10px; }
#rules .rlist { display:none; padding:4px 0 2px 22px; }
#rules .grp.open .rlist { display:block; }
#rules .rule { display:flex; align-items:center; gap:6px; padding:2px 0; }
#rules .rule .id { min-width:190px; }
#rules .rule .sev { width:40px; color:var(--muted); font-size:10px; }
#rules .rule .msg { color:var(--muted); font-size:10px; }
.bottom { flex:1; display:flex; flex-direction:column; gap:6px; padding:10px 14px 12px; overflow:hidden; }
.bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
#result { flex:1; overflow:auto; border:1px solid var(--border); border-radius:4px; }
table { border-collapse:collapse; font-size:12px; width:100%; }
th, td { border:1px solid var(--border); padding:3px 6px; text-align:left; white-space:nowrap; }
th { background:var(--surface); color:var(--muted); position:sticky; top:0; }
td.error { color:var(--red); }
td.warn { color:var(--yel); }
#count, #msg { color:var(--muted); }
#msg.ok { color:var(--green); }
.note { font-size:10px; color:var(--muted); padding:0 16px 8px; }
</style>
</head>
<body>
<header>
	<h1>코드 검사</h1>
	<span class="opt">붙여 넣은 소스를 정규식 규칙 묶음(공통 잔재·JSP·TSX·JS·보안약점)으로 훑어 걸린 줄 목록을 낸다</span>
</header>
<div class="top">
	<div class="col">
		<div class="label"><span>소스</span>
			<span class="opt">언어 <select id="lang">
				<option value="java">Java</option><option value="jsp">JSP</option><option value="js">JS</option><option value="ts">TS</option>
				<option value="tsx">TSX</option><option value="xml">XML</option><option value="html">HTML</option><option value="properties">properties</option>
			</select> <button class="btn-p" id="run">검사</button></span></div>
		<textarea id="src" spellcheck="false" placeholder="검사할 소스를 붙여 넣는다"></textarea>
	</div>
	<div class="col">
		<div class="label"><span>규칙 — 묶음을 누르면 펼친다</span></div>
		<div id="rules"></div>
	</div>
</div>
<div class="bottom">
	<div class="bar">
		<span class="opt">등급 <select id="fSev"><option value="">전체</option><option value="error">error</option><option value="warn">warn</option><option value="info">info</option></select></span>
		<span class="opt">묶음 <select id="fGroup"><option value="">전체</option></select></span>
		<button class="btn-green" id="copy">복사</button>
		<span id="count"></span>
		<span id="msg"></span>
	</div>
	<div id="result"></div>
</div>
<div class="note">결과는 화면에만 둔다. 규칙을 켜고 끈 상태만 이 브라우저에 남는다</div>
<script>

	{"flags":["i"],"group":"a11y","id":"a11y.activeX","langs":["jsp","jspf","tag","html","htm","js"],"max":null,"message":"웹 표준 — ActiveX(플러그인 없이)","regex":"\\bActiveXObject\\b|\\bclassid\\s*=\\s*[\"']clsid:","severity":"warn","skipComments":true}
];
var GROUPS = [['common', 'ㄱ 공통 잔재'], ['jsp', 'ㄹ JSP'], ['tsx', 'ㅁ TSX·JS'], ['security', 'ㅇ 보안약점'], ['a11y', 'ㅈ 웹 접근성·표준']];
var STORE = 'codeCheck.rules';
var state = { groups: {}, rules: {} };
var found = [];

function $(id) { return document.getElementById(id); }

function load() {
	try {
		var v = JSON.parse(localStorage.getItem(STORE) || '{}');
		if (v && typeof v === 'object') {
			state.groups = v.groups && typeof v.groups === 'object' ? v.groups : {};
			state.rules = v.rules && typeof v.rules === 'object' ? v.rules : {};
		}
	} catch (e) {
		state = { groups: {}, rules: {} };
	}
}

function save() {
	try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
}

function groupOn(g) { return state.groups[g] !== false; }
function ruleOn(id) { return state.rules[id] !== false; }

function groupName(g) {
	for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i][0] === g) return GROUPS[i][1];
	return g;
}

function renderRules() {
	var box = $('rules');
	box.textContent = '';
	GROUPS.forEach(function (g) {
		var mine = RULES.filter(function (r) { return r.group === g[0]; });
		var wrap = document.createElement('div');
		wrap.className = 'grp';
		var head = document.createElement('div');
		head.className = 'ghead';
		var cb = document.createElement('input');
		cb.type = 'checkbox';
		cb.checked = groupOn(g[0]);
		cb.onclick = function (ev) { ev.stopPropagation(); state.groups[g[0]] = cb.checked; save(); };
		var name = document.createElement('span');
		name.textContent = g[1];
		var n = document.createElement('span');
		n.className = 'n';
		n.textContent = '규칙 ' + mine.length;
		head.appendChild(cb);
		head.appendChild(name);
		head.appendChild(n);
		head.onclick = function () { wrap.className = wrap.className === 'grp' ? 'grp open' : 'grp'; };
		wrap.appendChild(head);
		var list = document.createElement('div');
		list.className = 'rlist';
		mine.forEach(function (r) {
			var row = document.createElement('label');
			row.className = 'rule';
			var rc = document.createElement('input');
			rc.type = 'checkbox';
			rc.checked = ruleOn(r.id);
			rc.onchange = function () { state.rules[r.id] = rc.checked; save(); };
			var id = document.createElement('span');
			id.className = 'id';
			id.textContent = r.id;
			var sev = document.createElement('span');
			sev.className = 'sev';
			sev.textContent = r.severity;
			var msg = document.createElement('span');
			msg.className = 'msg';
			msg.textContent = r.message;
			row.appendChild(rc);
			row.appendChild(id);
			row.appendChild(sev);
			row.appendChild(msg);
			list.appendChild(row);
		});
		wrap.appendChild(list);
		box.appendChild(wrap);
	});
}

function cLike(s, slashes) {
	var out = [];
	var quote = '';
	var i = 0;
	var n = s.length;
	while (i < n) {
		var c = s.charAt(i);
		var nx = i + 1 < n ? s.charAt(i + 1) : '';
		if (quote) {
			out.push(c);
			if (slashes && c === '\\' && nx !== '') { out.push(nx); i += 2; continue; }
			if (c === quote || (c === '\n' && quote !== '`')) quote = '';
			i++;
		} else if (c === '"' || c === "'" || (c === '`' && slashes)) {
			quote = c;
			out.push(c);
			i++;
		} else if ((slashes && c === '/' && nx === '/') || (!slashes && c === '-' && nx === '-')) {
			while (i < n && s.charAt(i) !== '\n') { out.push(' '); i++; }
		} else if (c === '/' && nx === '*') {
			var e = s.indexOf('*' + '/', i + 2);
			var end = e < 0 ? n : e + 2;
			for (; i < end; i++) out.push(s.charAt(i) === '\n' ? '\n' : ' ');
		} else {
			out.push(c);
			i++;
		}
	}
	return out.join('');
}

function blank(s, open, close) {
	var a = s.split('');
	var from = 0;
	var o;
	while ((o = s.indexOf(open, from)) >= 0) {
		var e = s.indexOf(close, o + open.length);
		var end = e < 0 ? s.length : e + close.length;
		for (var i = o; i < end; i++) if (a[i] !== '\n') a[i] = ' ';
		from = end;
	}
	return a.join('');
}

function lineMarks(s, marks) {
	return s.split('\n').map(function (line) {
		var t = line.replace(/^\s+/, '');
		return t && marks.indexOf(t.charAt(0)) >= 0 ? new Array(line.length + 1).join(' ') : line;
	}).join('\n');
}

var OPEN_JSP = '<' + '%--';
var CLOSE_JSP = '--' + '%>';
var OPEN_ML = '<' + '!--';
var CLOSE_ML = '--' + '>';

function stripComments(text, lang) {
	switch (lang) {
		case 'java': case 'js': case 'jsx': case 'ts': case 'tsx': case 'mjs': return cLike(text, true);
		case 'sql': return cLike(text, false);
		case 'jsp': case 'jspf': case 'tag': return blank(blank(text, OPEN_JSP, CLOSE_JSP), OPEN_ML, CLOSE_ML);
		case 'xml': case 'html': case 'htm': return blank(text, OPEN_ML, CLOSE_ML);
		case 'properties': return lineMarks(text, '#!');
		case 'yml': case 'yaml': return lineMarks(text, '#');
		default: return text;
	}
}

function excerpt(line) {
	var t = line.replace(/^\s+|\s+$/g, '');
	return t.length > 160 ? t.substring(0, 160) : t;
}

function check(text, lang) {
	var src = text.replace(/\r\n/g, '\n');
	var raw = src.split('\n');
	var stripped = null;
	var out = [];
	RULES.forEach(function (r) {
		if (!groupOn(r.group) || !ruleOn(r.id) || r.langs.indexOf(lang) < 0) return;
		var flags = (r.flags || []).join('');
		var lines = raw;
		if (r.skipComments) {
			if (stripped === null) stripped = stripComments(src, lang).split('\n');
			lines = stripped;
		}
		if (r.max !== null && r.max !== undefined) {
			var g = new RegExp(r.regex, flags + 'g');
			var count = 0;
			var first = -1;
			for (var i = 0; i < lines.length; i++) {
				g.lastIndex = 0;
				var m;
				while ((m = g.exec(lines[i])) !== null) {
					count++;
					if (first < 0) first = i;
					if (m[0] === '') g.lastIndex++;
				}
			}
			if (count > r.max) out.push({ line: first + 1, rule: r, excerpt: count + '개 (기준 ' + r.max + ')' });
			return;
		}
		var re = new RegExp(r.regex, flags);
		for (var k = 0; k < lines.length; k++) {
			if (re.test(lines[k])) out.push({ line: k + 1, rule: r, excerpt: excerpt(raw[k]) });
		}
	});
	out.sort(function (a, b) {
		if (a.line !== b.line) return a.line - b.line;
		return a.rule.id < b.rule.id ? -1 : a.rule.id > b.rule.id ? 1 : 0;
	});
	return out;
}

function shown() {
	var sev = $('fSev').value;
	var grp = $('fGroup').value;
	return found.filter(function (f) { return (!sev || f.rule.severity === sev) && (!grp || f.rule.group === grp); });
}

function render() {
	var rows = shown();
	var box = $('result');
	box.textContent = '';
	var t = document.createElement('table');
	var head = document.createElement('tr');
	['줄', '묶음', '규칙', '등급', '원문'].forEach(function (h) {
		var th = document.createElement('th');
		th.textContent = h;
		head.appendChild(th);
	});
	var thead = document.createElement('thead');
	thead.appendChild(head);
	t.appendChild(thead);
	var tbody = document.createElement('tbody');
	rows.forEach(function (f) {
		var tr = document.createElement('tr');
		[f.line, groupName(f.rule.group), f.rule.id, f.rule.severity, f.excerpt].forEach(function (v, i) {
			var td = document.createElement('td');
			td.textContent = String(v);
			if (i === 3) td.className = f.rule.severity;
			if (i === 2) td.title = f.rule.message;
			tr.appendChild(td);
		});
		tbody.appendChild(tr);
	});
	t.appendChild(tbody);
	box.appendChild(t);
	$('count').textContent = rows.length + '/' + found.length + '건';
}

function run() {
	found = check($('src').value, $('lang').value);
	render();
	$('msg').textContent = '';
}

function copy() {
	var lines = ['줄\t묶음\t규칙\t등급\t원문'];
	shown().forEach(function (f) { lines.push([f.line, f.rule.group, f.rule.id, f.rule.severity, f.excerpt].join('\t')); });
	var text = lines.join('\n');
	var done = function () { $('msg').textContent = (lines.length - 1) + '행 복사'; $('msg').className = 'ok'; };
	if (navigator.clipboard && navigator.clipboard.writeText) {
		navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
	} else {
		fallbackCopy(text);
		done();
	}
}

function fallbackCopy(text) {
	var ta = document.createElement('textarea');
	ta.value = text;
	document.body.appendChild(ta);
	ta.select();
	try { document.execCommand('copy'); } catch (e) {}
	document.body.removeChild(ta);
}

load();
renderRules();
GROUPS.forEach(function (g) {
	var op = document.createElement('option');
	op.value = g[0];
	op.textContent = g[1];
	$('fGroup').appendChild(op);
});
$('run').onclick = run;
$('copy').onclick = copy;
$('fSev').onchange = render;
$('fGroup').onchange = render;
</script>
</body>
